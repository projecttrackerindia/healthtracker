<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Collect · Urban Health</title>
<meta name="theme-color" content="#0B8A7C">
<link rel="manifest" href="/tech/manifest.webmanifest">
<link rel="icon" href="/brand/svg/partner-icon.svg">
<style>
/* One screen at a time, one decision per screen. This is read at arm's length, in sunlight, by someone
   holding a bag in the other hand — so: 17px floor on body text, 56px floor on anything tappable, and no
   control that needs precision. The palette is its own: a technician who glances down should never wonder
   which app they are in. */
@font-face{font-family:Manrope;src:url(/a/manrope.a30ddcd3.woff2) format('woff2');font-weight:200 800;font-display:swap}
:root{
  /* Same system as the family app — same greys, same radii, same shadow language, same type. The only thing
     that changes is the accent, and that is not a free choice: BRAND.md assigns Care Teal #0B8A7C to
     partners (doctors, hospitals, pharmacies, labs) and Signal Blue to families. A technician glancing down
     should see Urban Health in the partner colour, not a different product. */
  --bg:#F2F2EF; --shell:#F2F2EF; --card:#ffffff; --soft:#F2F2EF;
  --ink:#111214; --mute:#6E6E73; --line:rgba(0,0,0,.08);
  --brand:#0B8A7C; --brand-ink:#ffffff; --brand-soft:#e4f2f0;
  --warn:#b45309; --bad:#b91c1c; --ok:#0B8A7C;
  --r:26px; --sh:0 10px 30px rgba(20,30,60,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0b0d12; --shell:#12151c; --card:#181c25; --soft:#1e232e;
  --ink:#eef1f7; --mute:#8d96a8; --line:#262c39;
  --brand:#3fbfae; --brand-ink:#04231f; --brand-soft:#11312c;
  --sh:none; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Geist","Noto Sans Devanagari","Noto Sans Telugu",Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px 120px}

/* header */
.top{display:flex;align-items:center;gap:10px;padding:8px 2px 14px}
.mark{width:38px;height:30px;flex:none}
.top b{font-size:22px;font-weight:700;letter-spacing:-.02em}
.top small{display:block;color:var(--mute);font-size:12.5px}
.top .grow{flex:1;min-width:0}
.pill{flex:none;font-size:12.5px;padding:6px 11px;border-radius:999px;background:var(--brand-soft);color:var(--brand);font-weight:600;white-space:nowrap}

/* a job */
.job{background:var(--card);border:0;border-radius:22px;box-shadow:0 1px 2px rgba(0,0,0,.04);padding:16px;margin-bottom:12px}
.job h2{margin:0 0 2px;font-size:20px;line-height:1.2;letter-spacing:-.015em}
.job .addr{color:var(--mute);margin:6px 0 0;font-size:15.5px}
.slot{display:inline-block;margin-bottom:8px;font-size:13px;font-weight:600;color:var(--brand);background:var(--brand-soft);padding:5px 10px;border-radius:999px}
.tests{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.tests i{font-style:normal;font-size:13.5px;background:var(--soft);border:0;border-radius:999px;padding:6px 12px}
.state{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;margin-bottom:10px}
.state::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.s-assigned{color:var(--mute)} .s-en_route{color:var(--go)} .s-arrived{color:var(--warn)}

/* the big controls */
.go{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:64px;margin-top:14px;
  border-radius:16px;background:var(--brand);color:var(--brand-ink);font-size:19px;font-weight:700;letter-spacing:-.01em}
.go:active{transform:scale(.99)}
.go[disabled]{opacity:.5}
.row2{display:flex;gap:10px;margin-top:10px}
.row2 a,.row2 button{flex:1 1 0;min-width:0;min-height:56px;display:flex;align-items:center;justify-content:center;gap:8px;
  border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;font-weight:600;
  text-decoration:none;white-space:nowrap}
.sharing{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:13.5px;color:var(--mute)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none;animation:p 1.8s ease-in-out infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.25}}

/* sign in */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:20px}
label{display:block;font-size:13.5px;color:var(--mute);margin:14px 0 6px;font-weight:600}
input{width:100%;min-height:54px;padding:0 14px;border-radius:13px;border:1px solid var(--line);background:var(--bg)}
input:focus{outline:2px solid var(--brand);outline-offset:1px}
.empty{text-align:center;color:var(--mute);padding:54px 20px}
.empty b{display:block;color:var(--ink);font-size:19px;margin-bottom:6px}
.err{background:#fff1f1;border:1px solid #f5c2c2;color:#8a1c1c;border-radius:12px;padding:11px 13px;font-size:14.5px;margin-top:12px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .err{background:#2a1414;border-color:#5b2020;color:#f3b4b4}}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,24px);
  background:var(--ink);color:var(--card);padding:13px 20px;border-radius:999px;opacity:0;transition:.22s;pointer-events:none;z-index:9;font-size:15px;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.spin{width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:r .7s linear infinite;display:inline-block}
@keyframes r{to{transform:rotate(360deg)}}

/* board 9 · technician app: today's visits with the route, and the doorstep checks with tubes */
.wrap{padding-bottom:110px}
.hd{display:flex;align-items:flex-end;gap:10px;padding:10px 2px 14px}.hd .grow{flex:1;min-width:0}
.eb{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
.hd h1,.dn{margin:2px 0 0;font-size:32px;line-height:1.08;letter-spacing:-.03em}.dn{font-size:36px}
.bell{position:relative;width:42px;height:42px;border-radius:21px;border:0;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08);display:grid;place-items:center;flex:none;cursor:pointer}.bell em{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:#FF3B30;color:#fff;font-style:normal;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}.alr{padding:10px 0;border-bottom:1px solid #F0F0F3}.alr b{display:block;font-size:15px}.alr small{display:block;font-size:13px;color:#6E6E73;margin-top:2px}.alr.nw b:before{content:'';display:inline-block;width:8px;height:8px;border-radius:4px;background:#2F5BFF;margin-right:8px;vertical-align:1px}
.av{width:42px;height:42px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px;flex:none}
.map{position:relative;height:200px;border-radius:22px;overflow:hidden;background:#EEF1F4;margin-bottom:12px}
.map .tl{position:absolute;inset:0;filter:saturate(.3) brightness(1.07)}.map .tl img{position:absolute;width:256px;height:256px}
.map svg{position:absolute;inset:0;width:100%;height:100%}.osm{position:absolute;right:8px;bottom:6px;font-size:10px;color:#6E6E73;text-decoration:none}
.map .eta{position:absolute;left:12px;top:12px;background:#fff;border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.stops{background:var(--card);border-radius:22px;padding:2px 14px;margin-bottom:12px}
.stop{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.stop:last-child{border-bottom:0}.stop .n{width:30px;height:30px;border-radius:50%;background:#8E8E93;color:#fff;display:grid;place-items:center;font-size:14px;font-weight:700;flex:none}
.stop.nx .n{background:var(--brand)}.stop .t{flex:1;min-width:0}.stop b{display:block;font-size:17px;letter-spacing:-.01em}.stop small{display:block;color:var(--mute);font-size:14px}
.tag{font-size:13px;font-weight:600;border-radius:999px;padding:4px 11px;background:#F2F2F5;color:#6E6E73;flex:none}.tag.b{background:#E8F1FF;color:#2F5BFF}.tag.g{background:#E8F8EC;color:#1B6E30}
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:60px;border-radius:999px;background:var(--brand);color:#fff;font-size:19px;font-weight:600;margin:4px 0 12px}
.big[disabled]{opacity:.45}.big svg{width:22px;height:22px}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kp div{background:var(--card);border-radius:18px;padding:12px 14px}.kp small{display:block;color:var(--mute);font-size:13.5px}.kp b{font-size:24px;letter-spacing:-.02em}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(540px,calc(100% - 24px));display:flex;justify-content:space-around;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:28px;box-shadow:0 8px 30px rgba(0,0,0,.12);padding:6px;z-index:8}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px;justify-content:center;font-size:12px;color:var(--mute);border-radius:22px}
.tabs button.on{color:var(--brand)}.tabs svg{width:22px;height:22px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--brand);font-size:18px;font-weight:500;padding:6px 0;min-height:44px}
.sub2{color:var(--mute);font-size:16px;margin:2px 0 14px}
.chk{background:var(--card);border-radius:22px;padding:2px 14px;margin-bottom:14px}
.ck{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;min-height:64px}
.ck:last-child{border-bottom:0}.ck>i{width:30px;height:30px;border-radius:50%;border:2px solid #C7C7CC;flex:none;display:grid;place-items:center;font-style:normal}
.ck.on>i{background:var(--brand);border-color:var(--brand)}.ck.on>i::after{content:"";width:12px;height:7px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:translateY(-2px) rotate(-45deg)}
.ck b{display:block;font-size:17px}.ck small{display:block;color:var(--mute);font-size:14px}
.ck input{width:130px;min-height:46px;margin-top:6px;font-size:20px;letter-spacing:.3em;text-align:center;font-variant-numeric:tabular-nums}
.sec{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:4px 2px 8px}
.tubes{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;margin-bottom:14px}
.tube{background:var(--card);border-radius:20px;padding:14px 8px 12px;text-align:center;min-height:132px;border:2px solid transparent}
.tube.cur{border-color:var(--brand)}.tube .vl{width:22px;height:54px;margin:0 auto 8px;border-radius:5px 5px 11px 11px;background:#F4ECEE;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.tube .vl::before{content:"";position:absolute;left:0;right:0;top:0;height:16px;background:var(--c)}
.tube b{display:block;font-size:15px}.tube small{font-size:13.5px;color:var(--mute)}.tube.ok small{color:var(--brand)}
.note{display:flex;gap:12px;background:#FFF8EC;border-radius:20px;padding:14px;margin-bottom:12px}.note svg{flex:none;color:#C27C0E}.note b{display:block;font-size:16px}.note span span{font-size:15px}
.foot{text-align:center;color:var(--mute);font-size:14px;margin:6px 0 0}
textarea{width:100%;min-height:64px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:10px 12px;font:inherit;font-size:15px}
.list{background:var(--card);border-radius:22px;padding:2px 14px}.li{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.li:last-child{border-bottom:0}.li .t{flex:1;min-width:0}.li b{display:block}.li small{color:var(--mute);font-size:14px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.cam{position:fixed;inset:0;background:#000;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}.cam video{width:100%;max-height:70vh;object-fit:cover}
.cam .box{position:absolute;top:30%;left:15%;right:15%;height:18%;border:3px solid #fff;border-radius:16px}.cam p{color:#fff;font-size:16px;margin:0}.cam button{color:#fff;font-size:17px;min-height:52px;padding:0 24px;border-radius:999px;background:#333}
/* Touch screens: every control gets a 44 pt touch area; the look stays the same */@media (pointer:coarse){.btn,.bkgs button,.bcmx,.vx,a.sm,button.sm{position:relative}.btn::after,.bkgs button::after,.bcmx::after,.vx::after,button.sm::after{content:'';position:absolute;inset:-6px -2px}select{min-height:44px}.bkgs{gap:10px 8px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* Calm in-app dialogs in place of the browser's prompt() and confirm(): same words, rounded sheet, 44 px buttons. */
function uhDlgCss(){if(!document.getElementById('uhdlgcss')){const st=document.createElement('style');st.id='uhdlgcss';st.textContent=`.uhdlg{position:fixed;inset:0;z-index:2147483000;background:rgba(10,14,24,.38);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;padding:12px;animation:uhdf .18s ease}@media(min-width:700px){.uhdlg{align-items:center}}@keyframes uhdf{from{opacity:0}}@keyframes uhdu{from{transform:translateY(20px);opacity:0}}
.uhdc{width:100%;max-width:420px;background:#fff;border-radius:24px;padding:22px 20px 16px;box-shadow:0 24px 70px rgba(0,0,0,.28);animation:uhdu .28s cubic-bezier(.2,.8,.2,1);font-family:inherit}.uhdc p{margin:0 0 14px;font-size:16px;line-height:1.45;color:#1D1D1F;white-space:pre-line}
.uhdi{display:block;width:100%;box-sizing:border-box;border:1px solid #D2D2D7;border-radius:14px;padding:12px 14px;font:inherit;font-size:17px;outline:0;margin:0 0 14px;resize:vertical;background:#fff;color:#1D1D1F}.uhdi:focus{border-color:#2F5BFF;box-shadow:0 0 0 4px rgba(47,91,255,.15)}
.uhdb{display:flex;gap:10px}.uhdb button{flex:1;height:50px;border-radius:25px;border:0;font:inherit;font-size:16px;font-weight:600;cursor:pointer}.uhdn{background:#F2F2EF;color:#1D1D1F}.uhdy{background:#1D1D1F;color:#fff}.uhdy.dn{background:#FF3B30}`;document.head.appendChild(st)}}
function uhDlg(msg,o){o=o||{};return new Promise(res=>{const d=document.createElement('div');d.className='uhdlg';const inp=o.input!==undefined;
 const num=inp&&(/code|₹|units|number|digits|amount|per home visit|percent|%/i.test(msg)||/^\d+(\.\d+)?$/.test(String(o.input||'')));
 d.innerHTML=`<div class="uhdc" role="dialog" aria-modal="true"><p></p>${inp?`<${o.long?'textarea rows="3"':'input'} class="uhdi" ${num?'inputmode="numeric"':''} autocomplete="off">${o.long?'</textarea>':''}`:''}<div class="uhdb"><button type="button" class="uhdn">${o.no||'Cancel'}</button><button type="button" class="uhdy${o.danger?' dn':''}">${o.ok||'OK'}</button></div></div>`;
 d.querySelector('p').textContent=msg;const i=d.querySelector('.uhdi');if(i)i.value=o.input||'';
 uhDlgCss();
 const done=v=>{d.remove();document.removeEventListener('keydown',kd);res(v)},kd=e=>{if(e.key==='Escape')done(inp?null:false);if(e.key==='Enter'&&!(i&&i.tagName==='TEXTAREA'))done(inp?i.value:true)};
 d.querySelector('.uhdn').onclick=()=>done(inp?null:false);d.querySelector('.uhdy').onclick=()=>done(inp?i.value:true);d.onclick=e=>{if(e.target===d)done(inp?null:false)};
 document.addEventListener('keydown',kd);document.body.appendChild(d);setTimeout(()=>(i||d.querySelector('.uhdy')).focus(),60)})}
const uhAsk=(m,v)=>uhDlg(m,{input:v===undefined||v===null?'':String(v),long:/why|reason|note|write/i.test(m),ok:'Done'});
const uhConfirm=(m,o)=>uhDlg(m,Object.assign({ok:/delete|remove|cancel|sign out|block|suspend|reject|stop/i.test(m)?'Yes':'OK',danger:/delete|remove|block|suspend|cannot be undone/i.test(m)},o||{}));

(() => {
"use strict";
const $ = s => document.querySelector(s);
const E = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// The partner lock-up from web/brand — the cross whose arm becomes a heartbeat, in Care Teal. Inlined rather
// than fetched so the first screen paints with no network.
const MARK = `<svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><path d="M21.5 15a4 4 0 0 1 4-4h3a4 4 0 0 1 4 4v34a4 4 0 0 1-4 4h-3a4 4 0 0 1-4-4V37.5H13a4 4 0 0 1-4-4v-3a4 4 0 0 1 4-4h8.5z" fill="var(--brand)"/><path d="M32 32h5l3.2-8 4.6 16 3.2-8h0.4" fill="none" stroke="var(--brand)" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="55.2" cy="32" r="3.3" fill="var(--brand)"/></svg>`;

let S = { me: null, jobs: [], busy: false, err: "", mustChange: false, tab: "today", door: null, doors: {}, today: null, samples: [], week: [], perVisit: 0 };
let watchId = null, pinging = null;

function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); setTimeout(() => el.classList.remove("on"), 2600); }

async function api(path, opt = {}) {
  const r = await fetch("/api" + path, {
    method: opt.body ? "POST" : "GET",
    headers: opt.body ? { "content-type": "application/json" } : {},
    body: opt.body ? JSON.stringify(opt.body) : undefined,
    credentials: "same-origin", cache: "no-store"
  });
  let j = {}; try { j = await r.json() } catch (e) {}
  if (!r.ok) throw Object.assign(new Error(j.detail || ("Error " + r.status)), { status: r.status });
  return j;
}

// ---- position sharing -------------------------------------------------------------------------------------
// Runs only while a job is en route or at the door, and stops the moment it is not. The screen says so while
// it is happening: somebody's location is being shared and they should be able to see that at a glance.
function startSharing(job) {
  stopSharing();
  if (!navigator.geolocation) return;
  const send = pos => {
    const c = pos.coords;
    api(`/partner/tech/jobs/${job.id}/ping`, { body: { lat: c.latitude, lng: c.longitude, accuracy: c.accuracy || 0, heading: Number.isFinite(c.heading) ? c.heading : null } })
      .catch(() => {});   // a dropped ping is not worth interrupting the technician for
  };
  watchId = navigator.geolocation.watchPosition(send, () => {}, { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 });
  pinging = setInterval(() => navigator.geolocation.getCurrentPosition(send, () => {}, { enableHighAccuracy: true, maximumAge: 15000 }), 15000);
}
function stopSharing() {
  if (watchId != null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  if (pinging) { clearInterval(pinging); pinging = null; }
}

// ---- screens ----------------------------------------------------------------------------------------------
function signIn() {
  return `<div class="top">${MARK}<div class="grow"><b>Collect</b><small>Urban Health for partners</small></div></div>
  <div class="card">
    <h2 style="margin:0 0 4px;font-size:21px;letter-spacing:-.015em">Sign in</h2>
    <p style="color:var(--mute);margin:0;font-size:15px">Use the details your lab gave you.</p>
    <form id="f">
      <label for="e">Mobile number</label><input id="e" type="text" autocomplete="username" inputmode="tel" placeholder="The number your lab registered" required>
      <label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required>
      ${S.err ? `<div class="err">${E(S.err)}</div>` : ""}
      <button class="go" type="submit" ${S.busy ? "disabled" : ""}>${S.busy ? '<span class="spin"></span>' : "Sign in"}</button>
    </form>
  </div>`;
}

// The lab handed this person a one-time password across a counter. Until they replace it, that slip of paper
// is a working sign-in to a screen holding families' addresses and phone numbers.
function choosePw() {
  return `<div class="top">${MARK}<div class="grow"><b>Collect</b><small>${E(S.me.store || "")}</small></div></div>
  <div class="card">
    <h2 style="margin:0 0 4px;font-size:21px;letter-spacing:-.015em">Choose your password</h2>
    <p style="color:var(--mute);margin:0;font-size:15px">The one your lab gave you works once. Pick your own before you start — you will see families' addresses and phone numbers in here.</p>
    <form id="cf">
      <label for="p0">Password from your lab</label><input id="p0" type="password" autocomplete="current-password" required>
      <label for="p1">New password</label><input id="p1" type="password" autocomplete="new-password" minlength="10" required>
      <p style="color:var(--mute);margin:6px 0 0;font-size:14px">At least 10 characters.</p>
      ${S.err ? `<div class="err">${E(S.err)}</div>` : ""}
      <button class="go" type="submit" ${S.busy ? "disabled" : ""}>${S.busy ? '<span class="spin"></span>' : "Save and start"}</button>
    </form>
  </div>`;
}

const km = (a, b) => { const R = 6371, r = x => x * Math.PI / 180, dl = r(b.lat - a.lat), dg = r(b.lng - a.lng);
  return 2 * R * Math.asin(Math.sqrt(Math.sin(dl / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dg / 2) ** 2)); };
let HERE = null;   // the phone's own position, only to draw the route and the minutes to the next stop

// The route on real map tiles: the stops in order, numbered, joined in partner teal; the phone is the violet dot.
function routeMap(js) {
  const stops = js.filter(j => j.lat && j.lng), pts = stops.map(j => ({ lat: +j.lat, lng: +j.lng }));
  const all = (HERE ? [HERE] : []).concat(pts);
  const next = js[0], mins = HERE && next && next.lat ? Math.max(1, Math.round(km(HERE, { lat: +next.lat, lng: +next.lng }) / 20 * 60)) : 0;
  if (!all.length) return "";
  const W = Math.min(window.innerWidth - 28, 532), H = 200, P = 34;
  const X = (lng, z) => (lng + 180) / 360 * 256 * 2 ** z, Y = (lat, z) => { const r = lat * Math.PI / 180; return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * 256 * 2 ** z; };
  let z = 16;
  while (z > 10) { const xs = all.map(p => X(p.lng, z)), ys = all.map(p => Y(p.lat, z)); if (Math.max(...xs) - Math.min(...xs) < W - 2 * P && Math.max(...ys) - Math.min(...ys) < H - 2 * P) break; z--; }
  const xs = all.map(p => X(p.lng, z)), ys = all.map(p => Y(p.lat, z)), cx = (Math.max(...xs) + Math.min(...xs)) / 2, cy = (Math.max(...ys) + Math.min(...ys)) / 2;
  const x0 = cx - W / 2, y0 = cy - H / 2, px = p => X(p.lng, z) - x0, py = p => Y(p.lat, z) - y0;
  let tiles = "";
  for (let tx = Math.floor(x0 / 256); tx * 256 < x0 + W; tx++) for (let ty = Math.floor(y0 / 256); ty * 256 < y0 + H; ty++)
    tiles += `<img alt="" src="https://tile.openstreetmap.org/${z}/${tx}/${ty}.png" style="left:${tx * 256 - x0}px;top:${ty * 256 - y0}px">`;
  const line = all.map(p => `${px(p).toFixed(1)},${py(p).toFixed(1)}`).join(" ");
  return `<div class="map"><div class="tl">${tiles}</div><svg viewBox="0 0 ${W} ${H}" aria-hidden="true">
    <polyline points="${line}" fill="none" stroke="#0B8A7C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map((p, i) => `<circle cx="${px(p)}" cy="${py(p)}" r="12" fill="${i ? "#8E8E93" : "#0B8A7C"}" stroke="#fff" stroke-width="3"/><text x="${px(p)}" y="${py(p) + 4.5}" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="system-ui">${i + 1}</text>`).join("")}
    ${HERE ? `<circle cx="${px(HERE)}" cy="${py(HERE)}" r="9" fill="#5E5CE6" stroke="#fff" stroke-width="3"/>` : ""}</svg>
    ${mins && next ? `<span class="eta">${mins} min to ${E(first(next.member))}</span>` : ""}<a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener" class="osm">© OpenStreetMap</a></div>`;
}

async function scanTube(tube) {
  // The phone camera reads the tube's barcode where the browser can; otherwise it is typed from the label.
  let code = "";
  if ("BarcodeDetector" in window && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    try { code = await cameraScan(); } catch (e) { code = ""; }
  }
  if (!code) code = (await uhAsk(`Barcode on the ${tube.toLowerCase()}:`) || "").trim();
  return code.replace(/[^A-Za-z0-9-]/g, "").slice(0, 24);
}
function cameraScan() {
  return new Promise(async res => {
    const d = document.createElement("div");
    d.className = "cam";
    d.innerHTML = `<video playsinline autoplay muted></video><div class="box"></div><p>Point at the barcode</p><button>Type it instead</button>`;
    document.body.appendChild(d);
    let st, done = false;
    const end = v => { if (done) return; done = true; if (st) st.getTracks().forEach(t => t.stop()); d.remove(); res(v); };
    d.querySelector("button").onclick = () => end("");
    try {
      st = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      const v = d.querySelector("video"); v.srcObject = st;
      const bd = new BarcodeDetector();
      const tick = async () => { if (done) return; try { const r = await bd.detect(v); if (r[0]) return end(r[0].rawValue); } catch (e) {} setTimeout(tick, 250); };
      tick();
    } catch (e) { end(""); }
  });
}

  const scanOne = async tube => { const code = await scanTube(tube); if (!code) return; const D = S.doors[S.door];
    if (Object.values(D.tubes).includes(code)) { toast("That barcode is already on another tube."); return; } D.tubes[tube] = code; render(); };
  document.querySelectorAll("[data-scan],[data-tube]").forEach(b => b.onclick = () => scanOne(b.dataset.scan || b.dataset.tube));
  const cl = $("[data-collect]"); if (cl) cl.onclick = async () => { const D = S.doors[S.door];
    cl.disabled = true; cl.innerHTML = '<span class="spin"></span>';
    try {

      await api(`/partner/tech/jobs/${S.door}/collected`, { body: { note: D.note || "", code: D.code, sample: Object.values(D.tubes).join("-").slice(0, 24) } });

    } catch (e) { toast(e.message || "Could not do that"); cl.disabled = false; cl.textContent = "Sample collected"; } };
  const so = $("#so"); if (so) so.onclick = async () => { try { await api("/partner/logout", { body: {} }); } catch (e) {} S.me = null; stopSharing(); render(); };

  // share position for whichever job is live; stop when none is
  const live = S.jobs.find(j => j.status === "en_route" || j.status === "arrived");
  if (live) startSharing(live); else stopSharing();
}

async function move(id, what, btn) {

    if (what === "collected") {
      code = (await uhAsk("Doorstep code — ask the family for the 4 digits in their app:") || "").trim();
      if (!code) { btn.disabled = false; btn.textContent = "Collected the sample"; return; }
      sample = (await uhAsk("Sample barcode (scan or type; blank uses the order number):") || "").trim();
    }
    await api(`/partner/tech/jobs/${id}/${what}`, { body: { note: "", code, sample } });
    if (what === "collected") toast("Sample collected. The family has been told.");
    if (what === "arrived") { S.door = id; }
    await load(); scrollTo(0, 0);
  } catch (e) {
    toast(e.message || "Could not do that");
    btn.disabled = false; render();
  }
}

async function load() {
  try {
    const me = await api("/partner/me");
    const u = me.user || me;
    S.me = { name: u.name || u.phone || u.email, store: (me.store && me.store.name) || "",
             rating: u.rating || 0, ratingN: u.ratingN || 0 };
    S.mustChange = !!u.mustChange;
    // Until they have chosen a password, the one the lab wrote on a slip is the only one there is. Don't
    // fetch anybody's address until that slip has stopped being a way in.
    if (S.mustChange) { S.jobs = []; render(); return; }
    const j = await api("/partner/tech/jobs");
    S.jobs = j.jobs || []; S.today = j.today || null; S.samples = j.samples || []; S.week = j.week || []; S.perVisit = j.perVisit || 0;
  } catch (e) {
    if (e.status === 401) { S.me = null; stopSharing(); }
    else if (e.status === 403) { S.err = e.message; S.me = null; }
  }
  render();
}

// refresh when the screen comes back, and every half minute while it is open
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.me) load(); });
setInterval(() => { if (!document.hidden && S.me) load(); }, 30000);
load();
})();
</script>
</body>

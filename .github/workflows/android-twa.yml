name: Android apps (users + partners)

# Builds the two Trusted Web Activity apps in android/ and signs them with the release key held in
# repository secrets. Each run uploads both APKs; a manual run with "release" ticked also publishes them
# as a GitHub Release. The website keeps serving the copies committed in site/downloads/.
#
# Secrets (Settings > Secrets and variables > Actions):
#   TWA_KEYSTORE_BASE64    base64 of urbanhealth-release.jks
#   TWA_KEYSTORE_PASSWORD  its password (store and key use the same one)

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-twa.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish the APKs as a GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.TWA_KEYSTORE_BASE64 != '' }}
      # must match ANDROID_CERT_SHA256 in server.py, or the apps open with a browser bar
      EXPECTED_SHA256: "98:CB:93:0A:95:BE:59:E0:E0:F7:69:F6:95:D0:35:0A:0E:1C:72:FE:4A:58:CE:D3:9F:62:9E:F2:E7:3C:E3:B0"
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;35.0.0" >/dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Signing key
        if: ${{ env.HAS_KEY == 'true' }}
        env:
          KS_B64: ${{ secrets.TWA_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=urbanhealth\nkeyPassword=%s\n' "$RUNNER_TEMP/release.jks" "$KS_PW" "$KS_PW" > keystore.properties
      - name: Build
        run: gradle --no-daemon assembleRelease
      - name: Check the signature matches the website
        if: ${{ env.HAS_KEY == 'true' }}
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          want=$(echo "$EXPECTED_SHA256" | tr -d ':' | tr 'A-F' 'a-f')
          for f in app/build/outputs/apk/*/release/*.apk; do
            got=$("$BT/apksigner" verify --print-certs "$f" | sed -n 's/.*SHA-256 digest: //p' | head -1)
            echo "$f $got"; [ "$got" = "$want" ] || { echo "::error::$f is signed with a different key"; exit 1; }
          done
          mkdir -p ../out
          cp app/build/outputs/apk/user/release/app-user-release.apk ../out/urbanhealth.apk
          cp app/build/outputs/apk/partner/release/app-partner-release.apk ../out/urbanhealth-partner.apk
      - name: Clean up the key
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        if: ${{ env.HAS_KEY == 'true' }}
        with:
          name: urbanhealth-android-apks
          path: out/*.apk
      - name: GitHub Release
        if: ${{ env.HAS_KEY == 'true' && inputs.release }}
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/.*versionName "\(.*\)"/\1/p' android/app/build.gradle)
          gh release create "android-v$v" out/urbanhealth.apk out/urbanhealth-partner.apk \
            --title "Urban Health Android $v" --notes "Urban Health (users) and Urban Health Partner, signed release APKs." \
            || gh release upload "android-v$v" out/urbanhealth.apk out/urbanhealth-partner.apk --clobber

name: Deploy to Google Cloud Run

# Merging to main deploys. The cut-over this file was waiting for is done — Railway is gone and Google Cloud is
# the only hosting — and deploying by hand through a browser driving Cloud Shell has failed on extension blocks,
# transferred sessions, renderer timeouts and, twice in one evening, a gcloud config that came back with no
# account selected. Both of those failures were silent: the script is backgrounded, so the terminal says nothing,
# and the previous revision keeps answering. Merged code sat undeployed for half an hour each time.
#
# Paths are filtered because a README change should not restart a container that is serving families.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".github/workflows/android.yml"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      note:
        description: "What is being deployed (shows in the run list)"
        required: false

permissions:
  contents: read
  id-token: write   # keyless login to Google (Workload Identity Federation) — no service-account key is stored anywhere

concurrency:
  group: gcp-deploy
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'asia-south1' }}
  # The Maps browser key. It ships in the HTML and is restricted by HTTP referrer, so it is a variable rather
  # than a secret — calling it a secret would only hide it from the people who need to check it. Unset is fine:
  # deploy.sh then leaves whatever env.yaml already holds.
  GOOGLE_MAPS_KEY: ${{ vars.GOOGLE_MAPS_KEY }}

jobs:
  # Nothing in CI ran the suite before this. The deploy workflow would have shipped a red build without
  # comment, and the only thing standing between a broken main and production was somebody remembering to run
  # pytest locally first.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"        # same as the Dockerfile base
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push the image
        run: |
          set -euo pipefail
          source deploy/gcp/config.sh
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          TAG="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${SERVICE}"
          docker build -t "$TAG:${GITHUB_SHA}" -t "$TAG:latest" .
          docker push "$TAG:${GITHUB_SHA}"
          docker push "$TAG:latest"
          echo "IMAGE=$TAG:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run and verify the commit is live
        if: vars.DEPLOY_TARGET != 'vm' 
        # deploy.sh exits non-zero unless /api/health reports this exact commit, so a deploy that silently did
        # not happen turns the run red instead of green.
        run: PREBUILT=1 ./deploy/gcp/deploy.sh

      - name: Release to the VM and verify the commit is live
        # Set the repository variable DEPLOY_TARGET=vm once deploy/vm/provision.sh has run. Until then this
        # is skipped and Cloud Run stays the target, so the switch is one variable and no code change.
        if: vars.DEPLOY_TARGET == 'vm'
        run: |
          set -euo pipefail
          source deploy/vm/config.sh
          SHA=$(git rev-parse --short=10 HEAD)
          # Stamp first. Without this the VM serves APP_VERSION=dev and the verification below compares a
          # commit against the literal string "dev" forever — a check that cannot fail is not a check.
          ( cd deploy/gcp && ./stamp-env.sh "$SHA" )
          # env.yaml and secrets.txt travel with the release so the settings on the box match the commit.
          gcloud compute scp --zone "$ZONE" --quiet \
            deploy/gcp/env.yaml deploy/gcp/secrets.txt "$VM":/tmp/
          gcloud compute ssh "$VM" --zone "$ZONE" --quiet --command "
            set -e
            sudo install -d -m 0755 /opt/urbanhealth/repo/deploy/gcp
            sudo install -m 0644 /tmp/env.yaml /tmp/secrets.txt /opt/urbanhealth/repo/deploy/gcp/
            sudo urbanhealth-release '${IMAGE%:*}:${GITHUB_SHA}' '$SHA'
          "

      - name: Say what is live
        if: always()
        continue-on-error: true    # a summary must never be the thing that fails a run
        run: |
          # When the auth step fails, setup-gcloud is skipped and there is no gcloud on the runner at all. The
          # first version of this step called it anyway, so a failed deploy produced two red steps and no
          # summary — unreadable exactly when something has gone wrong and you need to read it.
          if command -v gcloud >/dev/null 2>&1; then
            URL=$(gcloud run services describe tht --region "$REGION" --format='value(status.url)' 2>/dev/null || true)
          else
            URL=""
          fi
          {
            echo "### ${{ job.status == 'success' && 'Deployed' || 'Deploy failed' }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`${GITHUB_SHA::10}\` |"
            if [ -n "$URL" ]; then
              echo "| service | $URL |"
              echo "| /api/health | \`$(curl -fsS --max-time 10 "$URL/api/health" 2>/dev/null || echo unreachable)\` |"
            else
              echo "| service | not reached |"
              echo ""
              echo "The Google login step failed, so nothing was built or deployed and production is untouched."
              echo "Run \`deploy/gcp/wif.sh\` once, then add \`GCP_WIF_PROVIDER\` and \`GCP_DEPLOY_SA\` as secrets"
              echo "and \`GCP_PROJECT_ID\` as a variable under Settings → Secrets and variables → Actions."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

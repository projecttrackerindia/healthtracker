3:['0.1–0.2 mm','—','a grain of salt','🧂',['Fertilisation happens about two weeks after the first day of your last period, so "week 3" is really the first week of the embryo\'s life.','The fertilised egg divides again and again into a hollow ball of about 100 cells called a blastocyst.','It travels down the uterine tube toward the uterus over 4–5 days.'],['You will not feel pregnant yet; a pregnancy test is still negative.','Some notice very light "implantation" spotting near the end of this week.'],'Start folic acid 400 µg a day if you have not already. It lowers the risk of neural-tube defects.'],

async function swap(sex){$('#load').style.display='block';STATE.sex=sex;SET=await loadSex(sex,STATE.hd&&sex==='male');build(SET);SHAPED=null;shape();$('#load').style.display='none'}
async function detail(){const want=U.hd||(!(navigator.connection||{}).saveData&&(navigator.connection||{}).type==='wifi');if(want===!!STATE.hd||!SRC[STATE.sex].hd){if(MODE==='settings')mode('settings');return}
 STATE.hd=want;await swap(STATE.sex);mode(MODE)}
/* ---- 8 · search, quiz, cross-section, hologram ---- */
function mSearch(){shape();CAM(10.5,1.0,-.2);head(who()+' · '+T('body').toUpperCase(),T('search'),'');
 $('#extra').innerHTML=`<div class="srch glass" style="pointer-events:auto"><span>⌕</span><input id="q" placeholder="Heart, femur, vagus nerve…" autocomplete="off" style="flex:1;border:0;background:none;font:inherit;outline:0"></div><div class="res glass" id="res" style="pointer-events:auto;display:none"></div>`;
 const q=$('#q');q.focus();q.oninput=()=>{const s=q.value.trim().toLowerCase();const r=$('#res');if(s.length<2){r.style.display='none';return}const hits=[];SET.names.forEach((n,k)=>{if(n.toLowerCase().includes(s)&&hits.length<6&&!hits.some(h=>clean(SET.names[h])===clean(n)))hits.push(k)});
  r.style.display=hits.length?'':'none';r.innerHTML=hits.map(k=>`<div onclick="findPart(${k})">${esc(clean(SET.names[k]))} · ${esc(infoP(SET.meta.parts[k],SET.names[k])[0])}</div>`).join('')}}
function findPart(k){const p=SET.meta.parts[k],l=p.l??1;const key=(LAYERS.find(x=>x[2]===l)||LAYERS[0])[0];setLayer(key);clearGlows();const nm=SET.names[k];glow(new RegExp('^'+nm.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'$'),0x0A84FF,l,1);$('#res').style.display='none';
 const [sys,desc]=infoP(p,nm);sheet(`<div class="cn">${esc(clean(nm))}</div><div class="eb" style="margin:2px 0 0">${esc(sys)}</div><p class="cd">${esc(cap(desc.replace(/^[^:]+:\s*/,'')))}</p>`);
 const c=new THREE.Box3().setFromBufferAttribute(new THREE.BufferAttribute(partPos(SET,p),3)).getCenter(new THREE.Vector3());goalY=c.y*.8+.4;goalZ=Math.max(6.5,HOME.z*.62)}
const QUIZ=[['the organ that makes insulin','pancreas'],['the organ that filters blood to make urine','kidney'],['the organ that makes bile','liver'],['the organ that pumps blood','heart'],['where food is mixed with acid','stomach'],['the gland in the neck that sets your metabolism','thyroid'],['the organs where oxygen enters the blood','lung'],['the organ that stores urine','bladder']];
let QZ=null;
function mQuiz(){shape();CAM(HOME0.z*.8,HOME0.y+.6,0);QZ={i:0,score:0,order:QUIZ.map((q,i)=>i).sort(()=>Math.random()-.5).slice(0,6)};quizAsk()}
function quizAsk(){clearGlows();const q=QUIZ[QZ.order[QZ.i]];head(who()+' · '+T('quiz').toUpperCase(),T('quiz'),`Tap ${q[0]}.`);sheet(`<div class="row" style="justify-content:space-between"><div class="cn" style="font-size:18px">Question ${QZ.i+1} of ${QZ.order.length}</div><span class="pill ok">Score ${QZ.score}</span></div><p class="cd">Tap ${esc(q[0])} on the body.</p>`)}
function quizTap(x,y){if(!QZ||QZ.done)return;const h=pick(x,y);if(!h)return;const q=QUIZ[QZ.order[QZ.i]],nm=SET.names[h.k],right=ORGRE[q[1]].test(nm);if(right)QZ.score++;
 clearGlows();glow(ORGRE[q[1]],0x30D158,3,1);if(!right)glow(new RegExp('^'+nm.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'$'),0xFF453A,3,.8);
 const last=QZ.i===QZ.order.length-1;sheet(`<div class="row" style="justify-content:space-between"><div class="cn" style="font-size:18px">${right?'Right!':'Not quite'}</div><span class="pill ok">Score ${QZ.score}</span></div><p class="cd">${right?'':`That's the <b>${esc(clean(nm))}</b>. `}${esc(cap(q[0]))} is the <b>${esc(TX.en[q[1]])}</b>, shown in green.</p>
 <button class="btn pri" style="width:100%;margin-top:12px" onclick="${last?'QZ.done=1;mode(\'quiz\')':'QZ.i++;quizAsk()'}">${last?`Done · ${QZ.score} of ${QZ.order.length}. Play again`:'Next question'}</button>`)}
let CUTP=null;
function mCut(){shape();CAM(HOME0.z*.85,HOME0.y,-.6);head(who()+' · '+T('cut').toUpperCase(),'Cross-section','Slide to cut through the body.');R.localClippingEnabled=true;CUTP=new THREE.Plane(new THREE.Vector3(0,0,-1),.3);
 for(const l in LAY){LAY[l].material.clippingPlanes=[CUTP];LAY[l].material.side=THREE.DoubleSide;LAY[l].visible=[0,1,2,3,4].includes(+l)}LAY[0].material.opacity=.5;
 sheet(`<div class="q" style="margin-top:0">Depth</div><input type="range" min="-60" max="60" value="30" style="width:100%" oninput="CUTP.constant=this.value/100" aria-label="Cut depth"><div class="chips2" style="margin-top:10px"><span class="on" onclick="cutAxis(this,0,0,-1)">Front to back</span><span onclick="cutAxis(this,-1,0,0)">Side to side</span><span onclick="cutAxis(this,0,-1,0)">Top to bottom</span></div>`)}
function cutAxis(el,x,y,z){CUTP.normal.set(x,y,z);CUTP.constant=y?2:.3;el.parentNode.querySelectorAll('span').forEach(s=>s.classList.toggle('on',s===el))}
let HOLO=null;
function mHolo(){shape();CAM(HOME0.z,HOME0.y,-.2);head(who()+' · '+T('holo').toUpperCase(),T('holo'),'');document.body.classList.add('holo');HOLO={};
 for(const l in LAY){const m=LAY[l];HOLO[l]={mat:m.material,vis:m.visible};m.visible=[0,2,3,4].includes(+l);m.material=new THREE.MeshBasicMaterial({color:+l===4?0xff4d6d:+l===2?0x9fe7ff:0x5ad1ff,wireframe:+l===0,transparent:true,opacity:+l===0?.12:.35,blending:THREE.AdditiveBlending,depthWrite:false})}}
function unholo(){for(const l in HOLO){if(!LAY[l])continue;LAY[l].material.dispose();LAY[l].material=HOLO[l].mat;LAY[l].visible=HOLO[l].vis}HOLO=null}

/* realistic: every layer solid at once, true colours, dark stage, optional half cut (like the Z-Anatomy atlas) */
let REAL=null;
async function mReal(){if(STATE.sex!=='male'){REAL={back:STATE.base};await swap('male')}shape();document.body.classList.add('real');
 for(const l in LAY){const m=LAY[l],mt=m.material;m.visible=+l!==0;mt.transparent=false;mt.opacity=1;mt.depthWrite=true;mt.side=THREE.DoubleSide;mt.clearcoat=.25;mt.roughness=.55}
 LAY[0].visible=false;
 R.localClippingEnabled=true;CUTP=new THREE.Plane(new THREE.Vector3(-1,0,0),0);for(const l in LAY)LAY[l].material.clippingPlanes=[CUTP];
 CAM(HOME0.z*.62,HOME0.y+1.6*body.scale.y,-1.35);goal.x=0;
 head(who()+' · REALISTIC','Inside the body','Skin, muscle, bone, organs, vessels and nerves together. Slide to cut.');
 sheet(`<div class="q" style="margin-top:0">Cut</div><input type="range" min="-60" max="60" value="0" style="width:100%" oninput="CUTP.constant=this.value/100" aria-label="Cut position">
 <div class="chips2" style="margin-top:10px"><span class="on" onclick="cutAxis(this,-1,0,0)">Side view</span><span onclick="cutAxis(this,0,0,-1)">Front view</span><span onclick="CUTP.constant=99;this.parentNode.querySelectorAll('span').forEach(s=>s.classList.toggle('on',s===this))">Whole body</span></div>`)}

/* calm: a natural body; only what matters right now comes forward, in true colour */
function calm(focus){shape();document.body.classList.remove('real');setLayer('organs');for(const l in LAY){const m=LAY[l];m.visible=+l===0||+l===3}
 const sk=LAY[0].material;sk.color.set(0xC8987A).convertSRGBToLinear();sk.opacity=focus&&focus.length?.42:.97;sk.transparent=true;sk.depthWrite=!(focus&&focus.length);sk.onBeforeCompile=()=>{};sk.needsUpdate=true;sk.roughness=.55;sk.clearcoat=.15;
 LAY[3].visible=false;clearGlows();(focus||[]).forEach(f=>{const g=glow(f.re,f.hex,3,1);if(g){const mm=g.children[0];mm.material.emissiveIntensity=.06;mm.material.onBeforeCompile=TISSUE(3);mm.renderOrder=10;mm.material.depthTest=false;mm.material.depthWrite=false;if(f.beat)PULSE={g,bpm:f.beat}}})}
/* ---- boot ---- */
let HOME0={z:16,y:0};
function parseSet(buf,names){const dv=new DataView(buf),n=dv.getUint32(0,true),meta=JSON.parse(new TextDecoder().decode(new Uint8Array(buf,4,n)));return{buf,base:4+n,meta,names}}
async function boot(d){DATA=d;document.documentElement.lang=U.lang;const sex=d.person.sex==='female'?'female':'male';STATE.base=sex;STATE.sex=sex;STATE.hd=false;
 SET=await loadSex(sex,false);build(SET);shape();HOME0={z:HOME.z,y:HOME.y};$('#load').style.display='none';
 modes();await mode(d.start||'explore');
 if((navigator.connection||{}).type==='wifi'||U.hd)setTimeout(detail,1500)}
addEventListener('message',e=>{if(e.origin!==location.origin||!e.data||e.data.type!=='uh-body-data')return;boot(e.data.data)});
/* preview without the app: /body?demo */
if(/[?&]demo\b/.test(location.search))boot({person:{name:'You',age:35,sex:'male'},findings:[],meds:[],vitals:null,canWrite:false});
fit();frame();send('ready');

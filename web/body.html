3:['0.1–0.2 mm','—','a grain of salt','🧂',['Fertilisation happens about two weeks after the first day of your last period, so "week 3" is really the first week of the embryo\'s life.','The fertilised egg divides again and again into a hollow ball of about 100 cells called a blastocyst.','It travels down the uterine tube toward the uterus over 4–5 days.'],['You will not feel pregnant yet; a pregnancy test is still negative.','Some notice very light "implantation" spotting near the end of this week.'],'Start folic acid 400 µg a day if you have not already. It lowers the risk of neural-tube defects.'],

  if(rs.some(x=>/run like/.test(x[0])))F.push({text:'Avoid easy runs like 1234 or abcd.'});
  if(window.UHFX){UHFX.paint(box,UHFX.guide(v,F,sc>=4));if(!f.querySelector('.usug')){const g=document.createElement('button');g.type='button';g.className='usug';g.textContent='Suggest a strong password';g.onclick=()=>{const x=UHFX.suggest();[pw,f.querySelector('[data-confirm]')].forEach(i=>{if(i){i.value=x;i.type='text';i.dispatchEvent(new Event('input',{bubbles:true}))}});toast('Strong password filled in. Save it in your password manager.')};box.after(g)}}
  else box.textContent=v.length<12?`${12-v.length} more characters`:'';}
 const sb=f.querySelector('button.btn.pri,button[type=submit]');if(sb&&f.querySelector('#pwr')){sb.disabled=!!fails||pw.value.length<12;sb.style.opacity=sb.disabled?.45:1}},true);
</script>

function trendSvg(pid,f){const k=(f.code||'')||(f.test||'').toLowerCase().replace(/[^a-z0-9]/g,'');const pts=(REC[pid]||[]).filter(r=>r.kind==='report').flatMap(r=>(r.findings||[]).filter(x=>(x.code||(x.test||'').toLowerCase().replace(/[^a-z0-9]/g,''))===k&&!isNaN(parseFloat(x.value))).map(x=>({d:r.day,v:parseFloat(x.value),fl:qualFlag(x)}))).sort((a,b)=>(a.d||'').localeCompare(b.d||'')).slice(-6);
 if(pts.length<2)return'';const vs=pts.map(p=>p.v),lo=Math.min(...vs),hi=Math.max(...vs),pad=(hi-lo||1)*.35,y=v=>8+(1-(v-(lo-pad))/((hi+pad)-(lo-pad)))*44,x=i=>14+i*(272/(pts.length-1));
 return`<svg viewBox="0 0 300 74" width="100%" height="74" aria-label="Trend"><polyline points="${pts.map((p,i)=>x(i)+','+y(p.v)).join(' ')}" fill="none" stroke="#0071E3" stroke-width="2.5" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="${i===pts.length-1?5:3.5}" fill="${p.fl==='normal'?'#34C759':'#FF9F0A'}"/><text x="${x(i)}" y="72" font-size="10" fill="#8E8E93" text-anchor="middle">${new Date(p.d+'T00:00').toLocaleDateString('en-IN',{month:'short',year:'2-digit'})}</text>`).join('')}</svg>`}
function compareBlock(p,r){const c=r.compare||[];if(!c.some(x=>x.dir!=='first'))return'';const b=c.filter(x=>x.dir==='better'),w=c.filter(x=>x.dir==='worse'),hero=b[0]||w[0],prevDay=(c.find(x=>x.prevDay)||{}).prevDay;

 return`${hero?`<div class="card" style="margin-top:12px;background:linear-gradient(135deg,${b[0]?'#E8F8EE':'#FFF1E0'},#fff)"><div class="cat" style="color:${b[0]?'#1E7B3C':'#B35C00'}">${b[0]?'▲ IMPROVED':'▼ NEEDS ATTENTION'} SINCE ${esc(fmtDate(prevDay)).toUpperCase()}</div><p style="font-size:16px;font-weight:600;margin:6px 0 0;line-height:1.4">${esc(hero.test)} ${b[0]?'came down':'went'} from ${esc(hero.prev)} to ${esc(hero.now)}${hero.unit?' '+esc(hero.unit):''}${b[0]&&hero.flag==='normal'?' — now in range.':'.'}</p>${f?trendSvg(p.id,f):''}</div>`:''}
 <div class="sect">SINCE LAST TIME</div><div class="list">${c.map(x=>{const d=DIRS[x.dir]||DIRS.changed;return`<div class="li" style="padding:11px 16px"><span style="flex:1">${esc(x.test)}</span><span style="font-weight:700;color:${d[1]};font-size:14px;margin-right:8px">${x.dir==='first'?'<span class="sub" style="font-weight:500">first time</span>':`${d[0]} ${esc(x.prev)} → ${esc(x.now)}`}</span><span class="pill ${x.dir==='better'&&x.flag!=='normal'?'warn':FLAGCLS[qualFlag({value:x.now,flag:x.flag,test:x.test})]}">${x.dir==='better'&&x.flag!=='normal'?'Better, still high':FLAGTXT[qualFlag({value:x.now,flag:x.flag,test:x.test})]}</span></div>`}).join('')}</div>`}
function suggestSheet(p,r){const sg=(r.suggest||[]);if(!sg.length)return;const fmtV=x=>x.key==='dob'&&x.new?fmtDate(x.new):x.key==='phone'?fmtPh(x.new):esc(x.new)+(x.unit?' '+x.unit:'');
 const sx=sheetX('',`<div style="padding:0 16px 8px"><div class="cat" style="color:var(--ai)">${ic(I.spark,'#5E5CE6',16)} FOUND IN THIS REPORT</div><p style="font-size:18px;font-weight:700;margin:6px 0 2px">Update ${p.self?'your':esc(p.name)+"'s"} profile?</p><p class="cap" style="margin:0 0 10px">Only what's different. Nothing changes until you tap Update.</p>

 <form id="cf"><input class="inp2" name="code" required inputmode="numeric" autocomplete="one-time-code" maxlength="8" style="font-size:28px;letter-spacing:.3em;text-align:center;margin-top:18px" value="${esc(r.demo||'')}"><button class="btn pri" style="width:100%;margin-top:18px" id="cfb">Verify</button></form>
 <button class="btn ghost" style="width:100%;margin-top:8px;color:var(--blue)" onclick="authPage()">Start again</button></div></div>`);
 $('#cf').onsubmit=async e=>{e.preventDefault();const code=new FormData(e.target).get('code').trim(),b=$('#cfb');b.disabled=true;try{const url={otp:'/api/v1/auth/otp/verify',step:'/api/v1/auth/step/verify',signup:'/api/v1/auth/signup/verify'}[kind];
  const body={flow:r.flow||r.step};if(r.firebase){try{body.firebaseToken=await fbToken(code)}catch(_){throw new Error('That code is not right. Check it and try again.')}}else body.code=code;
  const out=await API(url,{json:body});if(out&&out.step&&kind!=='step')return codePage('step',out);boot()}catch(err){b.disabled=false;toast(err.message)}}}
async function passkeyLogin(){try{const o=await API('/api/v1/auth/passkey/login/options',{json:{}});const opt=o.options||o;opt.challenge=ub64(opt.challenge);(opt.allowCredentials||[]).forEach(c=>c.id=ub64(c.id));
 const c=await navigator.credentials.get({publicKey:opt});const res={id:c.id,rawId:b64u(c.rawId),type:c.type,response:{clientDataJSON:b64u(c.response.clientDataJSON),authenticatorData:b64u(c.response.authenticatorData),signature:b64u(c.response.signature),userHandle:c.response.userHandle?b64u(c.response.userHandle):null}};
 await API('/api/v1/auth/passkey/login/verify',{json:{credential:res,...(o.flow?{flow:o.flow}:{})}});boot()}catch(e){toast(e.message||'Passkey sign-in failed')}}
function onboard(step){const me=ME.me&&P(ME.me);step=step||(!me?1:!(me.medicalId.contacts||[]).length?2:3);
 const bar=`<div class="row" style="gap:6px;margin-bottom:18px">${[1,2,3].map(i=>`<div style="flex:1;height:4px;border-radius:2px;background:${i<=step?'#0071E3':'#D1D1D6'}"></div>`).join('')}</div><p class="eyebrow">STEP ${step} OF 3</p>`;
 const wrap=b=>layer(`<div class="page" style="left:0"><div class="pin" style="padding-top:max(30px,env(safe-area-inset-top))">${bar}${b}</div></div>`);
 if(step===1){wrap(`<h1 class="big">About you</h1><p class="line">This builds your health card, Medical ID and 3D body.</p><form id="of">${profileForm(me&&me.profile,{nameVal:(me&&me.name)||ME.user.name})}${ME.user.phone?'':`<div class="sect">YOUR MOBILE NUMBER</div><input class="inp2" name="phone" required inputmode="tel" autocomplete="tel" placeholder="98765 43210" value="${esc((me&&me.profile&&me.profile.phone)||'')}"><p class="cap">Sent with SOS so your contacts and 108 can call you back.</p>`}<button class="btn pri" style="width:100%;margin-top:20px">Continue</button></form>`);
  $('#of').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{if(me)await API('/api/v2/people/'+me.id,{method:'PUT',json:{name:f.get('name').trim(),profile:formProfile(f)}});else await API('/api/v2/people',{json:{name:f.get('name').trim(),profile:formProfile(f)}});await refreshMe();onboard(2)}catch(err){toast(err.message)}}}
 if(step===2){wrap(`<h1 class="big">Emergency contacts</h1><p class="line">SOS calls these people first and sends them your location and Medical ID. At least one is required.</p>${contactsBody(me)}<button class="btn pri" style="width:100%;margin-top:18px" id="on2" ${(me.medicalId.contacts||[]).length?'':'disabled style="opacity:.4;width:100%;margin-top:18px"'}>Continue</button>`);
  bindContacts(()=>onboard(2));$('#on2').onclick=()=>{if((P(ME.me).medicalId.contacts||[]).length)onboard(3)}}
 if(step===3){wrap(`<h1 class="big">Add your family</h1><p class="line">Invite adults to join with their own login, or add a child or elder who has no phone.</p><div class="list" style="margin-top:16px">${ME.people.filter(p=>!p.self).map(p=>`<div class="li">${esc(p.name)}<span class="end">${p.dependent?'Dependent':'Joined'}</span></div>`).join('')}${ME.invites.map(i=>`<div class="li">${esc(i.contact)}<span class="end">Invited</span></div>`).join('')}</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px"><button class="btn sec" onclick="openInvite()">Invite adult</button><button class="btn sec" onclick="openDependent()">Add dependent</button></div><button class="btn pri" style="width:100%;margin-top:22px" onclick="finishOnboarding()">Open Urban Health</button>`)}}
async function finishOnboarding(){closeL();S.person=ME.me;await loadRecords(ME.me);renderAll();if(!localStorage.getItem('uh-a2hs'))installHint()}
function installHint(){try{localStorage.setItem('uh-a2hs','1')}catch(_){}if(matchMedia('(display-mode: standalone)').matches)return;const ios=/iphone|ipad/i.test(navigator.userAgent);
 if(DEFERRED){DEFERRED.prompt();DEFERRED=null;return}layer(`<div class="modal glass"><div class="row"><div style="font-weight:700;font-size:19px">Add Urban Health to your home screen</div><button class="x" onclick="closeL()">${ic(I.x,'#3A3A3C',16)}</button></div><p style="font-size:16px;line-height:1.5;margin:14px 2px">${ios?'Tap the Share button in Safari, then <b>Add to Home Screen</b>.':'Open the browser menu (⋮), then <b>Install app</b> or <b>Add to Home screen</b>.'} It opens full screen like an app, and SOS is one tap away.</p><button class="btn pri" style="width:100%" onclick="closeL()">OK</button></div>`)}
let DEFERRED=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();DEFERRED=e});
/* ---------------- boot ---------------- */
async function boot(){const m=location.pathname.match(/\/app\/join\/([\w-]+)/);if(m){try{sessionStorage.setItem('uh-join',m[1])}catch(_){}fetch('/api/v2/household/invite/'+m[1],{headers:{'x-tht':'1'}}).catch(()=>{});history.replaceState(null,'','/app')}
 try{await refreshMe()}catch(e){if(e.status===401)return authPage(sessionStorage.getItem('uh-join')?'signup':'signin');$('#load').textContent='Could not connect. Check your internet and reload.';return}
 const jt=sessionStorage.getItem('uh-join');if(jt){try{const j=await API('/api/v2/household/join',{json:{token:jt}});if(j.handover)toast('Welcome. Your records are now in your own account.');else{toast('You joined the family');if(j.relation)setTimeout(()=>confirmRel(j),600)}}catch(e){toast(e.message)}sessionStorage.removeItem('uh-join');await refreshMe()}
 closeL();if(!ME.me||!ME.onboarded)return onboard();
 const t=location.pathname.split('/')[2];if(['summary','records','meds','family'].includes(t))S.tab=t;S.person=S.person&&P(S.person)?S.person:ME.me;
 await Promise.all(ME.people.map(p=>loadRecords(p.id)));await pollInbox();renderAll()}
let tt;function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.className='glass';t.setAttribute('role','status');t.style.cssText='position:fixed;left:50%;top:max(16px,env(safe-area-inset-top));transform:translateX(-50%);z-index:80;padding:12px 18px;border-radius:22px;font-size:15px;font-weight:500;max-width:90vw;text-align:center';document.body.appendChild(t)}t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',3200)}

/* ---- Apple-style pickers. Applied to every page and sheet, so all forms behave the same ---- */
const CHEV='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>';
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const RELATIONS=['Wife','Husband','Father','Mother','Son','Daughter','Brother','Sister','Grandfather','Grandmother','Friend','Neighbour','Other'];
const MAILFIX={'gmial.com':'gmail.com','gmal.com':'gmail.com','gmail.co':'gmail.com','gamil.com':'gmail.com','gnail.com':'gmail.com','gmail.con':'gmail.com','yaho.com':'yahoo.com','yahoo.co':'yahoo.com','hotmal.com':'hotmail.com','outlok.com':'outlook.com','rediffmial.com':'rediffmail.com','redifmail.com':'rediffmail.com','rediff.com':'rediffmail.com','iclud.com':'icloud.com'};
document.addEventListener('focusout',e=>{const t=e.target;if(!t||t.tagName!=='INPUT'||!/@/.test(t.value))return;const v=t.value.trim().toLowerCase(),d=v.split('@')[1],fx=MAILFIX[d];let n=t.parentNode.querySelector('.mailfix');if(n)n.remove();
 if(!fx)return;n=document.createElement('button');n.type='button';n.className='mailfix';n.style.cssText='display:block;margin:6px 4px 0;background:none;border:0;color:#0071E3;font:inherit;font-size:14px;padding:0;text-align:left';n.innerHTML=`Did you mean <b>${esc(v.split('@')[0])}@${fx}</b>?`;n.onclick=()=>{t.value=v.split('@')[0]+'@'+fx;n.remove()};t.insertAdjacentElement('afterend',n)},true);
function sheetX(title,inner,onDone){const d=document.createElement('div');d.className='sheetx';d.innerHTML=`<div class="sh" role="dialog" aria-label="${esc(title)}"><div class="hd"><button data-x>Cancel</button><b>${esc(title)}</b><button data-ok>${onDone?'Done':''}</button></div>${inner}</div>`;
 document.body.appendChild(d);const close=()=>d.remove();d.onclick=e=>{if(e.target===d)close()};d.querySelector('[data-x]').onclick=close;if(onDone)d.querySelector('[data-ok]').onclick=()=>{onDone(d);close()};return{el:d,close}}
function fmtISO(v){if(!v)return'';const [y,m,dd]=v.split('-').map(Number);return`${dd} ${MONTHS[m-1].slice(0,3)} ${y}`}
function enhance(root){root=root||document;
 // choices: a native select becomes a button that opens a tick list
 root.querySelectorAll('select.inp2:not([data-x])').forEach(sel=>{sel.dataset.x=1;sel.style.display='none';const b=document.createElement('button');b.type='button';b.className='pick';
  const lab=()=>{const o=sel.options[sel.selectedIndex];b.innerHTML=(sel.value?`<span>${esc(o.text)}</span>`:`<span class="ph">${esc(o?o.text:'Choose')}</span>`)+CHEV};lab();sel.after(b);
  const title=(sel.closest('label')&&sel.closest('label').querySelector('.sect')||{}).textContent||'Choose';
  b.onclick=()=>{const opts=[...sel.options].filter(o=>o.value);const sx=sheetX(title.charAt(0)+title.slice(1).toLowerCase(),`<div class="opts">${opts.map(o=>`<button class="opt ${o.value===sel.value?'on':''}" data-v="${esc(o.value)}">${esc(o.text)}${o.value===sel.value?'<span>✓</span>':''}</button>`).join('')}</div>`);
   sx.el.querySelectorAll('.opt').forEach(x=>x.onclick=()=>{sel.value=x.dataset.v;sel.dispatchEvent(new Event('change',{bubbles:true}));lab();sx.close()})}});
 // dates: day / month / year wheels instead of the browser calendar
 root.querySelectorAll('input[type=date].inp2:not([data-x])').forEach(inp=>{inp.dataset.x=1;const max=inp.max||'2100-12-31',min=inp.min||'1900-01-01';inp.type='hidden';const b=document.createElement('button');b.type='button';b.className='pick';
  const lab=()=>{b.innerHTML=(inp.value?`<span>${fmtISO(inp.value)}</span>`:'<span class="ph">Choose date</span>')+CHEV};lab();inp.after(b);
  b.onclick=()=>{const now=new Date(),cur=inp.value?inp.value.split('-').map(Number):[now.getFullYear()-30,1,1];const y0=+min.slice(0,4),y1=+max.slice(0,4);
   const col=(arr,sel)=>`<div class="wheel">${arr.map(v=>`<div data-v="${v[0]}">${v[1]}</div>`).join('')}</div>`;
   const days=Array.from({length:31},(_,i)=>[i+1,i+1]),mons=MONTHS.map((m,i)=>[i+1,m]),yrs=Array.from({length:y1-y0+1},(_,i)=>[y1-i,y1-i]);
   const sx=sheetX((inp.closest('label')&&inp.closest('label').querySelector('.sect')||{textContent:'Date'}).textContent.replace(/^./,c=>c).toLowerCase().replace(/^./,c=>c.toUpperCase()),`<div class="wheels">${col(days)}${col(mons)}${col(yrs)}</div><p class="hint" style="margin:10px 20px 0;text-align:center">Scroll each column, then Done.</p>`,el=>{
    const ws=el.querySelectorAll('.wheel'),pickV=w=>+w.children[Math.round(w.scrollTop/44)].dataset.v;let dd=pickV(ws[0]),mm=pickV(ws[1]),yy=pickV(ws[2]);const last=new Date(yy,mm,0).getDate();if(dd>last)dd=last;
    let v=`${yy}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;if(v>max)v=max;if(v<min)v=min;inp.value=v;inp.dispatchEvent(new Event('change',{bubbles:true}));lab()});
   const ws=sx.el.querySelectorAll('.wheel');requestAnimationFrame(()=>{ws[0].scrollTop=(cur[2]-1)*44;ws[1].scrollTop=(cur[1]-1)*44;ws[2].scrollTop=Math.max(0,(y1-cur[0]))*44})}});
 // relationship: a list, not typing
 root.querySelectorAll('input[name=relation].inp2:not([data-x]),input[name=rel].inp2:not([data-x])').forEach(inp=>{inp.dataset.x=1;const sel=document.createElement('select');sel.className='inp2';sel.name=inp.name;sel.required=inp.required;
  sel.innerHTML=`<option value="">Choose relationship</option>`+RELATIONS.map(r=>`<option ${r.toLowerCase()===String(inp.value).toLowerCase()?'selected':''}>${r}</option>`).join('');const lab=document.createElement('label');lab.innerHTML='<div class="sect" style="display:none">Relationship</div>';inp.replaceWith(lab);lab.appendChild(sel)});
 // names: as on Aadhaar
 root.querySelectorAll('input[name=name].inp2:not([data-x])').forEach(inp=>{inp.dataset.x=1;inp.placeholder='Full name as on Aadhaar';inp.autocapitalize='words'});
 // mobile numbers: +91 fixed, exactly 10 digits starting 6-9; the app adds +91 when it sends
 root.querySelectorAll('input[name=phone]:not([data-x])').forEach(inp=>{inp.dataset.x=1;const bg=getComputedStyle(inp).backgroundColor;const w=document.createElement('div');w.className='mob';w.style.background=bg;w.innerHTML='<b><i>🇮🇳</i>+91</b>';inp.replaceWith(w);w.appendChild(inp);inp.className='';inp.placeholder='98765 43210';inp.inputMode='numeric';inp.autocomplete='tel-national';
  const ten=v=>{let d=String(v||'').replace(/\D/g,'');if(d.length>10&&d.startsWith('91'))d=d.slice(2);if(d.length>10&&d.startsWith('0'))d=d.replace(/^0+/,'');return d.slice(-10)};inp.value=ten(inp.value);inp.oninput=()=>{const d=String(inp.value).replace(/\D/g,'');inp.value=d.length>10?ten(d):d;w.classList.toggle('bad',inp.value.length===10&&!/^[6-9]/.test(inp.value))};
  const f=inp.form;if(f&&!f.dataset.mob){f.dataset.mob=1;f.addEventListener('submit',e=>{const bad=[...f.querySelectorAll('.mob input')].find(x=>x.value&&!/^[6-9][0-9]{9}$/.test(x.value));if(bad){e.preventDefault();e.stopImmediatePropagation();bad.parentNode.classList.add('bad');bad.focus();toast('Enter a 10-digit mobile number');return}
   f.querySelectorAll('.mob input').forEach(x=>{if(/^[6-9][0-9]{9}$/.test(x.value))x.dataset.send='+91'+x.value})},true)}});
 root.querySelectorAll('.mob input').forEach(inp=>{if(!inp.dataset.fd){inp.dataset.fd=1}})}
// FormData reads the 10 digits; give the server +91 so every stored number has one format
(()=>{const G=FormData.prototype.get;FormData.prototype.get=function(k){const v=G.call(this,k);if(k==='phone'&&typeof v==='string'&&/^[6-9][0-9]{9}$/.test(v))return'+91'+v;return v}})();
new MutationObserver(()=>enhance(document)).observe(document.documentElement,{childList:true,subtree:true});
function layer(html){$('#layer').innerHTML=`<div class="scrim" onclick="closeL()"></div>${html}`}
function closeL(){$('#layer').innerHTML=''}
function page(title,body,eyebrow,tint){const same=$('#layer .page')&&$('#layer .page').dataset.t===title;const y=same?$('#layer .page').scrollTop:0;layer(`<div class="page${same?' still':''}" data-t="${esc(title)}"><div class="pbar"><button class="pback" onclick="closeL()">${ic('<path d="M15 6l-6 6 6 6"/>','#0071E3',22)}<span>Back</span></button></div><div class="pin">${eyebrow?`<p class="eyebrow" style="color:${tint||'var(--blue)'}">${eyebrow}</p>`:''}<h1 class="big">${title}</h1>${body}</div></div>`);if(same){const pg=$('#layer .page');if(pg)pg.scrollTop=y}}
$('#scroll').addEventListener('scroll',e=>{const m=e.target.scrollTop>60;if(m!==S.mini){S.mini=m;document.body.classList.toggle('mini',m)}},{passive:true});
setInterval(()=>{if(ME&&document.visibilityState==='visible')refreshMe().catch(e=>{if(e.status===401)authPage()})},5*60*1000);
setInterval(()=>{if(ME&&document.visibilityState==='visible')pollInbox()},60*1000);document.addEventListener('visibilitychange',()=>{if(ME&&document.visibilityState==='visible')pollInbox()});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
fit();frame();boot();

</script>

 <div class="smb">${c.slice(0,2).map(x=>`<a href="tel:${esc(x.phone)}">${ic(I.phone,'#30D158',30)}<span>${esc(x.name.split(' ')[0])}</span></a>`).join('')}${c.length<2?`<a href="tel:108">${ic(I.phone,'#FF3B30',30)}<span>108</span></a>`:''}</div>

 ${nx?`<div class="smc" style="display:flex;align-items:center;gap:14px;padding:18px"><div style="font-size:36px">💊</div><div style="flex:1"><b style="font-size:18px">${esc(nx.m.name)}</b><div style="color:#6E6E73;font-size:14px">Ask Amma or Appa to help</div></div><button class="go" style="height:46px;padding:0 18px;border-radius:23px;border:0;background:#0071E3;color:#fff;font:inherit;font-weight:700" onclick="kidDose('${k.id}','${nx.m.id}','${nx.t}')">Done</button></div>`:''}
 <div class="smb">${c.map(x=>`<a href="tel:${esc(x.phone)}">${ic(I.phone,'#30D158',30)}<span>${esc(x.name.split(' ')[0])}</span></a>`).join('')||`<a href="tel:108">${ic(I.phone,'#FF3B30',30)}<span>108</span></a>`}</div>

/* ---------------- kids (approved designs) ----------------
   Age decides what a child's profile shows: under 3 parents only, 3-5 play-together, 6-12 games and first aid, 13-17 workouts.
   Activity is what the child or parent logs from a Move session; nothing is tracked in the background (DPDP, children).
   First-aid steps are general guidance for a child to follow; they are to be reviewed by a doctor before launch. */
function ageOf(p){const d=p&&p.profile&&p.profile.dob;if(d){const b=new Date(d+'T00:00'),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;return a}return p&&p.medicalId&&+p.medicalId.age||null}

const kidBand=a=>a<3?'baby':a<6?'small':a<13?'kid':'teen';

 teen:[['🏃','Jumping jacks','Steady pace, land softly',60],['🦵','Squats','Feet shoulder-width, sit back, stand tall',45],['🧱','Plank','Straight line from head to heels',30],['🚶','Lunges','Step forward, both knees bend, swap legs',45],['⛰️','Mountain climbers','Plank, bring knees in one by one',40]]};
const AID=[['🩸','Nosebleed','#FF6482',['Sit down and lean forward, not back.','Pinch the soft part of your nose.','Hold it for 10 minutes. Breathe through your mouth.','Tell an adult. If it doesn’t stop in 20 minutes, see a doctor.']],
 ['🩹','Small cut or scrape','#FF9F0A',['Tell an adult and wash your hands.','Rinse the cut with clean water.','Press with a clean cloth until it stops bleeding.','Cover it with a plaster. Deep or gaping cut? See a doctor.']],
 ['🔥','Burn','#0A84FF',['Move away from what burned you.','Cool it under running water for 20 minutes.','No ice, butter or toothpaste.','Cover loosely with a clean cloth. Big burn? Call 108.']],
 ['🐝','Insect sting','#FFD60A',['Move away from the insects.','If a sting is left, scrape it out sideways.','Wash and hold something cold on it.','Face swelling or hard to breathe? Call 108 now.']],

function kidsHome(p){const a=ageOf(p),band=kidBand(a),goal=a<6?180:60,mins=kidMinutes(p.id),k=Math.min(1,mins/goal),C=2*Math.PI*40;

/* Live password rules under "Create account": each rule turns green as it's met, and a name / email / phone match
   says exactly which part, so nobody is left guessing at a toast. Mirrors api/passwords.py; the server still decides. */
function pwRules(pw,name,email,phone){const low=pw.toLowerCase(),r=[];const phrase=pw.length>=16&&pw.split(/[\s\-_.]+/).filter(w=>w.length>=3).length>=3;
 r.push([phrase?'Passphrase of 16+ characters':'12 or more characters',pw.length>=12]);
 if(!phrase)r.push(['Mix of upper and lower case, a number and a symbol',/[A-Z]/.test(pw)&&/[a-z]/.test(pw)&&/\d/.test(pw)&&/[^A-Za-z0-9]/.test(pw)]);
 const bits=(name+' '+String(email).split('@')[0]).toLowerCase().split(/[\s@._+-]+/).filter(b=>b.length>=3),hit=bits.find(b=>low.includes(b)),d=String(phone).replace(/\D/g,''),ph=d.length>=6&&pw.includes(d.slice(-6));
 r.push([hit?`Contains “${hit}” from your name or email`:ph?'Contains your phone number':'Not your name, email or phone',!hit&&!ph]);
 if(/(.)\1\1/.test(pw))r.push(['Three identical characters in a row',false]);
 if(/1234|2345|3456|4567|5678|6789|abcd|qwer|asdf/.test(low))r.push(['A run like 1234 or abcd',false]);
 r.push(['Checked against known data breaches when you continue',null]);return r}
function pwScore(pw,rs){const fails=rs.filter(x=>x[1]===false).length;if(!pw)return 0;if(fails)return Math.min(2,fails>1?1:2);let sc=3;if(pw.length>=16)sc=4;return sc}
document.addEventListener('input',e=>{const t=e.target;if(!t.matches||!t.matches('[data-pwrules],form input[name=name],form input[name=email],form input[name=phone]'))return;const f=t.form;if(!f)return;const pw=f.querySelector('[data-pwrules]'),box=f.querySelector('#pwr');if(!pw||!box)return;
 const rs=pwRules(pw.value,(f.name&&f.name.value)||'',(f.email&&f.email.value)||'',(f.phone&&f.phone.value)||''),sc=pwScore(pw.value,rs),fails=rs.filter(x=>x[1]===false).length;
 const lab=!pw.value?'':fails?(fails>1?`Weak — ${fails} things to fix`:'Fair — one thing to fix'):sc>=4?'Strong':'Good',col=fails?(fails>1?'#C4291C':'#B25000'):'#1A7F37';
 box.innerHTML=!pw.value?'<div class="pwi">12+ characters with upper and lower case, a number and a symbol — or 3–4 random words (16+). Not your name, email or phone.</div>'
  :`<div class="pwm">${[1,2,3,4].map(k=>`<i style="background:${k<=sc?col:'#E5E5EA'}"></i>`).join('')}</div><div style="font-size:13.5px;font-weight:600;color:${col};margin:2px 0 2px">${lab}</div>`+rs.map(([t,ok])=>`<div class="pwi ${ok===true?'py':ok===false?'pn':''}"><span>${ok===true?'✓':ok===false?'!':'·'}</span>${esc(t)}</div>`).join('')+(fails?'<div class="pwi" style="margin-top:2px">Tip: 3–4 random words like <b style="color:#1D1D1F">&nbsp;mango river kite 82</b></div>':'');
 const sb=f.querySelector('button.btn.pri,button[type=submit]');if(sb&&f.querySelector('#pwr')){sb.disabled=!!fails||pw.value.length<12;sb.style.opacity=sb.disabled?.45:1}},true);

/* =====================================================================================================================

   app's own HD body (web/a/eye-orbit.*.bin, made by tools/eye/orbit_asset.py). Frame: +Y forward through the cornea,
   +Z to the nose, +X up. The page is framed by the app (patient) and by the partner portal (doctor); data arrives by
   postMessage and nothing here talks to the server.
   ===================================================================================================================== */
const ORBIT_URL='/a/eye-orbit.fa96a608.bin';

const NOISE=`float hsh(vec3 p){p=fract(p*0.3183099+.1);p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}

 return mix(mix(mix(hsh(i),hsh(i+vec3(1,0,0)),f.x),mix(hsh(i+vec3(0,1,0)),hsh(i+vec3(1,1,0)),f.x),f.y),mix(mix(hsh(i+vec3(0,0,1)),hsh(i+vec3(1,0,1)),f.x),mix(hsh(i+vec3(0,1,1)),hsh(i+vec3(1,1,1)),f.x),f.y),f.z);}

   .replace('#include <color_fragment>','#include <color_fragment>\n vec3 qq=vec3(dot(vPL,uA)*uS.x,dot(vPL,uB)*uS.y,dot(vPL,uC)*uS.z);float hh=fbm(qq);diffuseColor.rgb*=1.0+uVar*(hh-0.5)*2.0;')
   .replace('#include <normal_fragment_maps>','#include <normal_fragment_maps>\n {float h2=hh*uAmp;normal=pNA(-vViewPosition,normal,vec2(dFdx(h2),dFdy(h2)),faceDirection);}')};

 const P=new Float32Array(nv*3),N=new Float32Array(nv*3),I=new Uint32Array(ni);let ov=0,oi=0;
 for(const g of geos){const p=g.attributes.position,n=g.attributes.normal;P.set(p.array,ov*3);N.set(n.array,ov*3);if(g.index){for(let i=0;i<g.index.count;i++)I[oi+i]=g.index.array[i]+ov;oi+=g.index.count}else{for(let i=0;i<p.count;i++)I[oi+i]=ov+i;oi+=p.count}ov+=p.count;g.dispose()}

/* ---- the socket / pathway asset ---- */
let ORB=null;
async function loadOrbit(){const r=await fetch(ORBIT_URL);if(!r.ok)throw Error('model');const buf=await new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
 const jl=new DataView(buf).getUint32(0,true),head=JSON.parse(new TextDecoder().decode(new Uint8Array(buf,4,jl))),base=4+jl,parts={};

  for(let j=0;j<p.v;j++){pos[j*3]=b[0]+q[j*3]/65535*(b[3]-b[0]);pos[j*3+1]=b[1]+q[j*3+1]/65535*(b[4]-b[1]);pos[j*3+2]=b[2]+q[j*3+2]/65535*(b[5]-b[2])}

  parts[p.n]={g,axes:pca(g)}}
 ORB={parts,ganglion:head.ganglion,eyeK:head.eyeK}}

 const g=x.createRadialGradient(C,C,rP,C,C,rL);g.addColorStop(0,'#3a1d0a');g.addColorStop(.12,'#7b4a1f');g.addColorStop(.3,'#a46d33');g.addColorStop(.42,'#8a5626');g.addColorStop(.75,'#6b3f1b');g.addColorStop(.93,'#4a2a12');g.addColorStop(1,'#20120a');

 for(let i=0;i<2600;i++){const a=rnd()*Math.PI*2,r0=rP*(1+rnd()*.15),r1=rP+(rL-rP)*(.35+rnd()*.65);const w=(rnd()-.5)*.08;x.strokeStyle=rnd()<.55?`rgba(${200+rnd()*40|0},${140+rnd()*40|0},${80+rnd()*30|0},${.08+rnd()*.22})`:`rgba(25,12,4,${.1+rnd()*.25})`;x.lineWidth=.6+rnd()*1.8;

  for(let k=0;k<14;k++){u+=(rnd()-.5)*14;v-=8+rnd()*10;x.lineTo(u,v);if(rnd()<.18){x.stroke();x.beginPath();x.moveTo(u,v)}}x.stroke()}

/* ---- parts: what a tap on each one says ---- */
const GROUPS={focus:['Focusing','#2F5BFF'],fluid:['Fluid & drainage','#30B0C7'],wall:['Outer layers','#A2845E'],see:['Seeing','#FF9F0A'],nerve:['Nerves','#E5A800'],move:['Muscles','#FF453A'],blood:['Blood vessels','#AF52DE'],tear:['Tear system','#30B0C7'],brain:['Brain','#FF375F']};
const PARTOF={macula:'retina',pupil:'iris','nerve sheath':'optic nerve'};const pk=k=>PARTOF[k]||k;
const INFO={
 'optic nerve':['Optic nerve (II)','nerve','Carries the picture from the eye to the brain.','Glaucoma slowly damages it.'],

 if(ex&&ex.note&&MODE!=='doctor'){const ini=(ex.doctor||'Dr').replace(/^dr\.?\s*/i,'').split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
  h+=`<div class="card"><div class="msg"><span class="av">${esc(ini)}</span><div><b style="font-size:16px">${ex.doctor?'Dr '+esc(ex.doctor.replace(/^dr\.?\s*/i,'')):'Your doctor'}</b><div class="empty" style="font-size:13px">${esc([ex.store,ex.date&&new Date(ex.date).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})].filter(Boolean).join(' · '))}</div></div></div><p class="q">“${esc(ex.note)}”</p></div>`}
 const fs=marks(S.side);if(fs.length)h+=`<div class="sect">${MODE==='doctor'?'Findings to send':'Marked by your doctor'}</div><div class="list">${fs.map(f=>{const i=info(f.part);return`<button class="row" data-part="${esc(f.part)}"><i style="background:${TONE[f.tone]||TONE.watch}"></i><div class="t"><b>${esc(f.label||'')}</b><small>${esc(i?i.n:f.part)}</small></div><span class="ch">›</span></button>`}).join('')}</div>`;
 if(rs.length)h+=`<div class="sect">${MODE==='doctor'?'Readings':'Your readings'} · tap to see where</div><div class="list">${rs.map((r,ix)=>`<button class="row${S.sel&&S.sel.reading&&S.sel.reading.k===r.k?' on':''}" data-r="${ix}"><i style="background:${TONE[r.tone]}"></i><div class="t"><b>${esc(r.label)}</b><small>${esc(info(r.part)?info(r.part).n:'')}</small></div><span class="val">${esc(r.value)}</span><span class="ch">›</span></button>`).join('')}</div>`;
 const hist=exams().filter(e=>e[S.side]);if(hist.length>1){for(const [k,lab,mx] of [['iop','Eye pressure · mmHg',40],['cd','Optic nerve cup',1]]){const pts=hist.slice(0,4).reverse().map(e=>[e.date,num(e[S.side][k])]).filter(p=>p[1]!=null);if(pts.length<2)continue;
   h+=`<div class="card"><b style="font-size:15px">${lab}</b><div class="bars">${pts.map((p,i)=>`<div><span style="height:${Math.max(8,p[1]/mx*60)}px;background:${i===pts.length-1?'#FF9F0A':'#D1D1D6'}"></span>${esc((p[0]||'').slice(0,4))} · ${p[1]}</div>`).join('')}</div></div>`}}
 if(!ex&&MODE!=='doctor'&&!S.sel)h+=`<div class="card"><b style="font-size:17px">Explore your eye</b><p class="empty" style="margin:6px 0 0">Turn it with a finger and tap any part to see what it does. When your eye doctor sends your readings, they appear here, pinned on the exact part.</p></div>`;
 const cat=partsCatalog();h+=`<div class="sect">Every part in this view</div><div class="srch"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" placeholder="Search a part" value="${esc(Q)}" autocomplete="off"></div>`;
 for(const g of Object.keys(GROUPS)){const its=(cat[g]||[]).filter(i=>!Q||(i.n+' '+i.d).toLowerCase().includes(Q.toLowerCase()));if(!its.length)continue;
  h+=`<div class="gh" style="color:${GROUPS[g][1]}">${esc(GROUPS[g][0]).toUpperCase()}</div><div class="list">${its.map(i=>`<button class="row${S.sel&&S.sel.keys[0]===i.key?' on':''}" data-part="${esc(i.key)}"><i style="background:${GROUPS[g][1]}"></i><div class="t"><b>${esc(i.n)}</b><small>${esc(i.d)}</small></div><span class="ch">›</span></button>`).join('')}</div>`}
 el.innerHTML=h;
 el.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>focusReading(rs[+b.dataset.r]));
 el.querySelectorAll('[data-part]').forEach(b=>b.onclick=()=>select(b.dataset.part,true));
 el.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>select(null));
 el.querySelectorAll('[data-mark]').forEach(b=>b.onclick=()=>post({act:'mark',part:b.dataset.mark,label:info(b.dataset.mark).n,side:S.side}));
 const q=$('#q');if(q)q.oninput=()=>{Q=q.value;const p=q.selectionStart;renderSide();const n=$('#q');n.focus();n.setSelectionRange(p,p)};draw()}

/* ---- chrome ---- */
$('#views').innerHTML=Object.entries(VIEWS).map(([k,v])=>`<button data-v="${k}"${k==='inside'?' class="on"':''}>${v.t}</button>`).join('');
$('#views').onclick=e=>{const b=e.target.closest('button');if(b&&b.dataset.v!==S.view){setView(b.dataset.v);renderSide()}};
$('#side-seg').onclick=e=>{const b=e.target.closest('button');if(!b||b.dataset.s===S.side)return;S.side=b.dataset.s;document.querySelectorAll('#side-seg button').forEach(x=>x.classList.toggle('on',x===b));S.sel=null;setView(S.view);renderSide()};
$('#bk').onclick=()=>post({act:'close'});
function post(m){try{parent.postMessage(Object.assign({type:'uh-eye-act'},m),location.origin)}catch(_){}}
addEventListener('message',e=>{if(e.origin!==location.origin||!e.data)return;const d=e.data;
 if(d.type==='uh-eye-data'){DATA=Object.assign({mode:MODE,exams:[]},d.data||{});const ex=exams()[0];$('#eb').textContent=ex?[ex.store,ex.date&&new Date(ex.date).toLocaleDateString('en-IN',{day:'numeric',month:'short'})].filter(Boolean).join(' · '):(DATA.name||'Your eyes');
  if(DATA.side&&DATA.side!==S.side){S.side=DATA.side;document.querySelectorAll('#side-seg button').forEach(x=>x.classList.toggle('on',x.dataset.s===S.side))}
  if(ready){setView(DATA.view||S.view);renderSide()}else pending=true}
 if(d.type==='uh-eye-cmd'){if(d.view&&VIEWS[d.view]){setView(d.view);renderSide()}if('marks' in d){DATA.marks=d.marks;renderSide();draw()}if(d.part!==undefined)select(d.part)}});
if(MODE==='doctor'){$('#bk').style.display='none';$('#eb').textContent='Explain on 3D'}
let ready=false,pending=false;
(async()=>{frame();try{await loadOrbit()}catch(_){/* the socket and brain views need the model; the eyeball works without it */
  for(const k of ['socket','brain'])delete VIEWS[k];$('#views').querySelectorAll('[data-v="socket"],[data-v="brain"]').forEach(b=>b.remove())}
 $('#load').remove();ready=true;setView(DATA.view||'inside');renderSide();post({act:'ready'})})();
</script></body></html>

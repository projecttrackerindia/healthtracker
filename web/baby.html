function part(o){const u=o.userData;$('ct').textContent=u.display_name;$('body').innerHTML=`<p class=tx>${esc(u.description||'')}</p><button class=bk onclick="unsel()">‹ This week</button>`}
function unsel(){sel=null;$('tag').style.display='none';text()}
function show(g,kind,w){if(cur)piv.remove(cur.g.scene);if(mix)mix.stopAllAction();const sc=g.scene;
 sc.traverse(o=>{if(!o.name)return;if(kind==='mother'&&/^(Uterus_Wall_Front|Amniotic_Sac_Front)$/.test(o.name))o.visible=false;if(o.name==='Mother_Skin')o.userData.nopick=1;if(o.isMesh)o.frustumCulled=false});
 sc.updateMatrixWorld(true);const b=new THREE.Box3();sc.traverse(o=>{if(o.isMesh&&o.visible&&!(o.name==='Mother_Skin'||(o.parent&&o.parent.name==='Mother_Skin'))){let v=true,q=o;while(q){if(!q.visible)v=false;q=q.parent}if(v)b.expandByObject(o)}});
 if(kind==='mother'){const ub=new THREE.Box3();['Uterus_Wall_Back','Placenta','Pelvis','Baby'].forEach(n=>{const o=sc.getObjectByName(n);if(o)ub.expandByObject(o)});if(!ub.isEmpty()){b.min.y=Math.max(b.min.y,ub.min.y-.02);b.max.y=Math.min(b.max.y,Math.max(ub.max.y+.05,ub.min.y+.26))}}
 fitC=b.getCenter(new THREE.Vector3());const s=b.getSize(new THREE.Vector3());fitR=Math.max(s.x,s.y*1.0,s.z)*.5;sc.position.sub(fitC);piv.add(sc);
 mix=new THREE.AnimationMixer(sc);const fl=g.animations.find(a=>a.name==='Float');if(fl&&!still)mix.clipAction(fl).play();
 cur={g,kind,w,key:kind+w};frame();text()}
function frame(){const a=innerWidth/innerHeight,top=170,bot=$('sh').offsetHeight+16,hv=innerHeight-top-bot,fov=C.fov*Math.PI/180;
 const need=Math.max(fitR/Math.tan(fov/2)*(innerHeight/Math.max(hv,160)),fitR/(Math.tan(fov/2)*a)*1.15)*1.08;
 C.position.set(0,0,need);const shift=((bot-top)/2)/innerHeight*2*Math.tan(fov/2)*need;C.position.y=-shift;C.lookAt(0,-shift,0);C.near=need/50;C.far=need*10;C.updateProjectionMatrix()}
let tmr=0;async function go(w,now){wk=w;sel=null;$('tag').style.display='none';text();clearTimeout(tmr);const k=view+w;want=k;
 const load=async()=>{const kind=view==='baby'?'baby':'mother';const t=setTimeout(()=>{if(want===k)$('ld').style.display='block'},250);
  try{const g=await get(kind,w);if(want!==k)return;show(g,kind,w);$('err').style.display='none';
   [w+1,w-1].filter(x=>x>=6&&x<=40).forEach(x=>get(kind,x))}catch(e){if(want===k)$('err').style.display='block'}finally{clearTimeout(t);if(want===k)$('ld').style.display='none'}};
 if(now)load();else tmr=setTimeout(load,140)}
function setView(v){if(v===view)return;view=v;$('vb').classList.toggle('on',v==='baby');$('vm').classList.toggle('on',v==='mother');go(wk,true)}
$('vb').onclick=()=>setView('baby');$('vm').onclick=()=>setView('mother');
const wkI=$('wk');wkI.oninput=e=>go(+e.target.value);
// touch: drag turns the model, a short tap picks a part (Inside you)
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
$('c').addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,r:goalY,t:performance.now(),m:0};$('c').setPointerCapture(e.pointerId)});
$('c').addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x;drag.m=Math.max(drag.m,Math.abs(dx)+Math.abs(e.clientY-drag.y));goalY=drag.r+dx*.012});
$('c').addEventListener('pointerup',e=>{const d=drag;drag=null;if(!d||d.m>8||!cur)return;
 ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ndc,C);
 const hits=ray.intersectObject(cur.g.scene,true).filter(h=>{let o=h.object;while(o){if(!o.visible||o.userData.nopick||/^(Amniotic_Sac_Back|Mother_Skin)$/.test(o.name))return false;o=o.parent}return true});
 if(!hits.length)return unsel();let o=hits[0].object;while(o&&!(o.userData&&o.userData.display_name))o=o.parent;if(!o)return unsel();
 sel=o;part(o);const tg=$('tag');tg.textContent=o.userData.display_name;tg.style.left=e.clientX+'px';tg.style.top=e.clientY+'px';tg.style.display='block'});
function resize(){R.setSize(innerWidth,innerHeight,false);C.aspect=innerWidth/innerHeight;if(cur)frame()}addEventListener('resize',resize);
const clock=new THREE.Clock();(function loop(){const dt=Math.min(clock.getDelta(),.05);if(!drag&&!still&&!sel)goalY+=dt*.15;rotY+=(goalY-rotY)*Math.min(1,dt*8);piv.rotation.y=rotY;if(mix)mix.update(dt);R.render(S,C);requestAnimationFrame(loop)})();

const send=(a,x={})=>parent.postMessage({type:'uh-body-act',act:a,...x},location.origin);$('x').onclick=()=>send('close');
{let la=0;const act=()=>{const n=Date.now();if(n-la<4000)return;la=n;try{parent!==window&&parent.postMessage({type:'uh-active'},location.origin)}catch(_){}};['pointerdown','keydown','touchstart'].forEach(k=>addEventListener(k,act,{capture:true,passive:true}))}

 $('eb').textContent=(p.name?String(p.name).toUpperCase()+' · ':'')+'PREGNANCY';const w=Math.max(6,Math.min(40,(p.pregnancy&&p.pregnancy.week)||20));wkI.value=w;go(w,true)});

# Non-secret settings for Cloud Run (deploy.sh passes this with --env-vars-file). Secrets are listed in secrets.txt.
APP_ENV: "production"
RP_ID: "urbanhealth.in"
APP_ORIGIN: "https://urbanhealth.in,https://www.urbanhealth.in"
CANONICAL_HOST: "urbanhealth.in"
DOKKO_REGION: "IN"
OTP_DEMO: "0"
# The launch period: every feature is free for every family until this date (IST). Clear it to switch paid plans back on.
FREE_UNTIL: "2027-03-31"
PWNED_CHECK: "1"
S3_BUCKET: "urbanhealth-prod-documents"
S3_ENDPOINT: "https://storage.googleapis.com"
S3_REGION: "auto"
AI_PROVIDER: "gemini"
GEMINI_MODEL: "gemini-3.8-flash"
MAIL_TRANSPORT: "smtp"
# Maps: the browser key (HTTP-referrer restricted to the site, Maps JavaScript API only). The server key lives in Secret Manager.
GOOGLE_MAPS_KEY: ""
# Database connections per web worker. 3 workers x (3 + 2) = 15, under the 25 a db-f1-micro Cloud SQL instance
# allows (tht-pg was moved to micro on 17 Nov 2026 to cut cost). Raise both only after moving to a bigger tier.
DB_POOL_SIZE: "3"
DB_POOL_OVERFLOW: "2"

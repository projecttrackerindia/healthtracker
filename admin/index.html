<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TheHealthTracker Admin</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/brand/svg/admin-icon.svg"><meta name="theme-color" content="#1C1E26">
<style>
:root{--bg:#f3f5fa;--card:#fff;--soft:#f6f8fc;--ink:#0f1221;--mute:#6b7285;--line:rgba(15,18,33,.08);--blue:#2f5bff;--teal:#13b5a3;--red:#ef3b4f;--amber:#f59e0b;--green:#16a34a;--r:18px;--sh:0 10px 30px -14px rgba(15,18,33,.25);--font:"Geist",Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b0d14;--card:#141826;--soft:#1a1f30;--ink:#eef1fb;--mute:#8f97ad;--line:rgba(255,255,255,.08);--sh:0 10px 30px -14px rgba(0,0,0,.6)}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
a{color:var(--blue);text-decoration:none}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:0;height:100vh;padding:18px 14px;border-right:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:4px}
.logo svg.thl{display:block;height:28px;width:auto;max-width:100%}.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;padding:4px 8px 16px}.logo i{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--teal));display:grid;place-items:center;color:#fff;font-style:normal}
.logo small{display:block;font-weight:500;color:var(--mute);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
nav button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px;border-radius:12px;color:var(--mute);font-weight:500}
nav button:hover{background:var(--soft);color:var(--ink)}nav button.on{background:color-mix(in srgb,var(--blue) 12%,transparent);color:var(--blue);font-weight:600}
nav button em{margin-left:auto;font-style:normal;font-size:11px;background:var(--red);color:#fff;border-radius:99px;padding:1px 7px}
.who{margin-top:auto;padding:10px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--mute)}.who b{display:block;color:var(--ink);font-size:13px;overflow:hidden;text-overflow:ellipsis}
main{padding:22px 26px 60px;max-width:1500px}
h1{font-size:26px;letter-spacing:-.03em;margin:0 0 2px}.sub{color:var(--mute);margin:0 0 18px}
h3{margin:0 0 10px;font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);border:1px solid var(--line)}
.kpi small{display:block;font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}.kpi b{font-size:28px;letter-spacing:-.03em;line-height:1.1;display:block;margin-top:6px}.kpi span{font-size:12px;color:var(--mute)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.grow{flex:1 1 auto;min-width:0}
input,select,textarea{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:9px 12px;outline:none;min-width:0;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 18%,transparent)}
.row input,.row select{width:auto}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:12px;font-weight:600;background:var(--soft);border:1px solid var(--line);white-space:nowrap}
.btn.p{background:var(--blue);color:#fff;border-color:transparent}.btn.d{color:var(--red)}.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border:0}tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
.tag{display:inline-block;font:600 10.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:99px;background:var(--soft);border:1px solid var(--line);color:var(--mute);margin:0 3px 3px 0}
.tag.ok{color:var(--green);border-color:color-mix(in srgb,var(--green) 40%,transparent)}.tag.warn{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 50%,transparent)}.tag.bad{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent)}.tag.blue{color:var(--blue);border-color:color-mix(in srgb,var(--blue) 40%,transparent)}
.wrap{overflow:auto;border-radius:14px;border:1px solid var(--line)}
.drawer{position:fixed;inset:0;z-index:50;background:rgba(10,12,24,.45);backdrop-filter:blur(4px);display:flex;justify-content:flex-end}.drawer[hidden]{display:none}
.panel{width:min(620px,100%);height:100%;overflow:auto;background:var(--card);padding:22px 24px 40px;box-shadow:-20px 0 60px rgba(0,0,0,.25)}
.panel h2{margin:0 0 14px;font-size:20px;letter-spacing:-.02em}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}.form label{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--mute)}.form label.full{grid-column:1/-1}.form label input,.form label select,.form label textarea{font-weight:400;color:var(--ink)}
.form label.ck{display:flex;align-items:center;gap:8px;grid-column:span 1;padding-top:18px}.form label.ck input{width:auto}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;position:sticky;bottom:0;background:var(--card);padding:10px 0}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .card{width:min(380px,100%);padding:26px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;transition:.25s;z-index:99;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%)}
.bars{display:flex;align-items:flex-end;gap:4px;height:90px;margin-top:8px}.bars i{flex:1;background:linear-gradient(180deg,var(--blue),var(--teal));border-radius:4px 4px 0 0;min-height:3px;position:relative}.bars i::after{content:attr(data-l);position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:9px;color:var(--mute);white-space:nowrap;margin-top:3px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.mute{color:var(--mute)}.sm{font-size:12px}.mono{font-family:var(--mono)}
.empty{padding:26px;text-align:center;color:var(--mute)}
.stars button{font-size:18px;color:var(--amber)}
.prices td input{padding:5px 8px;border-radius:8px;width:90px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border-radius:99px;background:var(--soft);border:1px solid var(--line);font-size:12.5px}
@media (max-width:860px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}nav{display:flex;flex-wrap:wrap;gap:4px}nav button{width:auto}.who{display:none}main{padding:16px}}
</style>
</head>

 <div class="foot full" style="grid-column:1/-1">${s?`<button type="button" class="btn d" id="deact">${s.active?'Deactivate':'Reactivate'}</button>`:''}<span class="grow"></span><button type="button" class="btn" id="cx">Cancel</button><button class="btn p">${s?'Save':'Add partner'}</button></div></form>

   $('#pus').querySelectorAll('[data-reset]').forEach(b=>b.onclick=async()=>{const r=await api(`/stores/${s.id}/users/${b.dataset.reset}/reset`,{method:'POST',body:{}});prompt('One-time password (shown once):',r.tempPassword);paintPU()});$('#pus').querySelectorAll('[data-off]').forEach(b=>b.onclick=async()=>{if(!confirm('Disable this sign-in?'))return;await api(`/stores/${s.id}/users/${b.dataset.off}`,{method:'DELETE'});paintPU()})}catch(e){$('#pus').textContent=e.message}};paintPU();

async function priceEditor(s){const p=await api(`/stores/${s.id}/prices`);const lab=p.kind==='lab';let rows=p.rows,changed={},removed=[],added=[];
 const draw=()=>{const d=drawer(`<h2>${E(s.name)} · ${lab?'test prices':'medicine prices'}</h2><div class="row"><input id="pf" placeholder="Filter…" style="width:220px"><span class="grow"></span><button class="btn sm" id="bulk">Apply ${s.discount_pct}% store discount to all</button><button class="btn sm" id="addrow">＋ Add ${lab?'test':'item'}</button></div>
  <div class="wrap"><table class="prices"><thead><tr><th>${lab?'Test':'Medicine'}</th>${lab?'<th>Price ₹</th><th>TAT h</th><th>Fasting</th>':'<th>MRP</th><th>Price ₹</th><th>Stock</th>'}<th></th></tr></thead><tbody>${rows.map(r=>`<tr data-id="${r.id}"><td><b>${E(r.name)}</b><br><span class="mute sm mono">${E(r.code||r.sku)}</span></td>${lab?`<td><input type="number" data-k="price" value="${r.price}"></td><td><input type="number" data-k="tat_hours" value="${r.tat_hours}"></td><td><input type="checkbox" data-k="fasting" ${r.fasting?'checked':''} style="width:auto"></td>`:`<td>${money(r.mrp)}</td><td><input type="number" data-k="price" value="${r.price}"></td><td><input type="number" data-k="stock" value="${r.stock}"></td>`}<td><button class="btn sm d" data-rm="${r.id}">✕</button></td></tr>`).join('')}</tbody></table></div>
  <div class="foot"><button class="btn" id="cx">Cancel</button><button class="btn p" id="save">Save prices</button></div>`);
  $('#cx').onclick=()=>d.hidden=true;$('#pf').oninput=e=>{const q=e.target.value.toLowerCase();d.querySelectorAll('tbody tr').forEach(tr=>tr.style.display=tr.textContent.toLowerCase().includes(q)?'':'none')};
  d.querySelectorAll('[data-k]').forEach(i=>i.onchange=()=>{const id=+i.closest('tr').dataset.id;changed[id]=changed[id]||{id};changed[id][i.dataset.k]=i.type==='checkbox'?i.checked:Number(i.value)});
  d.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{removed.push(+b.dataset.rm);b.closest('tr').remove()});
  $('#bulk').onclick=()=>{d.querySelectorAll('tbody tr').forEach(tr=>{const id=+tr.dataset.id,r=rows.find(x=>x.id===id);if(!r||lab)return;const np=Math.max(1,Math.round(r.mrp*(1-s.discount_pct/100)));tr.querySelector('[data-k=price]').value=np;changed[id]=Object.assign(changed[id]||{id},{price:np})});toast('Applied; save to keep')};
  $('#addrow').onclick=()=>{const name=prompt(lab?'Test name':'Medicine name');if(!name)return;const price=+prompt('Price ₹')||0;added.push(lab?{code:name.toLowerCase().replace(/[^a-z0-9]+/g,'_').slice(0,30),name,price,tat_hours:24}:{sku:'custom_'+Date.now().toString(36),name,price,mrp:price,stock:20});toast('Added; save to keep')};
  $('#save').onclick=async()=>{await api(`/stores/${s.id}/prices`,{method:'PUT',body:{rows:Object.values(changed),remove:removed,add:added}});d.hidden=true;toast('Prices saved');VIEWS.partners()}};
 draw()}

VIEWS.seasonal=async()=>{main(head('Seasonal advisories','Shown on Home for the current month and region. Keep them short, factual and sourced (NCDC, IDSP, WHO).',`<button class="btn p" id="ns">＋ New advisory</button>`));const d=await api('/seasonal');const m=new Date().getMonth()+1;
 $('#main').insertAdjacentHTML('beforeend',`<div class="wrap card" style="padding:0"><table><thead><tr><th>Disease</th><th>Months</th><th>Risk</th><th>Region</th><th>Summary</th><th>Status</th></tr></thead><tbody>${d.items.map(x=>`<tr class="click" data-id="${x.id}"><td><b>${x.emoji} ${E(x.disease)}</b></td><td class="sm">${(x.months||[]).map(k=>`<span class="tag ${k===m?'blue':''}">${MONTHS[k-1]}</span>`).join('')}</td><td><span class="tag ${x.risk==='high'?'bad':x.risk==='medium'?'warn':''}">${x.risk}</span></td><td>${E(x.region)}</td><td class="sm mute">${E(x.summary)}</td><td>${x.active?'<span class="tag ok">Live</span>':'<span class="tag">Hidden</span>'}</td></tr>`).join('')}</tbody></table></div>`);
 const edit=x=>{const v=x||{region:'IN',months:[m],risk:'medium',emoji:'🦟',symptoms:[],prevention:[],active:true};const d2=drawer(`<h2>${x?'Edit advisory':'New advisory'}</h2><form id="szf" class="form"><label>Disease<input name="disease" value="${E(v.disease||'')}" required></label><label>Emoji<input name="emoji" value="${E(v.emoji)}"></label><label>Risk<select name="risk">${['low','medium','high'].map(r=>`<option ${v.risk===r?'selected':''}>${r}</option>`).join('')}</select></label><label>Region (IN or state code)<input name="region" value="${E(v.region)}"></label><label class="full">Months<div class="row" style="margin:0">${MONTHS.map((n,i)=>`<label class="chip"><input type="checkbox" name="m${i+1}" ${(v.months||[]).includes(i+1)?'checked':''} style="width:auto"> ${n}</label>`).join('')}</div></label><label class="full">Summary<textarea name="summary" rows="2">${E(v.summary||'')}</textarea></label><label class="full">Symptoms (one per line)<textarea name="symptoms" rows="4">${E((v.symptoms||[]).join('\n'))}</textarea></label><label class="full">Prevention (one per line)<textarea name="prevention" rows="4">${E((v.prevention||[]).join('\n'))}</textarea></label><label class="full">When to see a doctor<textarea name="see_doctor" rows="2">${E(v.see_doctor||'')}</textarea></label><label>Source<input name="source" value="${E(v.source||'')}"></label><label class="ck"><input type="checkbox" name="active" ${v.active?'checked':''}> Live</label><div class="foot" style="grid-column:1/-1">${x?'<button type="button" class="btn d" id="del">Delete</button>':''}<span class="grow"></span><button type="button" class="btn" id="cx">Cancel</button><button class="btn p">Save</button></div></form>`);
  $('#cx').onclick=()=>d2.hidden=true;if($('#del'))$('#del').onclick=async()=>{if(!confirm('Delete this advisory?'))return;await api('/seasonal/'+x.id,{method:'DELETE'});d2.hidden=true;VIEWS.seasonal()};
  $('#szf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const lines=k=>f.get(k).split('\n').map(s=>s.trim()).filter(Boolean);await api('/seasonal',{method:'POST',body:{id:x?x.id:undefined,disease:f.get('disease'),emoji:f.get('emoji'),risk:f.get('risk'),region:f.get('region'),months:MONTHS.map((_,i)=>i+1).filter(i=>f.get('m'+i)==='on'),summary:f.get('summary'),symptoms:lines('symptoms'),prevention:lines('prevention'),see_doctor:f.get('see_doctor'),source:f.get('source'),active:f.get('active')==='on'}});d2.hidden=true;toast('Saved');VIEWS.seasonal()}};
 $('#ns').onclick=()=>edit(null);$('#main').querySelectorAll('tr[data-id]').forEach(tr=>tr.onclick=()=>edit(d.items.find(x=>x.id===tr.dataset.id)))};
// ---------------------------------------------------------------- videos
const TOPICS=['cpr_adult','cpr_child','cpr_infant','choking_adult','choking_child','choking_baby','bleeding','burns','heart_attack','stroke','seizure','asthma','anaphylaxis','fracture','head_injury','diabetic','recovery_position','snake_bite','drowning','fainting','nosebleed','heat_stroke','other'];
VIEWS.videos=async()=>{main(head('First-aid videos','Public videos from official organisations, embedded from YouTube (nothing is downloaded or re-hosted). Paste a YouTube link or ID.',`<button class="btn p" id="nv">＋ Add video</button>`));const d=await api('/videos');
 $('#main').insertAdjacentHTML('beforeend',`<div class="wrap card" style="padding:0"><table><thead><tr><th></th><th>Topic</th><th>Title</th><th>Channel</th><th>Lang</th><th>Status</th></tr></thead><tbody>${d.videos.map(v=>`<tr class="click" data-id="${v.id}"><td><img src="https://i.ytimg.com/vi/${E(v.yt)}/mqdefault.jpg" alt="" width="96" style="border-radius:8px;display:block" loading="lazy"></td><td class="mono sm">${E(v.topic)}</td><td><b>${E(v.title)}</b><br><a class="sm" href="https://www.youtube.com/watch?v=${E(v.yt)}" target="_blank" rel="noopener">${E(v.yt)}</a></td><td>${E(v.channel)}</td><td>${E(v.lang)}</td><td>${v.verified?'<span class="tag ok">Verified</span>':'<span class="tag warn">Unverified</span>'}${v.active?'':'<span class="tag">Hidden</span>'}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No videos yet</td></tr>'}</tbody></table></div>`);
 const edit=v=>{const x=v||{topic:'cpr_adult',lang:'en',verified:false,active:true,sort:99};const d2=drawer(`<h2>${v?'Edit video':'Add video'}</h2><form id="vf" class="form"><label class="full">YouTube link or ID<input name="yt" value="${E(x.yt||'')}" required></label><label class="full">Title<input name="title" value="${E(x.title||'')}" required></label><label>Channel / organisation<input name="channel" value="${E(x.channel||'')}" required></label><label>Topic<select name="topic">${TOPICS.map(t=>`<option ${x.topic===t?'selected':''}>${t}</option>`).join('')}</select></label><label>Language<select name="lang">${['en','hi','te','ta','kn','ml','mr','bn'].map(l=>`<option ${x.lang===l?'selected':''}>${l}</option>`).join('')}</select></label><label>Sort<input name="sort" type="number" value="${x.sort}"></label><label class="full">Source page<input name="source" value="${E(x.source||'')}"></label><label class="ck"><input type="checkbox" name="verified" ${x.verified?'checked':''}> Verified official channel</label><label class="ck"><input type="checkbox" name="active" ${x.active?'checked':''}> Live</label><div class="foot" style="grid-column:1/-1">${v?'<button type="button" class="btn d" id="del">Delete</button>':''}<span class="grow"></span><button type="button" class="btn" id="cx">Cancel</button><button class="btn p">Save</button></div></form>`);
  $('#cx').onclick=()=>d2.hidden=true;if($('#del'))$('#del').onclick=async()=>{await api('/videos/'+v.id,{method:'DELETE'});d2.hidden=true;VIEWS.videos()};
  $('#vf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await api('/videos',{method:'POST',body:{id:v?v.id:undefined,yt:f.get('yt'),title:f.get('title'),channel:f.get('channel'),topic:f.get('topic'),lang:f.get('lang'),sort:+f.get('sort'),source:f.get('source'),verified:f.get('verified')==='on',active:f.get('active')==='on'}});d2.hidden=true;toast('Saved');VIEWS.videos()}};
 $('#nv').onclick=()=>edit(null);$('#main').querySelectorAll('tr[data-id]').forEach(tr=>tr.onclick=()=>edit(d.videos.find(x=>x.id===tr.dataset.id)))};
// ---------------------------------------------------------------- team & audit
VIEWS.system=async()=>{main(head('System','Clinical reviewer, services and app errors'));const [st,errs,stats]=await Promise.all([api('/settings'),api('/client-errors'),api('/stats')]);const rv=st.reviewer||{};
 main(head('System','Clinical reviewer, services and app errors')+`<div class="two"><div class="card"><h3>Clinical reviewer</h3><p class="sm mute">Shown in the app on first aid, insights, cycle and children's pages once filled in. Leave the name empty to show "awaiting review".</p>
  <form id="rvf" class="form"><label>Name<input name="name" value="${E(rv.name||'')}" placeholder="Dr. Name"></label><label>Qualification<input name="qualification" value="${E(rv.qualification||'')}" placeholder="MBBS, MD (Medicine)"></label><label>Registration no.<input name="registration" value="${E(rv.registration||'')}" placeholder="NMC / state council"></label><label>Review date<input name="date" value="${E(rv.date||'')}" placeholder="18 Oct 2026"></label><label>Scope<input name="scope" value="${E(rv.scope||'')}" placeholder="First aid, lab guidance, pregnancy, cycle"></label><button class="btn p" type="submit">Save</button></form></div>
  <div class="card"><h3>Services</h3><table class="tbl"><tbody><tr><td>Smart reading</td><td><b>${stats.engine==='claude'?'on':'off'}</b></td></tr><tr><td>Documents</td><td><b>${st.files||'db'}</b> ${st.files==='db'?'(set S3_BUCKET for a bucket)':''}</td></tr><tr><td>Push reminders</td><td><b>${st.push?'on':'off (set VAPID_PRIVATE_KEY)'}</b></td></tr><tr><td>Environment</td><td><b>${E(st.env||'production')}</b></td></tr></tbody></table></div></div>
  <div class="card"><div class="hd"><h3>App errors · last 100</h3><button class="btn sm" id="errclr">Clear</button></div>${errs.length?`<table class="tbl"><thead><tr><th>When</th><th>Message</th><th>Page</th><th>Count</th></tr></thead><tbody>${errs.map(e=>`<tr><td>${new Date(e.t*1000).toLocaleString('en-IN')}</td><td><b>${E(e.message)}</b><br><small class="mute">${E((e.stack||'').slice(0,160))}</small></td><td>${E(e.page)}</td><td>${e.count}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No errors reported</div>'}</div>`);
 $('#rvf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await api('/settings/reviewer',{method:'POST',body:Object.fromEntries(f.entries())});go('system')};$('#errclr').onclick=async()=>{await api('/client-errors',{method:'DELETE'});go('system')}};
VIEWS.team=async()=>{main(head('Team & audit','Admin accounts (owner: everything; ops: partners, orders, households; content: advisories and videos) and the change log.'));
 let admins={admins:[]};try{admins=await api('/admins')}catch(e){}const au=await api('/audit');
 $('#main').insertAdjacentHTML('beforeend',`<div class="two"><div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Admins</h3>${ME.role==='owner'?'<button class="btn sm" id="na">＋ Add admin</button>':''}</div><table><thead><tr><th>Email</th><th>Role</th><th>Last login</th><th></th></tr></thead><tbody>${admins.admins.map(a=>`<tr><td>${E(a.email)}</td><td>${E(a.role)}</td><td class="sm">${when(a.lastLogin)}</td><td>${ME.role==='owner'?`<button class="btn sm" data-pw="${E(a.email)}">Reset password</button> <button class="btn sm d" data-da="${a.id}">✕</button>`:''}</td></tr>`).join('')||'<tr><td colspan="4" class="mute sm">Only owners can list admins.</td></tr>'}</tbody></table></div>
 <div class="card"><h3>Audit log</h3><div class="wrap" style="max-height:480px"><table><tbody>${au.rows.map(r=>`<tr><td class="sm mono mute" style="white-space:nowrap">${when(r.t)}</td><td class="sm"><b>${E(r.who)}</b> ${E(r.what)}<br><span class="mute">${E(r.detail).slice(0,160)}</span></td></tr>`).join('')||'<tr><td class="mute">Nothing yet</td></tr>'}</tbody></table></div></div></div>`);
 const form=(email)=>{const d2=drawer(`<h2>${email?'Reset password':'Add admin'}</h2><form id="af" class="form"><label class="full">Email<input name="email" type="email" value="${E(email||'')}" ${email?'readonly':''} required></label><label>Password (8+)<input name="password" type="password" minlength="8" required></label><label>Role<select name="role"><option>ops</option><option>content</option><option>owner</option></select></label><div class="foot" style="grid-column:1/-1"><button type="button" class="btn" id="cx">Cancel</button><button class="btn p">Save</button></div></form>`);
  $('#cx').onclick=()=>d2.hidden=true;$('#af').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await api('/admins',{method:'POST',body:{email:f.get('email'),password:f.get('password'),role:f.get('role')}});d2.hidden=true;toast('Saved');VIEWS.team()}};
 if($('#na'))$('#na').onclick=()=>form(null);$('#main').querySelectorAll('[data-pw]').forEach(b=>b.onclick=()=>form(b.dataset.pw));$('#main').querySelectorAll('[data-da]').forEach(b=>b.onclick=async()=>{if(!confirm('Remove this admin?'))return;await api('/admins/'+b.dataset.da,{method:'DELETE'});VIEWS.team()})};
// ---------------------------------------------------------------- boot
(async()=>{try{ME=await api('/me')}catch(e){ME=null}render()})();
addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(v&&VIEWS[v]&&v!==VIEW){VIEW=v;render()}});
</script>
</body>
</html>

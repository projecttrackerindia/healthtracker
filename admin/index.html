<meta name="robots" content="noindex">
<link rel="icon" href="/brand/svg/admin-icon.svg"><meta name="theme-color" content="#1C1E26">
<style>
:root{--bg:#f3f5fa;--card:#fff;--soft:#f6f8fc;--ink:#0f1221;--mute:#6b7285;--line:rgba(15,18,33,.08);--blue:#2f5bff;--teal:#13b5a3;--red:#ef3b4f;--amber:#f59e0b;--green:#16a34a;--r:18px;--sh:0 10px 30px -14px rgba(15,18,33,.25);--font:"Geist",Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b0d14;--card:#141826;--soft:#1a1f30;--ink:#eef1fb;--mute:#8f97ad;--line:rgba(255,255,255,.08);--sh:0 10px 30px -14px rgba(0,0,0,.6)}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
a{color:var(--blue);text-decoration:none}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh/var(--uz,1))}
aside{position:sticky;top:0;height:calc(100vh/var(--uz,1));padding:18px 14px;border-right:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:4px}
.logo svg.thl{display:block;height:28px;width:auto;max-width:100%}.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;padding:4px 8px 16px}.logo i{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--teal));display:grid;place-items:center;color:#fff;font-style:normal}
.logo small{display:block;font-weight:500;color:var(--mute);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase}
nav button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px;border-radius:12px;color:var(--mute);font-weight:500}
nav button:hover{background:var(--soft);color:var(--ink)}nav button.on{background:color-mix(in srgb,var(--blue) 12%,transparent);color:var(--blue);font-weight:600}
nav .navh{font:600 12.5px var(--mono);letter-spacing:.1em;color:var(--mute);padding:14px 12px 4px}nav button em{margin-left:auto;font-style:normal;font-size:12.5px;background:var(--red);color:#fff;border-radius:99px;padding:1px 7px}
.who{margin-top:auto;padding:10px 12px;border-top:1px solid var(--line);font-size:13px;color:var(--mute)}.who b{display:block;color:var(--ink);font-size:14px;overflow:hidden;text-overflow:ellipsis}
main{padding:22px 26px 60px;max-width:1500px}
h1{font-size:26px;letter-spacing:-.03em;margin:0 0 2px}.sub{color:var(--mute);margin:0 0 18px}
h3{margin:0 0 10px;font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);border:1px solid var(--line)}
.kpi small{display:block;font:600 12.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}.kpi b{font-size:28px;letter-spacing:-.03em;line-height:1.1;display:block;margin-top:6px}.kpi span{font-size:13px;color:var(--mute)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.grow{flex:1 1 auto;min-width:0}
input,select,textarea{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:9px 12px;outline:none;min-width:0;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 18%,transparent)}
.row input,.row select{width:auto}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:12px;font-weight:600;background:var(--soft);border:1px solid var(--line);white-space:nowrap}
.btn.p{background:var(--blue);color:#fff;border-color:transparent}.btn.d{color:var(--red)}.btn.sm{padding:6px 10px;font-size:13.5px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font:600 12.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border:0}tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
.tag{display:inline-block;font:600 12.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:99px;background:var(--soft);border:1px solid var(--line);color:var(--mute);margin:0 3px 3px 0}
.tag.ok{color:var(--green);border-color:color-mix(in srgb,var(--green) 40%,transparent)}.tag.warn{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 50%,transparent)}.tag.bad{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent)}.tag.blue{color:var(--blue);border-color:color-mix(in srgb,var(--blue) 40%,transparent)}
.wrap{overflow:auto;border-radius:14px;border:1px solid var(--line)}
.drawer{position:fixed;inset:0;z-index:50;background:rgba(10,12,24,.45);backdrop-filter:blur(4px);display:flex;justify-content:flex-end}.drawer[hidden]{display:none}
.panel{width:min(620px,100%);height:100%;overflow:auto;background:var(--card);padding:22px 24px 40px;box-shadow:-20px 0 60px rgba(0,0,0,.25)}
.panel h2{margin:0 0 14px;font-size:20px;letter-spacing:-.02em}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}.form label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--mute)}.form label.full{grid-column:1/-1}.form label input,.form label select,.form label textarea{font-weight:400;color:var(--ink)}
.form label.ck{display:flex;align-items:center;gap:8px;grid-column:span 1;padding-top:18px}.form label.ck input{width:auto}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;position:sticky;bottom:0;background:var(--card);padding:10px 0}
.login{min-height:calc(100vh/var(--uz,1));display:grid;place-items:center;padding:20px}.login .card{width:min(380px,100%);padding:26px}
.login .card{max-width:calc(calc(100vw/var(--uz,1)) - 32px);box-sizing:border-box}.tf{min-width:0;animation:tfin .35s cubic-bezier(.2,.8,.2,1) both}@keyframes tfin{from{opacity:0;transform:translateY(8px)}}
.tf h2{font-size:22px;letter-spacing:-.02em;margin:2px 0 6px}.tf p{color:var(--mute);margin:0 0 14px;font-size:14px;line-height:1.45}
.tf .qr{width:184px;height:184px;margin:6px auto 12px;padding:10px;border-radius:22px;background:#fff;box-shadow:0 0 0 1px var(--line),var(--sh);display:grid;place-items:center}.tf .qr svg{width:100%;height:100%}
.tf .key{display:flex;align-items:center;justify-content:space-between;gap:10px;box-sizing:border-box;font-family:var(--mono);font-size:14px;letter-spacing:.08em;background:var(--soft);border-radius:999px;padding:8px 14px;margin:0 auto 14px;width:max-content;max-width:100%;word-break:break-all}
.tf .key button{flex:none;white-space:nowrap;border:0;background:var(--blue);color:#fff;border-radius:999px;font:600 12px var(--font);padding:5px 10px;cursor:pointer}
.otp6{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:4px 0 12px}.otp6 input{height:54px;border-radius:16px;border:1px solid var(--line);background:var(--soft);text-align:center;font:600 22px var(--mono);color:var(--ink);padding:0}
.otp6 input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px color-mix(in srgb,var(--blue) 18%,transparent);background:var(--card)}
.tf .steps{display:flex;gap:6px;justify-content:center;margin:0 0 14px}.tf .steps i{width:22px;height:5px;border-radius:3px;background:var(--line)}.tf .steps i.on{background:var(--blue)}
.tf .key span{min-width:0}.tf .apps{font-size:13.5px;color:var(--mute);text-align:center;margin:-4px 0 12px}
.pu{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}.pu:first-child{border-top:0}
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:12px 4px}.pager button{border-radius:999px}
.role{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--soft)}
.role.owner{background:color-mix(in srgb,var(--blue) 12%,transparent);color:var(--blue)}.role.ops{background:color-mix(in srgb,var(--teal) 14%,transparent);color:#0d8577}.role.content{background:color-mix(in srgb,var(--amber) 16%,transparent);color:#b45309}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;transition:.25s;z-index:99;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%)}
.bars{display:flex;align-items:flex-end;gap:4px;height:90px;margin-top:8px}.bars i{flex:1;background:linear-gradient(180deg,var(--blue),var(--teal));border-radius:4px 4px 0 0;min-height:3px;position:relative}.bars i::after{content:attr(data-l);position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:9px;color:var(--mute);white-space:nowrap;margin-top:3px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.mute{color:var(--mute)}.sm{font-size:13px}.mono{font-family:var(--mono)}
.empty{padding:26px;text-align:center;color:var(--mute)}
.stars button{font-size:18px;color:var(--amber)}
.prices td input{padding:5px 8px;border-radius:8px;width:90px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border-radius:99px;background:var(--soft);border:1px solid var(--line);font-size:13.5px}
@media (max-width:640px){main{padding:12px!important}h1{font-size:24px!important}.tw{grid-template-columns:1fr 1fr!important;gap:8px!important}.tk b{font-size:20px!important}.nr{flex-wrap:wrap}.nr .btn{margin-left:auto}.tbl,table{display:block;overflow-x:auto;white-space:nowrap}.two,.g2,.g3{grid-template-columns:1fr!important}.seg{overflow-x:auto;max-width:100%}aside nav{overflow-x:auto;flex-wrap:nowrap!important}aside nav button{flex:none}}
@media (max-width:860px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}nav{display:flex;flex-wrap:wrap;gap:4px}nav button{width:auto}.who{display:none}main{padding:16px}}

.ob-r b{display:block;font-weight:600}.ob-r small{color:var(--mute)}
.pill{margin-left:auto;font-size:12.5px;font-weight:600;padding:3px 8px;border-radius:99px;white-space:nowrap;background:var(--soft);color:var(--mute)}
.pill.b{background:color-mix(in srgb,var(--blue) 12%,transparent);color:var(--blue)}.pill.a{background:#FFF4E0;color:#8A4B00}.pill.g{background:#E8F8EC;color:#1B6E30}.pill.r{background:#FFECEB;color:#B3001B}.pill.d{background:var(--doc-bg,#FFF1E6);color:var(--doc,#B54708)}.pill svg{width:12px;height:12px;vertical-align:-1px;margin-right:4px}
.ob-d{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.ob-h{display:flex;gap:14px;align-items:center}.ob-h .av{width:56px;height:56px;font-size:20px;border-radius:14px}.ob-h h2{margin:0;font-size:22px;letter-spacing:-.01em}
.steps{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--mute);flex-wrap:wrap}.steps i{font-style:normal;width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:12.5px;font-weight:700;background:var(--soft);margin-right:6px}

.g2{display:grid;grid-template-columns:1.15fr 1fr;gap:14px}.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}

.ob-f{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.ob-f .mute{margin-right:auto}
.who .mob{display:block;margin-top:4px}

function cmdk(){let el=$('#km');if(el)return;el=document.createElement('div');el.className='km';el.id='km';el.innerHTML='<div><input id="kq" placeholder="Search partners, orders, payments, or type an action…" autocomplete="off"><div id="kr"><p class="mute sm" style="padding:12px 18px">Try “vijaya”, an order number, a UTR, or “late”.</p></div></div>';document.body.append(el);

  $('#kr').querySelectorAll('.ki').forEach(b=>b.onclick=async()=>{const x=JSON.parse(b.dataset.x);close();
   if(x.type==='partner'||x.do==='open'){OB.sel=x.id;go(x.kind==='pharmacy'?'pharmacies':x.kind==='hospital'?'hospitals':'labs')}
   else if(x.type==='order'){BD.sel=x.id;go('board')}else if(x.type==='payment')go('payments');else if(x.type==='go')go(x.go);
   else if(x.do==='pause'){const why=await askText(x.title+'? Why (recorded):');if(why===null)return;await api('/onboard/'+x.id+'/state',{method:'POST',body:{action:'pause',note:why}});toast('Paused')}})},220)}}

  <div class="sm">${q.lines.map(l=>`${l.qty} × ${E(l.name)}${l.opt?' · '+E(l.opt):''}${l.to&&q.kind==='exchange'?' → <b>'+E(l.to)+'</b>':''}`).join('<br>')}</div>
  ${q.note?`<div class="sm mute">“${E(q.note)}”</div>`:''}

  <div>${kv('Family',c.member)}${kv('Phone',c.phone)}${kv('Pick up from',c.address)}${kv('Delivered',day(c.delivered)+(c.late?' · late':''))}${!ex?kv('Refund to',q.to==='upi'?'UPI '+q.upi:'Original payment ('+c.payment+')'):''}</div>
  <div class="ra">${c.status==='return_requested'?`<button class="btn sm" data-rr="${E(c.id)}">Mark received</button>`:''}${ex?`<button class="btn sm p" data-rx="${E(c.id)}" data-k="${q.kind}">${q.kind==='exchange'?'Exchange sent':'Replacement sent'}</button>`:`<button class="btn sm p" data-rf="${E(c.id)}" data-amt="${q.refund}" data-to="${q.to==='upi'?'upi':'razorpay'}" data-why="${E('Return: '+q.reason)}">Refund ${money(q.refund)}</button>`}<button class="btn sm d" data-rd="${E(c.id)}">Decline</button></div></div>`};
 const F=c=>`<div class="rcard"><div class="rh"><b class="mono">${E(c.id)}</b><span class="tag bad">Refund due</span><span class="mute sm" style="margin-left:auto">${when(c.created)}</span></div><div class="rt">Cancelled after paying ${money(c.total)} online</div><div>${kv('Family',c.member)}${kv('Phone',c.phone)}${c.refunded?kv('Already refunded',money(c.refunded)):''}</div><div class="ra"><button class="btn sm p" data-rf="${E(c.id)}" data-amt="${c.due}" data-to="razorpay" data-why="Cancelled before packing">Refund ${money(c.due)}</button></div></div>`;
 el.innerHTML=`<div class="tcard rbox"><h3>Returns and refunds · ${n}</h3><p class="mute sm" style="margin:2px 0 12px">Hospital bag requests, oldest first. Every step tells the family in the app. Policy: <a href="/hospital-bag/policies" target="_blank" rel="noopener">urbanhealth.in/hospital-bag/policies</a></p><div class="rgrid">${d.returns.slice().reverse().map(R).join('')}${d.refunds.map(F).join('')}</div></div>`;

VIEWS.team=async()=>{main(head('Team & audit','Who runs Urban Health. Owner: everything. Operations: partners, orders, families and privacy requests. Content: the library only. Every admin signs in with an authenticator app.'));

 <div class="card"><h3>Audit log</h3><div class="wrap" style="max-height:480px"><table><tbody>${au.rows.map(r=>`<tr><td class="sm mono mute" style="white-space:nowrap">${when(r.t)}</td><td class="sm"><b>${E(whoTxt(r.who))}</b> ${E(actTxt(r.what))}${r.detail?`<br><span class="mute">${E(r.detail).slice(0,160)}</span>`:''}</td></tr>`).join('')||'<tr><td class="mute">Nothing yet</td></tr>'}</tbody></table></div></div></div>`);
 const form=(email)=>{const d2=drawer(`<h2>${email?'Reset password':'Add admin'}</h2><form id="af" class="form"><label class="full">Email<input name="email" type="email" value="${E(email||'')}" ${email?'readonly':''} required></label><label>Password (12+ characters, not a common one)<input name="password" type="password" minlength="12" maxlength="128" required></label><label>Role<select name="role"><option value="ops">Operations</option><option value="content">Content</option><option value="owner">Owner</option></select></label><div class="foot" style="grid-column:1/-1"><button type="button" class="btn" id="cx">Cancel</button><button class="btn p">Save</button></div></form>`);
  $('#cx').onclick=()=>d2.hidden=true;$('#af').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await api('/admins',{method:'POST',body:{email:f.get('email'),password:f.get('password'),role:f.get('role')}});d2.hidden=true;toast('Saved');VIEWS.team()}};
 if($('#na'))$('#na').onclick=()=>form(null);$('#main').querySelectorAll('[data-pw]').forEach(b=>b.onclick=()=>form(b.dataset.pw));$('#main').querySelectorAll('[data-da]').forEach(b=>b.onclick=async()=>{if(!await uhConfirm('Remove this admin?'))return;await api('/admins/'+b.dataset.da,{method:'DELETE'});VIEWS.team()});
 $('#main').querySelectorAll('[data-tr]').forEach(b=>b.onclick=async()=>{if(!await uhConfirm('Reset their authenticator? They are signed out and set it up again at their next sign-in.'))return;await api('/admins/'+b.dataset.tr+'/reset-totp',{method:'POST'});toast('Authenticator reset');VIEWS.team()})};

addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(v&&VIEWS[v]&&v!==VIEW){VIEW=v;render()}});

/* Every screen's headline carries the one number that matters there, in the design's pill. Counted from what the
   screen itself shows, so it is never a guess; when a screen has no single number, the title stays alone. */
const GBN={board:m=>{const n=[...m.querySelectorAll('.lane h4,.alane h4')].reduce((a,h)=>a+(parseInt((h.textContent.match(/(\d+)\s*$/)||[])[1])||0),0);return[n,n===1?'on the board':'on the board']},
 rx:m=>{const x=(m.textContent.match(/(\d+) waiting/)||[])[1];return x!=null&&[+x,'waiting']},
 dispatch:m=>{const x=(m.textContent.match(/Unclaimed · (\d+)/)||[])[1];return x!=null&&[+x,'unclaimed']},
 orders:m=>{const x=(m.textContent.match(/(\d+) orders?\b/)||[])[1];return x!=null&&[+x,+x===1?'order':'orders']},
 pharmacies:m=>{const b=m.querySelector('#obe .obek b')||m.querySelector('.ob-k>div>b');return b&&[+b.textContent.replace(/,/g,'')||0,'live']},labs:m=>GBN.pharmacies(m),hospitals:m=>GBN.pharmacies(m),
 applications:m=>APF.status==='new'&&[m.querySelectorAll('tr[data-sel]').length,'waiting'],
 partners:m=>{const n=m.querySelectorAll('table tr').length-1;return n>=0&&[n,'partners']},
 meds:m=>{const i=m.querySelector('input[placeholder*="medicines"]'),x=i&&(i.placeholder.match(/(\d+) medicines/)||[])[1];return x!=null&&[+x,'medicines']},
 packages:m=>{const n=m.querySelectorAll('table tr').length-1;return n>0&&[n,'tests']},
 families:m=>{const x=(m.textContent.match(/SUPPORT QUEUE · (\d+)/i)||[])[1];return x!=null&&[+x,'in support']},
 settlements:m=>{const x=(m.textContent.match(/(\d+) payouts? to make/)||[])[1];return x!=null&&[+x,'to pay']},
 complaints:m=>{const n=m.querySelectorAll('[data-cm],[data-cid],.cmrow').length;return[n,'open']},
 team:m=>{const t=m.querySelector('table');const n=t?t.querySelectorAll('tr').length-1:0;return n>0&&[n,n===1?'admin':'admins']},
 approvals:m=>{const x=(m.textContent.match(/Waiting · (\d+)/)||[])[1];return x!=null&&[+x,'waiting']},
 messages:m=>{if(MO==='offers')return false;const n=m.querySelectorAll('.msg2 .pill.a').length;return[n,'blocked']},
 seasonal:m=>{const n=m.querySelectorAll('.msg2 tbody tr').length;return n>0&&[n,'advisories']},
 companies:m=>{const n=m.querySelectorAll('.tcard .tw').length;return[n,'added']},
 datareq:m=>{const b=[...m.querySelectorAll('.bxk b')].reduce((a,x)=>a+(+x.textContent||0),0);return m.querySelector('.bxk')&&[b,'waiting']},
 uploads:m=>{const b=m.querySelector('.bxk b');return b&&[+b.textContent||0,'to match']},
 privacy:m=>{const n=m.querySelectorAll('.ovr .pill.r').length;return m.querySelector('.ovr')&&(n?[n,'to fix']:[0,'to fix'])},
 videos:m=>{const n=m.querySelectorAll('tbody tr').length;return n>0&&[n,'videos']},
 anatomy:m=>{const x=(m.textContent.match(/(\d+) waiting · safety first/)||[])[1];return x!=null&&[+x,'waiting']}};
function gbHead(){const m=$('#main');if(!m)return;const h=m.querySelector('h1');if(!h||h.classList.contains('gbh1'))return;h.classList.add('gbsoft');
 const f=GBN[VIEW];let r=null;try{r=f&&f(m)}catch(_){}let p=h.querySelector('.gbpill');if(!r){if(p)p.remove();return}
 const t=`${Number(r[0]).toLocaleString('en-IN')} ${r[1]}`;if(!p){h.insertAdjacentHTML('beforeend',' <span class="gbpill"></span>');p=h.querySelector('.gbpill')}if(p.textContent!==t)p.textContent=t;const hr=h.closest('.row');if(hr){const x=hr.querySelector(':scope>.row');if(x&&x.children.length===1&&x.firstElementChild.matches('.pill,.tag'))x.firstElementChild.style.display='none'}}
new MutationObserver(()=>{clearTimeout(gbHead.k);gbHead.k=setTimeout(gbHead,120)}).observe(document.documentElement,{childList:true,subtree:true});
</script>
<script>/* Ask bar steps aside while you scroll down through content, and comes back when you scroll up or reach the end */
(()=>{let y=scrollY,t;addEventListener('scroll',()=>{const b=document.querySelector('.askbar,.pask');if(!b)return;const n=scrollY,end=n+innerHeight>=document.documentElement.scrollHeight-40;if(document.activeElement&&b.contains(document.activeElement)){y=n;return}b.classList.toggle('ask-away',n>y+4&&n>80&&!end);if(n<y-4||end)b.classList.remove('ask-away');y=n},{passive:true})})();</script>
<script>/* Boards for the quieter admin pages: the same page, with its counts on top, a clear empty state and
   "how it works" steps when there is nothing yet, and the board's side notes. Runs after each page draws. */
(()=>{const nf=x=>Number(x||0).toLocaleString('en-IN');
 const kpi=a=>`<div class="bxk">${a.map(([t,n,sub,c])=>`<div class="tcard"><small>${t}</small><b>${typeof n==='number'?nf(n):n}</b>${sub?`<i class="${c||''}">${sub}</i>`:''}</div>`).join('')}</div>`;
 const hero=(t,x,btn)=>`<div class="tcard obe0"><span class="ic">○</span><b>${t}</b><p>${x}</p>${btn?`<button class="btn p" data-bxb>${btn}</button>`:''}</div>`;
 const steps=(t,a)=>`<div class="tcard"><h3 style="margin:0 0 12px">${t}</h3><div class="obes">${a.map((x,i)=>`<div><b>${i+1}</b><span>${x}</span></div>`).join('')}</div></div>`;
 const side=a=>a.map(([h,t,b,small])=>`<div class="tcard">${small?`<small class="crs">${small}</small>`:''}<h3 style="margin:${small?'4px':0} 0 6px">${h}</h3><p class="msgp">${t}</p>${b||''}</div>`).join('');
 function lay(top,main,sd,keepBody){const m=$('#main');if(!m||m.querySelector('.bxg'))return;const hd=m.querySelector(':scope>.ptb')||m.firstElementChild,rest=[...m.children].slice([...m.children].indexOf(hd)+1);
  const g=document.createElement('div');g.className='bxg';g.innerHTML=`<div class="bxm">${top||''}${main||''}</div><div class="bxs">${sd||''}</div>`;
  if(keepBody){const mm=g.querySelector('.bxm');rest.forEach(x=>mm.appendChild(x))}else rest.forEach(x=>x.remove());hd.after(g)}
 const B={
 applications:async()=>{if(APF.status!=='new')return;const m=$('#main');if(!/No applications here/.test(m.textContent))return;const t=await api('/console/today?days=7').catch(()=>null),O=(t&&t.overview)||{};
  lay('',hero('No applications are waiting','New applications from the partner portal appear here, oldest first, with how long each has waited.')+steps('How an application is reviewed',['The partner applies at urbanhealth.in/partner','You check the licence or registration on the regulator’s register','You approve, ask for changes or decline','Approved partners start onboarding']),
   side([['Answer within 2 working days','New applications stay under “Needs you” on Overview until each one is answered.'],[`Verified partners · ${nf(O.verified)}`,O.waiting?`${nf(O.waiting)} more are onboarding. Open each one to see what is missing.`:'Nobody else is onboarding right now.']]))},
 companies:async()=>{const m=$('#main');if(m.querySelector('[data-co],.tcard .tw'))return;
  lay('',hero('No company is added yet','A company can give Urban Health to its staff and their families. Each family stays private; the company sees only how many people joined.','Add a company')+steps('How a company plan works',['You add the company and its plan','Staff join privately with the company code','Each family uses the app as usual','The company sees group totals only, never health data']),
   side([['Families stay private','Totals are shown only for groups large enough that nobody can be picked out.']]));const b=m.querySelector('[data-bxb]'),n=$('#conew');if(b&&n)b.onclick=()=>n.click()},
 datareq:async()=>{const d=await api('/data-requests').catch(()=>null);if(!d)return;const open=d.rows.filter(r=>r.status!=='done'),c=k=>open.filter(r=>r.kind===k).length,sub=k=>c(k)?c(k)+' waiting':'none waiting';
  const tbl=`<div class="tcard"><table class="apt"><tr><th>Request</th><th>What you do</th><th>Answer within</th></tr><tr><td><b>Copy of my data</b></td><td>Nothing: the file is made on their phone</td><td>Same day</td></tr><tr><td><b>Correct my details</b></td><td>Review the change and approve it</td><td>${d.rules.days} days</td></tr><tr><td><b>Delete my data</b></td><td>Confirm after the 48-hour wait</td><td>${d.rules.days} days</td></tr></table></div>`;
  lay(kpi([['Copies',c('copy'),sub('copy')],['Corrections',c('correct'),sub('correct')],['Erasures',c('delete'),sub('delete')]]),open.length||d.rows.length?'':hero('No requests are waiting','When a family asks for a copy of their data, a correction or erasure, it appears here with the days left to answer.')+tbl,
   side([['Deadlines come first','Requests are sorted by days left. '+d.rules.kept+' are kept by law even after erasure.']]),!!(open.length||d.rows.length))},
 uploads:async()=>{const d=await api('/uploads-inbox').catch(()=>null);if(!d)return;const w=d.rows.filter(r=>!r.team).length,as=d.rows.filter(r=>r.asked&&!r.team).length,h=d.rows.filter(r=>r.team).length;
  lay(kpi([['Waiting to match',w,w?'':'none'],['Family asked us to check',as,as?'':'none'],['Handled',h,'']]),d.rows.length?'':hero('No reports are waiting','When a lab uploads through a family’s secure link and the name doesn’t match, the report waits here for a person to check.')+steps('How a report reaches a family',['The family sends the lab a secure link','The lab uploads a PDF, no account needed','The name and date are matched','It appears on the right person’s body']),
   side([['You never read the report','This page shows only the lab, who it was sent for and why it paused. The values stay hidden.']]),!!d.rows.length)},
 privacy:async()=>{const [su,dr]=await Promise.all([api('/console/setup').catch(()=>null),api('/data-requests').catch(()=>({rows:[]}))]);const it=k=>su&&su.items.find(i=>i.key===k);
  const L=[['Grievance officer named','Shown on every family’s Privacy page',(it('grievance')||{}).ok],['Owner email on urbanhealth.in',(it('adminmail')||{}).now||'Used for resets and the grievance address',(it('adminmail')||{}).ok],['Separate consent for each purpose','Families choose each one at sign-up and can change it in Privacy',true],['Download, correct and erase','Families can do all three from Privacy; erasure waits 48 hours',true],['Data kept in India','Servers in Mumbai; encrypted in transit and at rest',true],['Breach response plan','The steps are on this page; confirm them with your lawyer',false]];
  const todo=L.filter(x=>!x[2]).length,open=dr.rows.filter(r=>r.status!=='done').length;
    lay(kpi([['Open data requests',open,open?'':'none waiting'],['Readiness',`${L.length-todo} of ${L.length}`,todo?todo+' to fix':'all done',todo?'w':'']])+`<div class="tcard"><h3 style="margin:0 0 8px">Readiness checklist</h3>${L.map(([t,x,ok])=>`<div class="ovr"><span class="o${ok?' ok':''}">${ok?'✓':''}</span><span class="g"><b>${t}</b><small>${E(x)}</small></span><span class="pill ${ok?'g':'r'}">${ok?'Done':'To do'}</span></div>`).join('')}</div>`,'',
   side([['Who can see what','Admins see account details only. A health record opens only after the family approves a support request, and closes again by itself.'],['Audit trail','Every search, approval and export is written to Team and audit with the admin’s name.','<button class="btn" data-go="team" style="width:100%;border-radius:999px;margin-top:12px">Open Team and audit</button>']]),true);document.querySelectorAll('.bxs [data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go))},
 videos:async()=>{const m=$('#main'),n=m.querySelectorAll('tbody tr').length;
  lay('','',side([['People act on these in an emergency','Each video comes from an official organisation and is embedded from its own channel. Nothing is re-hosted.','','SAFETY'],['Languages','Videos are listed with their language. Tamil, Telugu and Hindi versions are worth adding before the Chennai launch.']]),true)}};
 for(const k in B){const o=VIEWS[k];if(!o)continue;VIEWS[k]=async(...a)=>{await o(...a);try{await B[k]()}catch(e){console.error(e)}}}})();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Urban Health Admin</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/brand/svg/admin-icon.svg"><meta name="theme-color" content="#1C1E26">
<style>
:root{--bg:#f3f5fa;--card:#fff;--soft:#f6f8fc;--ink:#0f1221;--mute:#6b7285;--line:rgba(15,18,33,.08);--blue:#2f5bff;--teal:#13b5a3;--red:#ef3b4f;--amber:#f59e0b;--green:#16a34a;--r:18px;--sh:0 10px 30px -14px rgba(15,18,33,.25);--font:"Geist",Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b0d14;--card:#141826;--soft:#1a1f30;--ink:#eef1fb;--mute:#8f97ad;--line:rgba(255,255,255,.08);--sh:0 10px 30px -14px rgba(0,0,0,.6)}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
a{color:var(--blue);text-decoration:none}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:0;height:100vh;padding:18px 14px;border-right:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:4px}
.logo svg.thl{display:block;height:28px;width:auto;max-width:100%}.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;padding:4px 8px 16px}.logo i{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--teal));display:grid;place-items:center;color:#fff;font-style:normal}
.logo small{display:block;font-weight:500;color:var(--mute);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
nav button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px;border-radius:12px;color:var(--mute);font-weight:500}
nav button:hover{background:var(--soft);color:var(--ink)}nav button.on{background:color-mix(in srgb,var(--blue) 12%,transparent);color:var(--blue);font-weight:600}
nav .navh{font:600 10.5px var(--mono);letter-spacing:.1em;color:var(--mute);padding:14px 12px 4px}nav button em{margin-left:auto;font-style:normal;font-size:11px;background:var(--red);color:#fff;border-radius:99px;padding:1px 7px}
.who{margin-top:auto;padding:10px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--mute)}.who b{display:block;color:var(--ink);font-size:13px;overflow:hidden;text-overflow:ellipsis}
main{padding:22px 26px 60px;max-width:1500px}
h1{font-size:26px;letter-spacing:-.03em;margin:0 0 2px}.sub{color:var(--mute);margin:0 0 18px}
h3{margin:0 0 10px;font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);border:1px solid var(--line)}
.kpi small{display:block;font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}.kpi b{font-size:28px;letter-spacing:-.03em;line-height:1.1;display:block;margin-top:6px}.kpi span{font-size:12px;color:var(--mute)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.grow{flex:1 1 auto;min-width:0}
input,select,textarea{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:9px 12px;outline:none;min-width:0;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 18%,transparent)}
.row input,.row select{width:auto}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:12px;font-weight:600;background:var(--soft);border:1px solid var(--line);white-space:nowrap}
.btn.p{background:var(--blue);color:#fff;border-color:transparent}.btn.d{color:var(--red)}.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border:0}tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
.tag{display:inline-block;font:600 10.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:99px;background:var(--soft);border:1px solid var(--line);color:var(--mute);margin:0 3px 3px 0}
.tag.ok{color:var(--green);border-color:color-mix(in srgb,var(--green) 40%,transparent)}.tag.warn{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 50%,transparent)}.tag.bad{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent)}.tag.blue{color:var(--blue);border-color:color-mix(in srgb,var(--blue) 40%,transparent)}
.wrap{overflow:auto;border-radius:14px;border:1px solid var(--line)}
.drawer{position:fixed;inset:0;z-index:50;background:rgba(10,12,24,.45);backdrop-filter:blur(4px);display:flex;justify-content:flex-end}.drawer[hidden]{display:none}
.panel{width:min(620px,100%);height:100%;overflow:auto;background:var(--card);padding:22px 24px 40px;box-shadow:-20px 0 60px rgba(0,0,0,.25)}
.panel h2{margin:0 0 14px;font-size:20px;letter-spacing:-.02em}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}.form label{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--mute)}.form label.full{grid-column:1/-1}.form label input,.form label select,.form label textarea{font-weight:400;color:var(--ink)}
.form label.ck{display:flex;align-items:center;gap:8px;grid-column:span 1;padding-top:18px}.form label.ck input{width:auto}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;position:sticky;bottom:0;background:var(--card);padding:10px 0}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .card{width:min(380px,100%);padding:26px}
.login .card{max-width:calc(100vw - 32px);box-sizing:border-box}.tf{min-width:0;animation:tfin .35s cubic-bezier(.2,.8,.2,1) both}@keyframes tfin{from{opacity:0;transform:translateY(8px)}}
.tf h2{font-size:22px;letter-spacing:-.02em;margin:2px 0 6px}.tf p{color:var(--mute);margin:0 0 14px;font-size:14px;line-height:1.45}
.tf .qr{width:184px;height:184px;margin:6px auto 12px;padding:10px;border-radius:22px;background:#fff;box-shadow:0 0 0 1px var(--line),var(--sh);display:grid;place-items:center}.tf .qr svg{width:100%;height:100%}
.tf .key{display:flex;align-items:center;justify-content:space-between;gap:10px;box-sizing:border-box;font-family:var(--mono);font-size:13px;letter-spacing:.08em;background:var(--soft);border-radius:999px;padding:8px 14px;margin:0 auto 14px;width:max-content;max-width:100%;word-break:break-all}
.tf .key button{flex:none;white-space:nowrap;border:0;background:var(--blue);color:#fff;border-radius:999px;font:600 12px var(--font);padding:5px 10px;cursor:pointer}
.otp6{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:4px 0 12px}.otp6 input{height:54px;border-radius:16px;border:1px solid var(--line);background:var(--soft);text-align:center;font:600 22px var(--mono);color:var(--ink);padding:0}
.otp6 input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px color-mix(in srgb,var(--blue) 18%,transparent);background:var(--card)}
.tf .steps{display:flex;gap:6px;justify-content:center;margin:0 0 14px}.tf .steps i{width:22px;height:5px;border-radius:3px;background:var(--line)}.tf .steps i.on{background:var(--blue)}
.tf .key span{min-width:0}.tf .apps{font-size:12.5px;color:var(--mute);text-align:center;margin:-4px 0 12px}
.pu{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}.pu:first-child{border-top:0}
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:12px 4px}.pager button{border-radius:999px}
.role{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--soft)}
.role.owner{background:color-mix(in srgb,var(--blue) 12%,transparent);color:var(--blue)}.role.ops{background:color-mix(in srgb,var(--teal) 14%,transparent);color:#0d8577}.role.content{background:color-mix(in srgb,var(--amber) 16%,transparent);color:#b45309}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;transition:.25s;z-index:99;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%)}
.bars{display:flex;align-items:flex-end;gap:4px;height:90px;margin-top:8px}.bars i{flex:1;background:linear-gradient(180deg,var(--blue),var(--teal));border-radius:4px 4px 0 0;min-height:3px;position:relative}.bars i::after{content:attr(data-l);position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:9px;color:var(--mute);white-space:nowrap;margin-top:3px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.mute{color:var(--mute)}.sm{font-size:12px}.mono{font-family:var(--mono)}
.empty{padding:26px;text-align:center;color:var(--mute)}
.stars button{font-size:18px;color:var(--amber)}
.prices td input{padding:5px 8px;border-radius:8px;width:90px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border-radius:99px;background:var(--soft);border:1px solid var(--line);font-size:12.5px}
@media (max-width:640px){main{padding:12px!important}h1{font-size:24px!important}.tw{grid-template-columns:1fr 1fr!important;gap:8px!important}.tk b{font-size:20px!important}.nr{flex-wrap:wrap}.nr .btn{margin-left:auto}.tbl,table{display:block;overflow-x:auto;white-space:nowrap}.two,.g2,.g3{grid-template-columns:1fr!important}.seg{overflow-x:auto;max-width:100%}aside nav{overflow-x:auto;flex-wrap:nowrap!important}aside nav button{flex:none}}
@media (max-width:860px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}nav{display:flex;flex-wrap:wrap;gap:4px}nav button{width:auto}.who{display:none}main{padding:16px}}

/* ---- onboarding (Labs / Pharmacies / Hospitals) ---- */
.ob-k{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:14px}
.ob-k div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px}.ob-k b{display:block;font-size:24px;letter-spacing:-.02em}.ob-k span{color:var(--mute);font-size:12px}.ob-k .warn b{color:#B25E00}
.ob{display:grid;grid-template-columns:340px minmax(0,1fr);gap:14px;align-items:start}
.ob-l{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;position:sticky;top:12px}
.seg{display:flex;margin:12px;background:var(--soft);border-radius:10px;padding:2px}.seg button{flex:1;padding:6px;border-radius:8px;font-size:12.5px;color:var(--mute)}.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ob-l input{margin:0 12px 8px;width:calc(100% - 24px)}
.ob-r{display:flex;gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:center;width:100%;text-align:left}.ob-r:hover{background:var(--soft)}.ob-r.on{background:color-mix(in srgb,var(--blue) 9%,transparent)}
.av{width:40px;height:40px;border-radius:11px;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;background-size:cover;background-position:center}
.ob-r b{display:block;font-weight:600}.ob-r small{color:var(--mute)}
.pill{margin-left:auto;font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;white-space:nowrap;background:var(--soft);color:var(--mute)}
.pill.b{background:color-mix(in srgb,var(--blue) 12%,transparent);color:var(--blue)}.pill.a{background:#FFF4E0;color:#8A4B00}.pill.g{background:#E8F8EC;color:#1B6E30}.pill.r{background:#FFECEB;color:#B3001B}
.ob-d{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.ob-h{display:flex;gap:14px;align-items:center}.ob-h .av{width:56px;height:56px;font-size:20px;border-radius:14px}.ob-h h2{margin:0;font-size:22px;letter-spacing:-.01em}
.steps{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mute);flex-wrap:wrap}.steps i{font-style:normal;width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;background:var(--soft);margin-right:6px}
.steps .ok i{background:#248A3D;color:#fff}.steps .now{color:var(--ink);font-weight:600}.steps .now i{background:var(--blue);color:#fff}.steps hr{flex:1;min-width:14px;border:0;height:2px;background:var(--line);margin:0}.steps hr.ok{background:#248A3D}
.box{background:var(--soft);border-radius:14px;padding:14px 16px;min-width:0}.box h4{margin:0 0 10px;font-size:13px;color:var(--mute);display:flex;gap:8px}.box h4 a,.box h4 button{margin-left:auto;font-size:13px;font-weight:600;color:var(--blue)}
.g2{display:grid;grid-template-columns:1.15fr 1fr;gap:14px}.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}.kv:last-child{border:0}.kv span{color:var(--mute);flex:none}.kv b{font-weight:600;text-align:right}
.ph{display:grid;grid-template-columns:2fr repeat(5,1fr);gap:10px;height:150px}.ph>*{border-radius:12px;position:relative;overflow:hidden;background:#dde3ea center/cover}.ph label{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.62);color:#fff;font-size:11px;padding:3px 8px;border-radius:99px}
.ph .add{border:2px dashed #C7C7CC;background:none;display:grid;place-items:center;text-align:center;color:var(--mute);font-size:12px;padding:6px}.ph .add.need{border-color:#E08600;color:#8A4B00}
.ph .x{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:13px;line-height:22px}
.map{height:170px;border-radius:12px;overflow:hidden;position:relative;background:#E8EEF3}.map iframe{border:0;width:100%;height:100%}
.chk{display:flex;gap:9px;align-items:flex-start;padding:5px 0}.chk i{width:12px;height:12px;border-radius:50%;flex:none;margin-top:4px;background:#248A3D}.chk i.n{background:#E08600}
.ob-f{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.ob-f .mute{margin-right:auto}
.who .mob{display:block;margin-top:4px}
@media (max-width:1100px){.ob{grid-template-columns:1fr}.ob-l{position:static}.ob-k{grid-template-columns:repeat(2,1fr)}.g2,.g3{grid-template-columns:1fr}.ph{grid-template-columns:repeat(3,1fr);height:auto}.ph>*{height:110px}}

nav button svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;flex:none}

nav button.subn{padding:5px 12px 5px 39px;font-size:13px;font-weight:500;border-radius:8px}nav button.subn.on2{color:#0071E3;font-weight:600;background:none}
.kbar{display:flex;align-items:center;gap:8px;margin:0 0 10px;background:var(--soft);border-radius:10px;padding:8px 12px;color:var(--mute);font-size:13px;width:100%}.kbar b{margin-left:auto;font:600 11px var(--mono);background:var(--card);border-radius:5px;padding:1px 6px}
.tw{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:14px}.tk{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}.tk span{color:var(--mute);font-size:12.5px}.tk b{display:block;font-size:26px;letter-spacing:-.02em;margin:2px 0}.tk i{font-style:normal;font-size:12px;font-weight:600}.up{color:#1B6E30}.dn{color:#B3001B}
.tgl{width:51px;height:31px;border-radius:16px;border:0;background:#E5E5EA;position:relative;flex:none;cursor:pointer;transition:background .25s}.tgl:after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:14px;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .25s}.tgl.on{background:#30D158}.tgl.on:after{transform:translateX(20px)}
.dltf{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}.dltf label{display:block;font-size:12.5px;color:var(--mute,#6E6E73);font-weight:600}.dltf input{display:block;width:100%;height:40px;margin-top:4px;border-radius:12px;border:1px solid var(--line);background:var(--bg,#F5F5F7);padding:0 12px;font:inherit;font-size:14px;box-sizing:border-box}.dltf .btn{grid-column:1/-1;justify-self:start}
.tg{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;align-items:start}.tcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px}.tcard h3{font-size:13px;color:var(--mute);font-weight:600;margin:0 0 8px;display:flex}.tcard h3 a{margin-left:auto;cursor:pointer}
.nr{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}.nr:first-of-type{border:0}.nic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;font-weight:700}
.nic.urgent{background:#FFECEB;color:#B3001B}.nic.warn{background:#FFF4E0;color:#8A4B00}.nic.ok{background:#E8F8EE;color:#1A7F37}.nic.info{background:#EAF3FF;color:#0059B3}.nr b{display:block;font-weight:600}.nr small{color:var(--mute)}
.lanes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 380px;gap:12px;align-items:start}.lane{background:var(--soft);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:calc(100vh - 150px)}@media (max-width:860px){.lane{min-height:160px}}.lane h4{margin:2px 4px;font-size:12.5px;display:flex}.lane h4 span{margin-left:auto;color:var(--mute)}
.oc{background:var(--card);border-radius:12px;padding:10px 12px;cursor:pointer;border:1.5px solid transparent;text-align:left;width:100%}.oc.late{border-color:#FF3B30}.oc.sel{border-color:#0071E3}.oc .f{display:flex;gap:6px;align-items:center}.oc .f b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.oc .f .pill,.oc .f .sm{white-space:nowrap;flex:none;font-size:10.5px}.seg button{white-space:nowrap}
.od{position:sticky;top:12px}
.km{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:80;display:flex;justify-content:center;padding-top:12vh}.km>div{width:min(620px,94vw);background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35);align-self:flex-start}
.km input{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:16px 18px;font-size:17px;background:none}.km input:focus{box-shadow:none}.kg{padding:8px 18px 2px;font:600 11px var(--mono);color:var(--mute)}.ki{display:flex;gap:10px;padding:10px 18px;cursor:pointer;width:100%;text-align:left}.ki:hover,.ki.on{background:var(--soft)}.ki small{color:var(--mute);display:block}
@media (max-width:1100px){.tw{grid-template-columns:repeat(2,1fr)}.tg{grid-template-columns:1fr}.lanes{grid-template-columns:1fr}.od{position:static}}

/* ================= Urban Health admin · Apple-style shell (Nov 2026 design) ================= */
@font-face{font-family:Geist;src:url(/a/geist.19f9c925.woff2) format('woff2');font-weight:100 900;font-display:swap}
:root{--bg:#F5F5F7;--card:#fff;--soft:#F2F2F5;--ink:#1D1D1F;--mute:#6E6E73;--line:rgba(0,0,0,.07);--blue:#0071E3;--green:#1A7F37;--amber:#9A5B00;--red:#C4291C;--ai:#5E5CE6;--r:22px;--sh:0 1px 2px rgba(0,0,0,.04);--font:Geist,Inter,-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#000;--card:#1C1C1E;--soft:#2C2C2E;--ink:#F5F5F7;--mute:#98989D;--line:rgba(255,255,255,.09);--blue:#0A84FF;--sh:none}}
html,body{background:var(--bg)}
.app{grid-template-columns:92px minmax(0,1fr)}
aside{width:92px;padding:18px 10px;gap:6px;align-items:stretch;background:color-mix(in srgb,var(--card) 72%,transparent);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-right:1px solid var(--line)}
aside .logo{padding:0 0 14px;justify-content:center}aside .logo svg.thl{height:40px;width:40px}
aside nav{display:flex;flex-direction:column;gap:6px}
aside nav button{flex-direction:column;justify-content:center;gap:4px;padding:10px 0;min-height:56px;border-radius:16px;font-size:11.5px;font-weight:600;color:var(--mute);position:relative;text-align:center}
aside nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
aside nav button:hover{background:rgba(0,0,0,.04);color:var(--ink)}
.app aside nav button.on,.app aside nav button.on:hover{background:var(--card);color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.1)}
aside nav button em{position:absolute;top:4px;right:10px;margin:0;font-size:10.5px;min-width:18px;text-align:center}
.me{margin:auto auto 0;width:40px;height:40px;border-radius:50%;background:#E8E8ED;font-weight:600;color:var(--ink)}
.memenu{position:fixed;left:100px;bottom:16px;z-index:70;width:280px;max-height:calc(100vh - 32px);overflow:auto;background:var(--card);border-radius:20px;box-shadow:0 18px 50px rgba(0,0,0,.18);padding:8px}
.memenu .mehd{padding:10px 12px 8px}.memenu .mehd b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis}.memenu .mehd span{font-size:12px;color:var(--mute)}
.memenu .megh{font-size:12px;font-weight:600;color:var(--mute);padding:10px 12px 4px}
.memenu button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:12px;font-size:14px;min-height:40px}.memenu button:hover,.memenu button.on{background:var(--soft)}.memenu button.d{color:var(--red)}
main{padding:28px 36px 120px;max-width:1600px;width:100%}
.ptabs{display:inline-flex;flex-wrap:wrap;gap:2px;background:#E8E8ED;border-radius:999px;padding:3px;margin:0 0 20px}
.ptabs button{min-height:34px;padding:0 15px;border-radius:999px;font-size:13px;font-weight:600;color:var(--mute);white-space:nowrap}
.ptabs button[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ptabs button em{font-style:normal;font-size:11px;background:var(--red);color:#fff;border-radius:99px;padding:1px 6px;margin-left:3px}
@media (prefers-color-scheme:dark){.ptabs{background:#2C2C2E}.me{background:#2C2C2E}}
h1{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1.08}
.sub{font-size:14px}
.card,.tcard,.tk{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:0}
.btn{border-radius:999px;border:0;background:var(--soft);min-height:38px;padding:0 16px;font-weight:600}
.btn.p{background:var(--blue);color:#fff}.btn.sm{min-height:32px;padding:0 12px;border-radius:999px}
.tag{font:600 12px var(--font);letter-spacing:0;text-transform:none;padding:3px 10px;border:0;background:var(--soft)}
.tag.ok{background:#E9F6EC;color:var(--green)}.tag.warn{background:#FFF4E0;color:var(--amber)}.tag.bad{background:#FDECEA;color:var(--red)}.tag.blue{background:#EEF4FF;color:#0058B0}
.pill{font-size:12px;padding:3px 10px}
th{font:600 12px var(--font);letter-spacing:0;text-transform:none}
.wrap{border:0;border-radius:var(--r);background:var(--card);box-shadow:var(--sh)}
input,select,textarea{border-radius:14px;border:1px solid var(--line);background:var(--card)}
.seg{background:#E8E8ED;border-radius:999px;padding:3px;margin:0}.seg button{border-radius:999px;min-height:32px;padding:0 14px;font-weight:600;color:var(--mute)}.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* side panel: opens beside the page, never covers it in black */
.drawer{background:rgba(0,0,0,.08);backdrop-filter:none}
.panel{width:min(460px,100%);border-radius:28px 0 0 28px;box-shadow:-10px 0 40px rgba(0,0,0,.12);padding:26px 26px 40px}
.panel h2{font-size:24px;font-weight:700;letter-spacing:-.02em}
/* Ask */
.askbar{position:fixed;left:calc(50% + 46px);bottom:22px;transform:translateX(-50%);z-index:60;width:min(640px,calc(100% - 140px));display:flex;align-items:center;gap:10px;padding:7px 7px 7px 18px;border-radius:999px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:0 10px 30px rgba(0,0,0,.14)}
.askbar span{color:var(--ai);font-size:18px}.askbar input{flex:1;border:0;background:none;padding:8px 0;font-size:15px;box-shadow:none}.askbar input:focus{box-shadow:none}
.askbar kbd{font:500 12px var(--mono);color:var(--mute)}.askbar .btn.p{background:var(--ai);min-height:38px}
/* Home (design) */
.tcard h3{color:var(--ink)}.kpi small{font:600 13px var(--font);letter-spacing:0;text-transform:none}.kpi b{font-size:30px}.tcard h3 a{font-size:13px;font-weight:600;letter-spacing:0}
.brief{display:flex;flex-wrap:wrap;align-items:center;gap:18px;padding:20px 22px;margin-bottom:16px}
.brief .bi{width:44px;height:44px;border-radius:14px;background:#EFEFFD;color:var(--ai);display:grid;place-items:center;font-size:20px;flex:none}
.brief b{display:block;font-size:17px}.brief small{display:block;font-size:14px;color:var(--mute);margin-top:2px}
.brief .btn{background:var(--ink);color:var(--card)}
.tw{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
.tk{padding:18px 20px}.tk span{font-size:13px;font-weight:600;color:var(--mute)}.tk b{font-size:34px;letter-spacing:-.03em}
.nfilt{display:inline-flex;gap:2px;background:#E8E8ED;border-radius:999px;padding:3px}.nfilt button{min-height:30px;padding:0 13px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--mute)}.nfilt button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
@media (max-width:860px){
 .app{grid-template-columns:1fr}
 aside{position:fixed;top:auto;bottom:0;left:0;right:0;width:auto;height:auto;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:65;border-right:0;border-top:1px solid var(--line)}
 aside .logo{display:none}aside nav{flex-direction:row;flex:1;justify-content:space-around}aside nav button{flex:1;min-height:52px}
 .me{margin:auto 4px}.memenu{left:auto;right:8px;bottom:76px}
 main{padding:18px 16px 170px}h1{font-size:30px}
 .ptabs{display:flex;flex-wrap:nowrap;overflow-x:auto;max-width:100%;scrollbar-width:none}
 .askbar{left:50%;bottom:84px;width:calc(100% - 24px)}.askbar kbd{display:none}
 .panel{border-radius:24px 24px 0 0;height:auto;max-height:88vh;margin-top:auto}.drawer{align-items:flex-end}
}

/* The authenticator step. One code box that reads like six (paste works, autofill from the phone's

function otpBoxes(){return`<div class="otp6" role="group" aria-label="6-digit code">${[0,1,2,3,4,5].map(i=>`<input inputmode="numeric" maxlength="1" ${i?'':'autocomplete="one-time-code"'} aria-label="Digit ${i+1}">`).join('')}</div>`}
function otpWire(root,done){const bx=[...root.querySelectorAll('.otp6 input')];const val=()=>bx.map(b=>b.value).join('');
 bx.forEach((b,i)=>{b.oninput=()=>{const d=b.value.replace(/\D/g,'');if(d.length>1){d.slice(0,6).split('').forEach((c,j)=>{if(bx[j])bx[j].value=c});bx[Math.min(5,d.length-1)].focus()}else{b.value=d;if(d&&bx[i+1])bx[i+1].focus()}if(val().length===6)done(val())};
  b.onkeydown=e=>{if(e.key==='Backspace'&&!b.value&&bx[i-1]){bx[i-1].focus();bx[i-1].value=''}}});bx[0].focus();return{clear(){bx.forEach(b=>b.value='');bx[0].focus()}}}
function totpStep(cred,d){const c=$('.login .card');const enrol=!!d.enrolTotp;
 c.innerHTML=`<div class="tf">${enrol?`<div class="steps"><i class="on"></i><i class="on"></i></div><h2>Protect your admin account</h2><p>Scan this with an authenticator app. From now on, each sign-in asks for the 6-digit code it shows.</p>
  <div class="qr">${d.qr||''}</div><div class="apps">Google Authenticator · Microsoft Authenticator · 1Password · Apple Passwords</div>
  <div class="key"><span>${E((d.secret||'').replace(/(.{4})/g,'$1 ').trim())}</span><button type="button" id="cpk">Copy</button></div><p style="margin-bottom:6px">Then enter the code it shows:</p>`
  :`<h2>Enter your code</h2><p>Open your authenticator app and type the 6-digit code for Urban Health.</p>`}
  ${otpBoxes()}<div class="err" id="terr" style="min-height:18px"></div><button class="btn ghost" type="button" id="tback" style="width:100%;margin-top:6px">Use a different account</button></div>`;

 $('#main').insertAdjacentHTML('beforeend',`<div class="row"><span class="chip">Payments: <b>${d.provider==='razorpay'?'Razorpay live':'demo mode (set RAZORPAY_KEY_ID + RAZORPAY_KEY_SECRET)'}</b></span></div>
 <div class="cards">${d.plans.map(p=>`<div class="card"><div class="row" style="justify-content:space-between;margin:0 0 6px"><h3 style="margin:0">${E(p.name)} <span class="mono mute sm">${p.code}</span></h3>${p.active?'<span class="tag ok">Live</span>':'<span class="tag">Hidden</span>'}</div><b style="font-size:24px">${money(p.price_month)}</b><span class="mute">/month</span> · ${money(p.price_year)}/year · up to ${p.members} members<ul class="sm" style="padding-left:18px;margin:8px 0">${(p.features||[]).map(f=>`<li>${E(f)}</li>`).join('')}</ul><button class="btn sm" data-ep="${p.code}">Edit plan</button></div>`).join('')}<div class="card" style="display:grid;place-items:center"><button class="btn" id="np">＋ New plan</button></div></div>
 <div class="card"><h3>Subscriptions & invoices</h3><div class="wrap"><table><thead><tr><th>Invoice</th><th>Household</th><th>Plan</th><th>Amount</th><th>Provider</th><th>Status</th><th>Started</th><th>Renews</th></tr></thead><tbody>${d.subscriptions.map(s=>`<tr><td class="mono">${E(s.invoice||'—')}</td><td>${E(s.household)}</td><td>${E(s.plan)} · ${E(s.period)}</td><td>${money(s.amount)}</td><td>${E(s.provider)} <span class="mono mute sm">${E(s.ref)}</span></td><td><span class="tag ${s.status==='active'?'ok':''}">${E(s.status)}</span></td><td class="sm">${when(s.started)}</td><td class="sm">${day(s.renews)}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">No subscriptions yet</td></tr>'}</tbody></table></div></div>`);
 const edit=p=>{const d2=drawer(`<h2>${p?'Edit plan':'New plan'}</h2><form id="pf2" class="form"><label>Code<input name="code" value="${E(p?p.code:'')}" ${p?'readonly':''} required pattern="[a-z0-9_-]{2,24}"></label><label>Name<input name="name" value="${E(p?p.name:'')}" required></label><label>Price / month ₹<input name="price_month" type="number" value="${p?p.price_month:0}"></label><label>Price / year ₹<input name="price_year" type="number" value="${p?p.price_year:0}"></label><label>Members<input name="members" type="number" value="${p?p.members:5}"></label><label>Sort<input name="sort" type="number" value="${p?p.sort:9}"></label><label class="full">Features (one per line)<textarea name="features" rows="6">${E((p?p.features:[]).join('\n'))}</textarea></label><label class="ck"><input type="checkbox" name="active" ${!p||p.active?'checked':''}> Live in the app</label><div class="foot" style="grid-column:1/-1"><button type="button" class="btn" id="cx">Cancel</button><button class="btn p">Save</button></div></form>`);
  $('#cx').onclick=()=>d2.hidden=true;$('#pf2').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await api('/plans/'+f.get('code'),{method:'PUT',body:{name:f.get('name'),price_month:+f.get('price_month'),price_year:+f.get('price_year'),members:+f.get('members'),sort:+f.get('sort'),features:f.get('features').split('\n').map(x=>x.trim()).filter(Boolean),active:f.get('active')==='on'}});d2.hidden=true;toast('Plan saved');VIEWS.billing()}};
 $('#main').querySelectorAll('[data-ep]').forEach(b=>b.onclick=()=>edit(d.plans.find(p=>p.code===b.dataset.ep)));$('#np').onclick=()=>edit(null)};
// ---------------------------------------------------------------- seasonal
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
// ---- UPI payments: match the UTR against the bank statement, then confirm
const PAYF={status:'claimed'};
VIEWS.payments=async()=>{main(head('UPI payments','Plan upgrades and orders paid by scanning our QR. Match the UTR and amount against the bank statement, then Confirm: the plan switches (or the order is marked paid) and the family is told.',`<select id="pst"><option value="claimed">Awaiting confirmation</option><option value="pending">Pending (not yet claimed)</option><option value="confirmed">Confirmed</option><option value="rejected">Rejected</option><option value="all">All</option></select>`));
 $('#pst').value=PAYF.status;$('#pst').onchange=e=>{PAYF.status=e.target.value;VIEWS.payments()};const d=await api('/payments?status='+PAYF.status);
 $('#main').insertAdjacentHTML('beforeend',`<div class="row"><span class="tag">pending ${d.counts.pending}</span><span class="tag warn">claimed ${d.counts.claimed}</span><span class="tag ok">confirmed ${d.counts.confirmed}</span><span class="tag bad">rejected ${d.counts.rejected}</span></div>
  <div class="card">${d.payments.length?`<table><tr><th>When</th><th>Family</th><th>For</th><th>Amount</th><th>Account</th><th>Reference</th><th>UTR</th><th>Status</th><th></th></tr>${d.payments.map(p=>`<tr><td>${new Date(p.created*1000).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</td><td>${E(p.family||p.household)}<br><span class="mute sm">now ${E(p.plan)}</span></td><td>${p.kind==='plan'?'Plan · '+E(p.ref.replace(':',' / ')):'Order '+E(p.ref)}</td><td><b>₹${p.amount}</b></td><td>${p.account?E(p.account.bank)+' ·'+E(p.account.last4):''}</td><td><code>${E(p.note)}</code></td><td>${p.utr?`<code>${E(p.utr)}</code><br><span class="mute sm">${E(p.payer||'')}</span>`:'—'}</td><td><span class="tag ${p.status==='confirmed'?'ok':p.status==='claimed'?'warn':p.status==='rejected'?'bad':''}">${p.status}</span>${p.adminNote?`<br><span class="mute sm">${E(p.adminNote)}</span>`:''}</td><td>${['claimed','pending'].includes(p.status)?`<button class="btn sm p" data-pc="${p.id}">Confirm</button> <button class="btn sm d" data-pr="${p.id}">Reject</button>`:''}</td></tr>`).join('')}</table>`:'<p class="mute">Nothing here.</p>'}</div>`);
 $('#main').querySelectorAll('[data-pc]').forEach(b=>b.onclick=async()=>{const note=prompt('Matched in which statement? (optional note)')??null;if(note===null)return;await api(`/payments/${b.dataset.pc}/confirm`,{method:'POST',body:{note}});toast('Confirmed · family notified');VIEWS.payments()});
 $('#main').querySelectorAll('[data-pr]').forEach(b=>b.onclick=async()=>{const note=prompt('Reason the family will see:');if(note===null)return;await api(`/payments/${b.dataset.pr}/reject`,{method:'POST',body:{note}});toast('Rejected');VIEWS.payments()})};
// ---- partner applications
const APF={status:'new'};
VIEWS.applications=async()=>{main(head('Partner applications','Labs, pharmacies and hospitals that applied from the partner portal. Check the licence on the regulator’s register, set the location, approve (creates the store and the owner sign-in) or decline.',`<select id="apst"><option value="new">New</option><option value="approved">Approved</option><option value="declined">Declined</option><option value="all">All</option></select>`));
 $('#apst').value=APF.status;$('#apst').onchange=e=>{APF.status=e.target.value;VIEWS.applications()};const d=await api('/applications?status='+APF.status);
 $('#main').insertAdjacentHTML('beforeend',d.applications.length?d.applications.map(a=>`<div class="card"><div class="row" style="justify-content:space-between"><div><b>${E(a.name)}</b> <span class="tag">${E(a.kind)}</span> <span class="tag ${a.status==='new'?'warn':a.status==='approved'?'ok':'bad'}">${a.status}</span><div class="mute sm">${E([a.address,a.area,a.city,a.pin].filter(Boolean).join(', '))} · ${E(a.contact||'')} · <a href="tel:${E(a.phone)}">${E(a.phone)}</a> · ${E(a.email)}</div><div class="sm">Licence <b>${E(a.licence)}</b>${a.gstin?' · GSTIN '+E(a.gstin):''}${a.services?' · '+E(a.services):''}</div>${a.note?`<div class="sm mute">${E(a.note)}</div>`:''}<div class="mute sm">Applied ${new Date(a.created*1000).toLocaleString('en-IN')}${a.decidedBy?' · '+a.status+' by '+E(a.decidedBy):''}${a.storeId?' · store '+E(a.storeId):''}</div></div>
  ${a.status==='new'?`<div class="row" style="margin:0"><input data-lat="${a.id}" placeholder="Lat" value="${a.lat??''}" style="width:90px"><input data-lng="${a.id}" placeholder="Lng" value="${a.lng??''}" style="width:90px"><label class="sm"><input type="checkbox" data-verified="${a.id}" style="width:auto"> Licence checked</label><button class="btn sm p" data-ok="${a.id}">Approve</button><button class="btn sm d" data-no="${a.id}">Decline</button></div>`:''}</div></div>`).join(''):'<div class="card mute">No applications.</div>');
 $('#main').querySelectorAll('[data-ok]').forEach(b=>b.onclick=async()=>{const id=b.dataset.ok,lat=parseFloat($(`[data-lat="${id}"]`).value),lng=parseFloat($(`[data-lng="${id}"]`).value);try{if(!isNaN(lat)&&!isNaN(lng))await api(`/applications/${id}/location`,{method:'POST',body:{lat,lng}});const r=await api(`/applications/${id}/approve`,{method:'POST',body:{verified:$(`[data-verified="${id}"]`).checked}});prompt(`Store created. Send this one-time password to ${r.email} (shown once):`,r.tempPassword);VIEWS.applications()}catch(e){toast(e.message)}});
 $('#main').querySelectorAll('[data-no]').forEach(b=>b.onclick=async()=>{const note=prompt('Reason (kept on the application):');if(note===null)return;await api(`/applications/${b.dataset.no}/decline`,{method:'POST',body:{note}});VIEWS.applications()})};
// ---- settlements
const inr=n=>'₹'+Math.round(+n||0).toLocaleString('en-IN');
VIEWS.settlements=async()=>{const month=DATA.setMonth||new Date().toISOString().slice(0,7);main(head('Settlements','What each partner is owed for the month: orders delivered or reports ready, less the platform fee. Online money is paid out to the partner; the fee on cash orders is collected from them.',`<input type="month" id="sm" value="${month}"><a class="btn" href="/api/admin/settlements.csv?month=${month}" target="_blank">CSV</a>`));
 $('#sm').onchange=e=>{DATA.setMonth=e.target.value;VIEWS.settlements()};const d=await api('/settlements?month='+month);
 $('#main').insertAdjacentHTML('beforeend',`<div class="cards"><div class="card kpi"><small>Orders</small><b>${d.totals.orders}</b></div><div class="card kpi"><small>Gross</small><b>₹${d.totals.gross.toLocaleString('en-IN')}</b></div><div class="card kpi"><small>Platform fee (${d.feePct}%)</small><b>₹${d.totals.fee.toLocaleString('en-IN')}</b></div><div class="card kpi"><small>Pay out to partners</small><b>₹${d.totals.payable.toLocaleString('en-IN')}</b></div><div class="card kpi"><small>Collect from partners</small><b>₹${d.totals.dueFromPartners.toLocaleString('en-IN')}</b></div></div>
  <div class="card">${d.rows.length?`<table><tr><th>Partner</th><th>Orders</th><th>Gross</th><th>Cash</th><th>Online</th><th>Refunds</th><th>Fee</th><th>Pay out</th><th>Collect</th><th>Net</th><th>Settled</th></tr>${d.rows.map(r=>`<tr><td><b>${E(r.store)}</b><br><span class="mute sm">${E(r.kind)} · ${E(r.city)} · <button class="btn sm" style="padding:1px 6px;font-size:11px" data-rate="${E(r.storeId)}:${r.feePct}">${r.feePct}%</button></span></td><td>${r.orders}</td><td>${inr(r.gross)}</td><td>${inr(r.cod)}</td><td>${inr(r.online)}</td><td>${inr(r.refunds)}</td><td>${inr(r.fee)}</td><td>${inr(r.payableToPartner)}</td><td>${inr(r.dueFromPartner)}</td><td><b>${r.net<0?'-':''}${inr(Math.abs(r.net))}</b></td>
   <td>${r.settled?`<span class="tag ok">${inr(Math.abs(r.settledNet))} ${new Date(r.settledAt*1000).toLocaleDateString('en-IN')}</span>${r.settledRef?`<br><span class="mute sm">${E(r.settledRef)}</span>`:''}<br><button class="btn sm" style="padding:1px 6px;font-size:11px" data-unsettle="${E(r.storeId)}">undo</button>`:`<button class="btn sm p" data-settle="${E(r.storeId)}:${E(r.store)}:${r.net}">Mark settled</button>`}</td></tr>`).join('')}</table>`:'<p class="mute">No settled orders this month.</p>'}</div><p class="sm mute">The figures are recomputed from the orders every time you open this. “Settled” is the part that is not: it records what was actually transferred, when and against which reference. Default fee: PARTNER_FEE_PCT (${d.feePct}%); click a partner’s percentage to give them their own.</p>`);
 // ---- marking a month settled
 // The row is frozen at the moment of settling, so a refund or a rate change next week cannot quietly rewrite
 // what was paid. A bank reference is asked for because a payout nobody can trace gets made twice.
 $('#main').querySelectorAll('[data-settle]').forEach(b=>b.onclick=()=>{const[sid,name,net]=b.dataset.settle.split(':');
  const way=+net>=0?`Pay <b>₹${Math.abs(+net).toLocaleString('en-IN')}</b> to`:`Collect <b>₹${Math.abs(+net).toLocaleString('en-IN')}</b> from`;
  const dr=drawer(`<h2>Settle ${E(month)}</h2><p class="mute">${way} <b>${E(name)}</b>. Record it here once the transfer has actually been made.</p>
   <form id="stf" class="form"><label class="full">Bank reference <small class="mute">UTR, NEFT or UPI reference</small><input name="ref" maxlength="60" placeholder="e.g. UTR 234512789001"></label>
   <label class="full">Note <small class="mute">optional</small><input name="note" maxlength="300"></label>
   <label class="ck full"><input type="checkbox" name="wo"> Written off instead of paid</label>
   <div class="foot full" style="grid-column:1/-1"><span class="grow"></span><button class="btn" type="button" id="stx">Cancel</button><button class="btn p">Record it</button></div></form>`);
  $('#stx').onclick=()=>{dr.hidden=true};
  $('#stf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);
   try{await api(`/settlements/${month}/${sid}`,{method:'POST',body:{ref:f.get('ref')||'',note:f.get('note')||'',status:f.get('wo')?'written_off':'paid'}});dr.hidden=true;VIEWS.settlements()}
   catch(err){toast(err.message)}}});
 $('#main').querySelectorAll('[data-unsettle]').forEach(b=>b.onclick=async()=>{if(!confirm('Undo this settlement? Only do this if it was recorded in error — the usual way to double-pay a partner is to unmark a payout.'))return;
  try{await api(`/settlements/${month}/${b.dataset.unsettle}`,{method:'DELETE'});VIEWS.settlements()}catch(e){toast(e.message)}});
 $('#main').querySelectorAll('[data-rate]').forEach(b=>b.onclick=async()=>{const[sid,cur]=b.dataset.rate.split(':');
  const v=prompt(`Commission for this partner, in percent. Blank puts them back on the platform default (${d.feePct}%).`,cur);
  if(v===null)return;try{await api(`/stores/${sid}/commission`,{method:'POST',body:{pct:v.trim()===''?null:parseFloat(v)}});VIEWS.settlements()}catch(e){toast(e.message)}})};
// ---- shop: packages and merchandise sold under our own store
VIEWS.shop=async()=>{main(head('Shop','Packages and merchandise Urban Health sells and ships itself (the hospital-bag package first). Orders arrive under Orders with kind “shop”; advance them there as you pack and ship.',`<button class="btn p" id="np">New product</button>`));const d=await api('/products');
 $('#main').insertAdjacentHTML('beforeend',`<div class="card">${d.products.length?`<table><tr><th>Product</th><th>Price</th><th>Stock</th><th>Sizes</th><th>Includes</th><th>Status</th><th></th></tr>${d.products.map(p=>`<tr><td><b>${E(p.name)}</b><br><span class="mute sm">${E(p.sku)} · ${E(p.tagline)}</span></td><td>₹${p.price}${p.mrp>p.price?` <s class="mute">₹${p.mrp}</s>`:''}</td><td>${p.stock}</td><td>${(p.sizes||[]).join(' ')}</td><td>${(p.includes||[]).length} items</td><td><span class="tag ${p.active?'ok':'bad'}">${p.active?'live':'hidden'}</span>${p.image?' <span class="tag">photo</span>':''}</td><td><button class="btn sm" data-pe="${E(p.sku)}">Edit</button></td></tr>`).join('')}</table>`:'<p class="mute">No products yet.</p>'}</div>`);
 const form=p=>{const inc=(p&&p.includes||[]).map(i=>`${i.group||''} | ${i.name} | ${i.qty||1}${i.unit?' | '+i.unit:''}`).join('\n');const d2=drawer(`<h2>${p?'Edit product':'New product'}</h2><form id="spf" class="form">
  <label>SKU<input name="sku" value="${E(p?p.sku:'')}" ${p?'readonly':''} required placeholder="bag-complete"></label><label>Name<input name="name" value="${E(p?p.name:'')}" required></label>
  <label class="full">Tagline<input name="tagline" value="${E(p?p.tagline:'')}" maxlength="160"></label><label class="full">Description<textarea name="description" rows="4">${E(p?p.description:'')}</textarea></label>
  <label>Price ₹<input name="price" type="number" min="0" value="${p?p.price:''}" required></label><label>MRP ₹<input name="mrp" type="number" min="0" value="${p?p.mrp:''}"></label><label>Stock<input name="stock" type="number" min="0" value="${p?p.stock:0}"></label><label>Ships in<input name="shipsIn" value="${E(p?p.shipsIn:'3–5 days')}"></label>
  <label>Sizes <small class="mute">(comma separated, blank if none)</small><input name="sizes" value="${E(p?(p.sizes||[]).join(', '):'')}"></label><label>Size note<input name="sizeNote" value="${E(p?p.sizeNote:'')}"></label><label>Badge<input name="badge" value="${E(p?p.badge:'')}" placeholder="Birth plan"></label><label>Sort<input name="sort" type="number" value="${p?p.sort||0:0}"></label>
  <label class="full">What's inside <small class="mute">one per line: group | item | qty | unit</small><textarea name="includes" rows="8">${E(inc)}</textarea></label>
  <label><input type="checkbox" name="active" ${!p||p.active?'checked':''}> Live in the app</label>
  <div class="foot full" style="grid-column:1/-1"><span class="grow"></span><button type="button" class="btn" id="cx">Cancel</button><button class="btn p">Save</button></div></form>
  ${p?`<h3 style="margin-top:16px">Photo</h3>${p.image?`<img src="${p.image}?v=${p.updated}" style="max-width:240px;border-radius:12px;display:block;margin-bottom:8px">`:''}<input type="file" id="spimg" accept="image/*"> <button class="btn sm" id="spup" type="button">Upload</button><p class="sm mute">JPEG/PNG up to 4 MB; shown on the birth card and in checkout.</p>`:''}`);
  $('#cx').onclick=()=>d2.hidden=true;$('#spf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const includes=f.get('includes').split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(a=>a[1]||a[0]).map(a=>a.length===1?{group:'',name:a[0],qty:1}:{group:a[0],name:a[1],qty:+(a[2]||1)||1,unit:a[3]||''});
   try{await api('/products/'+encodeURIComponent(f.get('sku').trim().toLowerCase()),{method:'PUT',body:{sku:f.get('sku'),name:f.get('name'),tagline:f.get('tagline'),description:f.get('description'),price:+f.get('price'),mrp:+(f.get('mrp')||0),stock:+(f.get('stock')||0),shipsIn:f.get('shipsIn'),sizes:f.get('sizes').split(',').map(x=>x.trim()).filter(Boolean),sizeNote:f.get('sizeNote'),badge:f.get('badge'),sort:+(f.get('sort')||0),includes,active:!!f.get('active')}});d2.hidden=true;toast('Saved');VIEWS.shop()}catch(err){toast(err.message)}};
  if(p&&$('#spup'))$('#spup').onclick=async()=>{const fl=$('#spimg').files[0];if(!fl)return;const fd=new FormData();fd.append('file',fl);const r=await fetch('/api/admin/products/'+encodeURIComponent(p.sku)+'/image',{method:'PUT',body:fd,credentials:'same-origin'});if(!r.ok){toast((await r.json()).detail||'Upload failed');return}toast('Photo saved');d2.hidden=true;VIEWS.shop()}};
 $('#np').onclick=()=>form(null);$('#main').querySelectorAll('[data-pe]').forEach(b=>b.onclick=()=>form(d.products.find(x=>x.sku===b.dataset.pe)))};
VIEWS.seasonal=async()=>{main(head('Seasonal advisories','Shown on Home for the current month and region. Keep them short, factual and sourced (NCDC, IDSP, WHO).',`<button class="btn p" id="ns">＋ New advisory</button>`));const d=await api('/seasonal');const m=new Date().getMonth()+1;
 $('#main').insertAdjacentHTML('beforeend',`<div class="wrap card" style="padding:0"><table><thead><tr><th>Disease</th><th>Months</th><th>Risk</th><th>Region</th><th>Summary</th><th>Status</th></tr></thead><tbody>${d.items.map(x=>`<tr class="click" data-id="${x.id}"><td><b>${x.emoji} ${E(x.disease)}</b></td><td class="sm">${(x.months||[]).map(k=>`<span class="tag ${k===m?'blue':''}">${MONTHS[k-1]}</span>`).join('')}</td><td><span class="tag ${x.risk==='high'?'bad':x.risk==='medium'?'warn':''}">${x.risk}</span></td><td>${E(x.region)}</td><td class="sm mute">${E(x.summary)}</td><td>${x.active?'<span class="tag ok">Live</span>':'<span class="tag">Hidden</span>'}</td></tr>`).join('')}</tbody></table></div>`);
 const edit=x=>{const v=x||{region:'IN',months:[m],risk:'medium',emoji:'🦟',symptoms:[],prevention:[],active:true};const d2=drawer(`<h2>${x?'Edit advisory':'New advisory'}</h2><form id="szf" class="form"><label>Disease<input name="disease" value="${E(v.disease||'')}" required></label><label>Emoji<input name="emoji" value="${E(v.emoji)}"></label><label>Risk<select name="risk">${['low','medium','high'].map(r=>`<option ${v.risk===r?'selected':''}>${r}</option>`).join('')}</select></label><label>Region (IN or state code)<input name="region" value="${E(v.region)}"></label><label class="full">Months<div class="row" style="margin:0">${MONTHS.map((n,i)=>`<label class="chip"><input type="checkbox" name="m${i+1}" ${(v.months||[]).includes(i+1)?'checked':''} style="width:auto"> ${n}</label>`).join('')}</div></label><label class="full">Summary<textarea name="summary" rows="2">${E(v.summary||'')}</textarea></label><label class="full">Symptoms (one per line)<textarea name="symptoms" rows="4">${E((v.symptoms||[]).join('\n'))}</textarea></label><label class="full">Prevention (one per line)<textarea name="prevention" rows="4">${E((v.prevention||[]).join('\n'))}</textarea></label><label class="full">When to see a doctor<textarea name="see_doctor" rows="2">${E(v.see_doctor||'')}</textarea></label><label>Source<input name="source" value="${E(v.source||'')}"></label><label class="ck"><input type="checkbox" name="active" ${v.active?'checked':''}> Live</label><div class="foot" style="grid-column:1/-1">${x?'<button type="button" class="btn d" id="del">Delete</button>':''}<span class="grow"></span><button type="button" class="btn" id="cx">Cancel</button><button class="btn p">Save</button></div></form>`);
  $('#cx').onclick=()=>d2.hidden=true;if($('#del'))$('#del').onclick=async()=>{if(!confirm('Delete this advisory?'))return;await api('/seasonal/'+x.id,{method:'DELETE'});d2.hidden=true;VIEWS.seasonal()};
  $('#szf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const lines=k=>f.get(k).split('\n').map(s=>s.trim()).filter(Boolean);await api('/seasonal',{method:'POST',body:{id:x?x.id:undefined,disease:f.get('disease'),emoji:f.get('emoji'),risk:f.get('risk'),region:f.get('region'),months:MONTHS.map((_,i)=>i+1).filter(i=>f.get('m'+i)==='on'),summary:f.get('summary'),symptoms:lines('symptoms'),prevention:lines('prevention'),see_doctor:f.get('see_doctor'),source:f.get('source'),active:f.get('active')==='on'}});d2.hidden=true;toast('Saved');VIEWS.seasonal()}};
 $('#ns').onclick=()=>edit(null);$('#main').querySelectorAll('tr[data-id]').forEach(tr=>tr.onclick=()=>edit(d.items.find(x=>x.id===tr.dataset.id)))};
// ---------------------------------------------------------------- videos
const TOPICS=['cpr_adult','cpr_child','cpr_infant','choking_adult','choking_child','choking_baby','bleeding','burns','heart_attack','stroke','seizure','asthma','anaphylaxis','fracture','head_injury','diabetic','recovery_position','snake_bite','drowning','fainting','nosebleed','heat_stroke','other'];
VIEWS.videos=async()=>{main(head('First-aid videos','Public videos from official organisations, embedded from YouTube (nothing is downloaded or re-hosted). Paste a YouTube link or ID.',`<button class="btn p" id="nv">＋ Add video</button>`));const d=await api('/videos');
 $('#main').insertAdjacentHTML('beforeend',`<div class="wrap card" style="padding:0"><table><thead><tr><th></th><th>Topic</th><th>Title</th><th>Channel</th><th>Lang</th><th>Status</th></tr></thead><tbody>${d.videos.map(v=>`<tr class="click" data-id="${v.id}"><td><img src="https://i.ytimg.com/vi/${E(v.yt)}/mqdefault.jpg" alt="" width="96" style="border-radius:8px;display:block" loading="lazy"></td><td class="mono sm">${E(v.topic)}</td><td><b>${E(v.title)}</b><br><a class="sm" href="https://www.youtube.com/watch?v=${E(v.yt)}" target="_blank" rel="noopener">${E(v.yt)}</a></td><td>${E(v.channel)}</td><td>${E(v.lang)}</td><td>${v.verified?'<span class="tag ok">Verified</span>':'<span class="tag warn">Unverified</span>'}${v.active?'':'<span class="tag">Hidden</span>'}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No videos yet</td></tr>'}</tbody></table></div>`);
 const edit=v=>{const x=v||{topic:'cpr_adult',lang:'en',verified:false,active:true,sort:99};const d2=drawer(`<h2>${v?'Edit video':'Add video'}</h2><form id="vf" class="form"><label class="full">YouTube link or ID<input name="yt" value="${E(x.yt||'')}" required></label><label class="full">Title<input name="title" value="${E(x.title||'')}" required></label><label>Channel / organisation<input name="channel" value="${E(x.channel||'')}" required></label><label>Topic<select name="topic">${TOPICS.map(t=>`<option ${x.topic===t?'selected':''}>${t}</option>`).join('')}</select></label><label>Language<select name="lang">${['en','hi','te','ta','kn','ml','mr','bn'].map(l=>`<option ${x.lang===l?'selected':''}>${l}</option>`).join('')}</select></label><label>Sort<input name="sort" type="number" value="${x.sort}"></label><label class="full">Source page<input name="source" value="${E(x.source||'')}"></label><label class="ck"><input type="checkbox" name="verified" ${x.verified?'checked':''}> Verified official channel</label><label class="ck"><input type="checkbox" name="active" ${x.active?'checked':''}> Live</label><div class="foot" style="grid-column:1/-1">${v?'<button type="button" class="btn d" id="del">Delete</button>':''}<span class="grow"></span><button type="button" class="btn" id="cx">Cancel</button><button class="btn p">Save</button></div></form>`);
  $('#cx').onclick=()=>d2.hidden=true;if($('#del'))$('#del').onclick=async()=>{await api('/videos/'+v.id,{method:'DELETE'});d2.hidden=true;VIEWS.videos()};
  $('#vf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await api('/videos',{method:'POST',body:{id:v?v.id:undefined,yt:f.get('yt'),title:f.get('title'),channel:f.get('channel'),topic:f.get('topic'),lang:f.get('lang'),sort:+f.get('sort'),source:f.get('source'),verified:f.get('verified')==='on',active:f.get('active')==='on'}});d2.hidden=true;toast('Saved');VIEWS.videos()}};
 $('#nv').onclick=()=>edit(null);$('#main').querySelectorAll('tr[data-id]').forEach(tr=>tr.onclick=()=>edit(d.videos.find(x=>x.id===tr.dataset.id)))};
// ---------------------------------------------------------------- team & audit
VIEWS.system=async()=>{main(head('System','What is switched on, what still needs a key, and app errors'));const [st,errs,stats,app,su]=await Promise.all([api('/settings'),api('/client-errors'),api('/stats'),api('/app/status').catch(()=>null),api('/console/setup').catch(()=>null)]);
 if(app){$('#main').insertAdjacentHTML('beforeend',`<div class="card"><h3>Android app download</h3><p>${app.published?`<span class="tag ok">published</span> v${E(app.meta.version)} · ${(app.meta.size/1048576).toFixed(1)} MB · built ${new Date(app.meta.built*1000).toLocaleString('en-IN')} · ${E(app.meta.variant||'')} <a href="/download/android">download</a>`:`<span class="tag warn">not published</span> — the website's button is off until a build is published.`}${app.bucket?'':' <span class="tag bad">no bucket (S3_BUCKET)</span>'}</p>
  <ol class="sm mute">${app.howTo.map(h=>`<li>${E(h)}</li>`).join('')}</ol><form id="apkf" class="row"><input type="file" id="apk" accept=".apk"><input id="apkv" placeholder="Version e.g. 1.0" style="width:120px"><input id="apkc" type="number" placeholder="Code" style="width:80px" value="1"><button class="btn p">Upload APK</button></form><p class="sm mute">Store links: Play ${app.play?`<a href="${E(app.play)}">set</a>`:'PLAY_STORE_URL not set'} · App Store ${app.appstore?'set':'APPSTORE_URL not set'} · TestFlight ${app.testflight?'set':'TESTFLIGHT_URL not set'}</p></div>`);
  $('#apkf').onsubmit=async e=>{e.preventDefault();const f=$('#apk').files[0];if(!f){toast('Choose the APK');return}const fd=new FormData();fd.append('file',f);fd.append('version',$('#apkv').value||'1.0');fd.append('version_code',$('#apkc').value||'1');const r=await fetch('/api/admin/app/android',{method:'PUT',body:fd,credentials:'same-origin'});const j=await r.json();if(!r.ok){toast(j.detail||'Upload failed');return}toast('Published v'+j.version);VIEWS.system()}}const rv=st.reviewer||{};
 main(head('System','What is switched on, what still needs a key, and app errors')+setupCard(su,true)+`<div class="two" style="margin-top:14px"><div class="card"><h3>Clinical reviewer</h3><p class="sm mute">Shown in the app on first aid, insights, cycle and children's pages once filled in. Leave the name empty to show "awaiting review".</p>
  <form id="rvf" class="form"><label>Name<input name="name" value="${E(rv.name||'')}" placeholder="Dr. Name"></label><label>Qualification<input name="qualification" value="${E(rv.qualification||'')}" placeholder="MBBS, MD (Medicine)"></label><label>Registration no.<input name="registration" value="${E(rv.registration||'')}" placeholder="NMC / state council"></label><label>Review date<input name="date" value="${E(rv.date||'')}" placeholder="18 Oct 2026"></label><label>Scope<input name="scope" value="${E(rv.scope||'')}" placeholder="First aid, lab guidance, pregnancy, cycle"></label><button class="btn p" type="submit">Save</button></form></div>
  <div class="card"><h3>Your account</h3><p class="sm mute">Signed in as <b>${E(ME.email)}</b>. Move it to an @urbanhealth.in address you control.</p><form id="emf" class="form"><label>New email<input name="email" type="email" required placeholder="you@urbanhealth.in"></label><label>Current password<input name="password" type="password" required autocomplete="current-password"></label><button class="btn p">Change email</button></form><p class="sm mute">Environment <b>${E(st.env||'production')}</b> · files in <b>${E(st.files||'database')}</b></p></div></div>
  <div class="card"><div class="hd"><h3>App errors · last 100</h3><button class="btn sm" id="errclr">Clear</button></div>${errs.length?`<table class="tbl"><thead><tr><th>When</th><th>Message</th><th>Page</th><th>Count</th></tr></thead><tbody>${errs.map(e=>`<tr><td>${new Date(e.t*1000).toLocaleString('en-IN')}</td><td><b>${E(e.message)}</b><br><small class="mute">${E((e.stack||'').slice(0,160))}</small></td><td>${E(e.page)}</td><td>${e.count}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">✓ No app errors. Crashes on family phones are reported here automatically.</div>'}</div>`);
 $('#rvf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await api('/settings/reviewer',{method:'POST',body:Object.fromEntries(f.entries())});go('system')};
 $('#emf').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));try{const r=await api('/me/email',{method:'PUT',body:f});ME.email=r.email;toast('Email changed. Use it next time you sign in.');go('system')}catch(err){toast(err.message)}};
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));$('#errclr').onclick=async()=>{await api('/client-errors',{method:'DELETE'});go('system')}};
VIEWS.team=async()=>{main(head('Team & audit','Who runs Urban Health. Owner: everything. Operations: partners, orders, families and privacy requests. Content: the library only. Every admin signs in with an authenticator app.'));
 let admins={admins:[]};try{admins=await api('/admins')}catch(e){}const au=await api('/audit');
 $('#main').insertAdjacentHTML('beforeend',`<div class="two"><div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Admins</h3>${ME.role==='owner'?'<button class="btn sm" id="na">＋ Add admin</button>':''}</div><table><thead><tr><th>Email</th><th>Role</th><th>Authenticator</th><th>Last login</th><th></th></tr></thead><tbody>${admins.admins.map(a=>`<tr><td>${E(a.email)}</td><td><span class="role ${E(a.role)}">${E({owner:'Owner',ops:'Operations',content:'Content'}[a.role]||a.role)}</span></td><td>${a.totp?'<span class="tag ok">Set up</span>':'<span class="tag warn">At next sign-in</span>'}</td><td class="sm">${when(a.lastLogin)}</td><td style="white-space:nowrap">${ME.role==='owner'?`<button class="btn sm" data-pw="${E(a.email)}">Reset password</button> ${a.totp?`<button class="btn sm" data-tr="${a.id}">Reset authenticator</button> `:''}<button class="btn sm d" data-da="${a.id}" aria-label="Remove admin">✕</button>`:''}</td></tr>`).join('')||'<tr><td colspan="4" class="mute sm">Only owners can list admins.</td></tr>'}</tbody></table></div>
 <div class="card"><h3>Audit log</h3><div class="wrap" style="max-height:480px"><table><tbody>${au.rows.map(r=>`<tr><td class="sm mono mute" style="white-space:nowrap">${when(r.t)}</td><td class="sm"><b>${E(whoTxt(r.who))}</b> ${E(actTxt(r.what))}${r.detail?`<br><span class="mute">${E(r.detail).slice(0,160)}</span>`:''}</td></tr>`).join('')||'<tr><td class="mute">Nothing yet</td></tr>'}</tbody></table></div></div></div>`);
 const form=(email)=>{const d2=drawer(`<h2>${email?'Reset password':'Add admin'}</h2><form id="af" class="form"><label class="full">Email<input name="email" type="email" value="${E(email||'')}" ${email?'readonly':''} required></label><label>Password (12+ characters, not a common one)<input name="password" type="password" minlength="12" maxlength="128" required></label><label>Role<select name="role"><option value="ops">Operations</option><option value="content">Content</option><option value="owner">Owner</option></select></label><div class="foot" style="grid-column:1/-1"><button type="button" class="btn" id="cx">Cancel</button><button class="btn p">Save</button></div></form>`);
  $('#cx').onclick=()=>d2.hidden=true;$('#af').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await api('/admins',{method:'POST',body:{email:f.get('email'),password:f.get('password'),role:f.get('role')}});d2.hidden=true;toast('Saved');VIEWS.team()}};
 if($('#na'))$('#na').onclick=()=>form(null);$('#main').querySelectorAll('[data-pw]').forEach(b=>b.onclick=()=>form(b.dataset.pw));$('#main').querySelectorAll('[data-da]').forEach(b=>b.onclick=async()=>{if(!confirm('Remove this admin?'))return;await api('/admins/'+b.dataset.da,{method:'DELETE'});VIEWS.team()});
 $('#main').querySelectorAll('[data-tr]').forEach(b=>b.onclick=async()=>{if(!confirm('Reset their authenticator? They are signed out and set it up again at their next sign-in.'))return;await api('/admins/'+b.dataset.tr+'/reset-totp',{method:'POST'});toast('Authenticator reset');VIEWS.team()})};
// ---------------------------------------------------------------- boot
(async()=>{try{ME=await api('/me',{quiet:true});idleArm()}catch(e){ME=null}render()})();
addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(v&&VIEWS[v]&&v!==VIEW){VIEW=v;render()}});
</script>
</body>
</html>

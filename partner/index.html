<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TheHealthTracker Partners</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/brand/svg/partner-icon.svg"><meta name="theme-color" content="#13b5a3">
<style>
:root{--bg:#f2f7f6;--card:#fff;--soft:#f3f8f7;--ink:#0f1221;--mute:#6b7285;--line:rgba(15,18,33,.08);--blue:#2f5bff;--teal:#13b5a3;--red:#ef3b4f;--amber:#f59e0b;--green:#16a34a;--r:18px;--sh:0 10px 30px -14px rgba(15,18,33,.18);--font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b0f0e;--card:#131a19;--soft:#182120;--ink:#eef1fb;--mute:#8f97ad;--line:rgba(255,255,255,.08);--sh:0 10px 30px -14px rgba(0,0,0,.6)}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}a{color:var(--teal);text-decoration:none}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:0;height:100vh;padding:18px 14px;border-right:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;padding:4px 8px 16px}.logo img{height:26px}.logo small{display:block;font-weight:500;color:var(--mute);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
nav button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px;border-radius:12px;color:var(--mute);font-weight:500}
nav button:hover{background:var(--soft);color:var(--ink)}nav button.on{background:color-mix(in srgb,var(--teal) 14%,transparent);color:var(--teal);font-weight:600}
nav button em{margin-left:auto;font-style:normal;font-size:11px;background:var(--red);color:#fff;border-radius:99px;padding:1px 7px}
.who{margin-top:auto;padding:10px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--mute)}.who b{display:block;color:var(--ink);font-size:13px;overflow:hidden;text-overflow:ellipsis}
main{padding:22px 26px 60px;max-width:1300px}
h1{font-size:26px;letter-spacing:-.03em;margin:0 0 2px}.sub{color:var(--mute);margin:0 0 18px}h3{margin:0 0 10px;font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);border:1px solid var(--line);margin-bottom:12px}
.kpi small{display:block;font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}.kpi b{font-size:28px;letter-spacing:-.03em;line-height:1.1;display:block;margin-top:4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.grow{flex:1 1 auto;min-width:0}
input,select,textarea{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:9px 12px;outline:none;min-width:0;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 18%,transparent)}.row input,.row select{width:auto}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:12px;font-weight:600;background:var(--soft);border:1px solid var(--line);white-space:nowrap}
.btn.p{background:var(--teal);color:#fff;border-color:transparent}.btn.d{color:var(--red)}.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:10px}.btn:disabled{opacity:.5;cursor:default}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border:0}
.tag{display:inline-block;font:600 10.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:99px;background:var(--soft);border:1px solid var(--line);color:var(--mute)}
.tag.ok{color:var(--green);border-color:color-mix(in srgb,var(--green) 40%,transparent)}.tag.warn{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 50%,transparent)}.tag.bad{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent)}.tag.go{color:var(--teal);border-color:color-mix(in srgb,var(--teal) 50%,transparent)}
.ord{display:grid;grid-template-columns:1fr auto;gap:8px 16px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:var(--card)}
.ord b.id{font-family:var(--mono);font-size:13px}.ord .items{color:var(--mute);font-size:12.5px;margin-top:4px}.ord .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:flex-start}
.empty{padding:28px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:14px}
.pick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}.pick .btn{background:var(--card)}
.vrx{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}.vrx label{display:block;font-size:12px;font-weight:600;color:var(--mute)}.vrx input{background:var(--card)}
@media print{aside,.row button,.row select,.row input,.cards,.toast{display:none!important}.app{display:block}main{padding:0;max-width:none}.card{box-shadow:none;border:0;padding:0;margin:0 0 12px}table{font-size:12px}}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .card{width:min(420px,100%)}.login label{display:block;margin:10px 0 4px;font-size:12.5px;font-weight:600;color:var(--mute)}
.msg{display:none;margin:10px 0 0;padding:9px 12px;border-radius:10px;font-size:13px}.msg.on{display:block}.msg.err{background:color-mix(in srgb,var(--red) 10%,transparent);color:var(--red)}.msg.ok{background:color-mix(in srgb,var(--green) 10%,transparent);color:var(--green)}
.chat{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto;padding:6px 0}.bub{max-width:70%;padding:9px 12px;border-radius:14px;background:var(--soft);font-size:13.5px}.bub.me{align-self:flex-end;background:color-mix(in srgb,var(--teal) 16%,transparent)}.bub small{display:block;color:var(--mute);font-size:10.5px;margin-top:2px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;opacity:0;transition:.2s;pointer-events:none;z-index:9}.toast.on{opacity:1;transform:translateX(-50%)}
.pl{display:grid;grid-template-columns:1fr 110px 110px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.pl small{color:var(--mute);display:block}.pl.h{font:600 10.5px var(--mono);text-transform:uppercase;color:var(--mute)}
.call .vid{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin:10px 0}.call video{width:100%;aspect-ratio:4/3;background:#0b1220;border-radius:12px;object-fit:cover}.caps{min-height:28px;margin:0 0 10px}.caps p{margin:0 0 4px;font-size:13.5px;background:var(--soft);border-radius:10px;padding:6px 10px;display:inline-block}.caps p.doctor{background:color-mix(in srgb,var(--teal) 16%,transparent)}.caps b{font-size:11px;color:var(--mute);margin-right:6px}
.rxrow{display:grid;grid-template-columns:1.4fr 90px 110px 150px 90px 1.2fr 36px;gap:6px;margin-bottom:6px}.rxrow input,.rxrow select{width:100%}@media(max-width:860px){.rxrow{grid-template-columns:1fr 1fr}.call .vid{grid-template-columns:1fr}}
.login label{display:block}.login .row label input,.login .row label select{width:100%}
.bmap{position:relative;overflow:hidden;border-radius:14px;border:1px solid var(--line);margin-top:10px;background:#e8edf3}.bmap-in{position:absolute;left:50%;top:0}.bmap-in img{position:absolute;width:256px;height:256px}.bmap .pin{position:absolute;transform:translate(-50%,-100%);font-size:22px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}.bmap .pin.me{font-size:26px}.bmap .osm{position:absolute;right:6px;bottom:4px;font-size:10px;background:rgba(255,255,255,.8);padding:1px 6px;border-radius:6px;color:#333}
@media (max-width:860px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}nav{display:flex;flex-wrap:wrap;gap:4px}nav button{width:auto}.who{margin:0 0 0 auto;border:0;padding:0}main{padding:16px}.ord{grid-template-columns:1fr}.ord .acts{justify-content:flex-start}}
</style>
</head>
<body>
<div id="root"></div><div class="toast" id="toast"></div>
<script>
const $=(s,r=document)=>r.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(p,o={})=>{const r=await fetch('/api/partner'+p,{method:o.method||'GET',headers:o.raw?o.headers:{'content-type':'application/json'},body:o.raw?o.body:(o.body===undefined?undefined:JSON.stringify(o.body)),credentials:'same-origin',cache:'no-store'});let j={};try{j=await r.json()}catch(e){}if(r.status===401&&!o.quiet){ME=null;render();throw new Error('Signed out')}if(!r.ok)throw new Error(j.detail||'Request failed');return j};
const toast=t=>{const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>el.classList.remove('on'),2400)};
const fmt=t=>new Date(t*1000).toLocaleString('en-IN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
const money=n=>'₹'+Math.round(+n||0).toLocaleString('en-IN');
let ME=null,view='orders',data={};
const KINDN={lab:'Diagnostic lab',pharmacy:'Pharmacy',hospital:'Hospital / clinic',bloodbank:'Blood bank',shop:'TheHealthTracker store'};
function render(){const root=$('#root');if(!ME){root.innerHTML=`<div class="login"><div class="card"><div class="logo"><img src="/brand/svg/partner-logo.svg" alt="TheHealthTracker"><small>Partner portal</small></div>
  <form id="lf"><label>Email</label><input id="le" type="email" autocomplete="username" required><label>Password</label><input id="lp" type="password" autocomplete="current-password" required><p class="msg" id="lm"></p><button class="btn p" style="width:100%;justify-content:center;margin-top:14px">Sign in</button></form>
  <p style="color:var(--mute);font-size:12px;margin:14px 0 0">For verified labs, pharmacies and hospitals. Not a partner yet? <a href="#" id="applyLink">Apply to join</a> · partner@thehealthtracker.com</p></div></div>`;
  $('#applyLink').onclick=e=>{e.preventDefault();applyView()};
  $('#lf').onsubmit=async e=>{e.preventDefault();const m=$('#lm');m.className='msg';try{ME=await api('/login',{method:'POST',body:{email:$('#le').value,password:$('#lp').value}});view=ME.user.mustChange?'profile':'orders';render();load()}catch(err){m.className='msg on err';m.textContent=err.message}};return}
 const s=ME.store,c=ME.counts,isLab=s.kind==='lab',isHosp=s.kind==='hospital';
 const isBB=s.kind==='bloodbank',isShop=s.kind==='shop';
 const nav=[isBB?null:['orders',isLab?'Bookings':isHosp?'Orders':'Orders',c.openOrders],isLab?['team','Collection team',0]:null,s.kind==='pharmacy'?['team','Pharmacists',0]:null,s.kind==='pharmacy'?['pick','Pick list',0]:null,ME.user.role==='owner'?['earnings','Earnings',0]:null,isHosp?['appts','Visit requests',c.pendingAppointments]:null,isHosp?['consults','Video consults',0]:null,(isHosp||isBB||ME.user.role==='doctor')?['blood','Blood requests',0]:null,['msgs','Messages',c.unreadMessages],(isHosp||isBB||isShop)?null:['prices',isLab?'Price list':'Stock & prices',0],['profile','Store profile',0]].filter(Boolean);
 if(isBB&&view==='orders')view='blood';
 root.innerHTML=`<div class="app"><aside><div class="logo"><img src="/brand/svg/partner-logo.svg" alt="TheHealthTracker partners"></div><nav>${nav.map(([k,n,b])=>`<button class="${view===k?'on':''}" data-v="${k}">${n}${b?`<em>${b}</em>`:''}</button>`).join('')}</nav>
  <div class="who"><b>${E(s.name)}</b>${E(KINDN[s.kind]||s.kind)} · ${s.verified?'<span class="tag ok">verified</span>':'<span class="tag warn">pending verification</span>'}<br>${ME.user.role==='doctor'?`Dr ${E(ME.user.name)} · `:''}${E(ME.user.email)} · <a href="#" id="out">Sign out</a></div></aside><main id="main"></main></div>`;
 root.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;render();load()});$('#out').onclick=async e=>{e.preventDefault();await api('/logout',{method:'POST'});ME=null;render()};
 VIEWS[view]()}
const head=(t,sub,right='')=>`<div class="row" style="justify-content:space-between;align-items:flex-start"><div><h1>${t}</h1><p class="sub">${sub}</p></div><div class="row" style="margin:0">${right}</div></div>`;
const VIEWS={};
async function load(){try{ME=await api('/me',{quiet:true})}catch(e){}if(ME&&!(typeof CALL!=='undefined'&&CALL&&!CALL.ended))render()}
// ---------------- orders / bookings
VIEWS.orders=()=>{const isLab=ME.store.kind==='lab';const m=$('#main');m.innerHTML=head(isLab?'Bookings':'Orders',isLab?'Confirm, collect, process, upload the report. The family sees every step in their app.':'Check the prescription, pack, deliver. The family sees every step in their app.',`<select id="ost"><option value="open">Open</option><option value="closed">Closed</option><option value="all">All</option></select>`)+`<div id="ol"><div class="empty">Loading…</div></div>`;
 $('#ost').onchange=()=>loadOrders();loadOrders()};
let LASTO=[];
async function loadOrders(){const st=$('#ost')?$('#ost').value:'open';let r;try{r=await api('/orders?status='+st)}catch(e){$('#ol').innerHTML=`<div class="empty">${E(e.message)}</div>`;return}
 LASTO=r.orders;
 const isLab=ME.store.kind==='lab';if(!r.orders.length){$('#ol').innerHTML=`<div class="empty">${st==='open'?'No open '+(isLab?'bookings':'orders')+'. New ones appear here within a minute of being placed.':'Nothing here.'}</div>`;return}
 $('#ol').innerHTML=r.orders.map(o=>`<div class="ord" data-id="${E(o.id)}"><div><b class="id">THT-${E(o.id)}</b> <span class="tag ${/cancel|refund/.test(o.status)?'bad':/deliver|ready/.test(o.status)?'ok':/return/.test(o.status)?'warn':'go'}">${E(o.status.replace(/_/g,' '))}</span> <span style="color:var(--mute);font-size:12px">${fmt(o.created)}</span>
   <div><b>${E(o.member||o.family.name||'Family')}</b> · ${E(o.address||o.family.city||'')}${o.addr&&o.addr.lat?` · <a href="https://www.google.com/maps/dir/?api=1&destination=${o.addr.lat},${o.addr.lng}" target="_blank" rel="noopener">Directions</a>`:''}${o.addr&&o.addr.phone?` · <a href="tel:${E(o.addr.phone)}">${E(o.addr.phone)}</a>`:''}${o.payment==='upi-paid'?' · <span class="tag ok">paid by UPI</span>':''}${o.slot?` · <b>${E(o.slot)}</b>`:''}${o.payment?` · ${o.payment==='cod'?(isLab?'Pay at collection':'Pay on delivery'):E(o.payment)}`:''}</div>
   <div class="items">${o.items.map(i=>`${E(i.name)}${i.qty>1?' × '+i.qty:''}${i.rx?' <span class="tag warn">Rx</span>':''}`).join(' · ')} · <b>${money(o.total)}</b></div>
   ${o.rxShared?`<div class="items">Prescription: ${o.rxFiles.length?o.rxFiles.map((f,i)=>`<a href="/api/partner/orders/${E(o.id)}/rx/${encodeURIComponent(f)}" target="_blank" rel="noopener">open ${i+1} ↗</a>`).join(' · '):'<span class="tag warn">shared, syncing from the family’s phone</span>'}</div>`:o.items.some(i=>i.rx)?`<div class="items"><span class="tag bad">Rx items without a prescription</span> — do not dispense; message the family.</div>`:''}
   ${o.verified?`<div class="items">Checked by <b>${E(o.verified.by)}</b> <span style="font-family:var(--mono)">${E(o.verified.regNo)}</span> · prescriber ${E(o.verified.doctor)} ${E(o.verified.doctorReg)}${o.verified.rxDate?` · dated ${E(o.verified.rxDate)}`:''}${o.verified.note?`<br>↳ ${E(o.verified.note)}`:''}</div>`:o.needsVerify?`<div class="items"><span class="tag warn">prescription not checked</span> — a registered pharmacist must check it before this can be packed.</div>`:''}
   ${o.agent?`<div class="items">Going: <b>${E(o.agent.name)}</b>${o.agent.phone?` · <a href="tel:${E(o.agent.phone)}">${E(o.agent.phone)}</a>`:''}${o.status==='en_route'?' · <span class="tag go">on the way</span>':o.status==='arrived'?' · <span class="tag go">at the door</span>':''}</div>`:o.canAssign?`<div class="items"><span class="tag warn">nobody assigned</span> — the family is waiting to be told who is coming.</div>`:''}
   ${(o.timeline||[]).filter(t=>(t.note||t.reason)&&t.s!=='assigned').map(t=>`<div class="items">↳ ${E(t.s.replace(/_/g,' '))}: ${E(t.reason||'')} ${E(t.note||'')}</div>`).join('')}<div class="asg" data-for="${E(o.id)}"></div></div>
  <div class="acts">${o.needsVerify?`<button class="btn sm p" data-vrx="${E(o.id)}">Check prescription</button>`:''}${o.canAssign?`<button class="btn sm ${o.agent?'':'p'}" data-asg="${E(o.id)}">${o.agent?'Reassign':'Assign a technician'}</button>`:''}${isLab&&!/cancel/.test(o.status)?`<label class="btn sm ${!o.hasReport&&/collected|processing/.test(o.status)?'p':''}">${o.hasReport?'Replace report':'⬆ Upload report'}<input type="file" accept="application/pdf,image/*" hidden data-rep="${E(o.id)}"></label>`:''}${o.next.map(n=>`<button class="btn sm ${n==='cancelled'?'d':''}" data-st="${E(o.id)}:${n}">${E(o.labels[n])}</button>`).join('')}<button class="btn sm" data-msg="${E(o.householdId)}" data-nm="${E(o.member||o.family.name||'Family')}">💬 Message</button></div></div>`).join('');
 $('#ol').querySelectorAll('[data-msg]').forEach(b=>b.onclick=()=>{view='msgs';render();setTimeout(()=>openThreadNew(b.dataset.msg,b.dataset.nm),300)});
 $('#ol').querySelectorAll('[data-st]').forEach(b=>b.onclick=async()=>{const[id,st]=b.dataset.st.split(':');let note='';if(st==='cancelled'||st==='declined')note=prompt('Reason the family will see:')||'';if(st==='cancelled'&&!note)return;try{await api(`/orders/${id}/status`,{method:'POST',body:{status:st,note}});toast('Updated · the family has been told');loadOrders();load()}catch(e){toast(e.message)}});
 $('#ol').querySelectorAll('[data-asg]').forEach(b=>b.onclick=()=>openAssign(b.dataset.asg));
 $('#ol').querySelectorAll('[data-vrx]').forEach(b=>b.onclick=()=>verifyRx(b.dataset.vrx));
 $('#ol').querySelectorAll('[data-rep]').forEach(i=>i.onchange=async()=>{const f=i.files[0];if(!f)return;if(f.size>15e6){toast('Up to 15 MB');return}try{await api(`/orders/${i.dataset.rep}/report`,{method:'PUT',raw:true,headers:{'content-type':f.type||'application/pdf','x-file-name':f.name},body:f});toast('Report delivered to the family');loadOrders();load()}catch(e){toast(e.message)}})}
// The assign picker. It opens under the booking rather than in a modal: the owner is choosing between people
// by how loaded they already are, and that decision reads better next to the address they are being sent to.
let asgOpen='';
async function openAssign(oid){const box=$(`.asg[data-for="${oid}"]`);if(!box)return;
 if(asgOpen===oid){box.innerHTML='';asgOpen='';return}
 document.querySelectorAll('.asg').forEach(e=>e.innerHTML='');asgOpen=oid;
 box.innerHTML='<div class="items">Loading the team…</div>';
 let r;try{r=await api('/techs')}catch(e){box.innerHTML=`<div class="items">${E(e.message)}</div>`;return}
 const avail=r.techs.filter(t=>t.active);
 if(!avail.length){box.innerHTML=`<div class="items">Nobody on the collection team yet. <a href="#" data-goteam>Add a technician</a> — the family needs a name and a number for whoever turns up.</div>`;
  box.querySelector('[data-goteam]').onclick=e=>{e.preventDefault();view='team';render()};return}
 box.innerHTML=`<div class="pick">${avail.map(t=>`<button class="btn sm" data-pick="${E(oid)}:${E(t.id)}" ${t.live?'title="Already out on a collection"':''}>
   <b>${E(t.name)}</b> <span style="color:var(--mute);font-weight:400">${t.live==='en_route'?'· out now':t.live==='arrived'?'· at a door':t.openJobs?`· ${t.openJobs} waiting`:'· free'}</span></button>`).join('')}</div>`;
 box.querySelectorAll('[data-pick]').forEach(b=>b.onclick=async()=>{const[id,agent]=b.dataset.pick.split(':');b.disabled=true;
  try{await api(`/orders/${id}/assign`,{method:'POST',body:{agent}});asgOpen='';toast('Assigned · the family has been told who is coming');loadOrders();load()}
  catch(e){toast(e.message);b.disabled=false}})}
// ---------------- the pick list
// A pharmacist with fifteen orders open does not walk the shelves fifteen times. The list is gathered by
// medicine, and each line carries the orders it is made of, so one trip down the aisle splits into packets
// at the counter. Unchecked prescriptions stay on the list, marked as waiting: a picker who cannot see why
// an order is missing will assume the list is wrong.
VIEWS.pick=()=>{$('#main').innerHTML=head('Pick list','Everything waiting to be packed, gathered by medicine. Pick once, split at the counter.',
  `<button class="btn" id="pkpr">Print</button><button class="btn p" id="pkgo">Mark picked as packed</button>`)
 +`<div id="pk"><div class="empty">Loading…</div></div>`;
 $('#pkpr').onclick=()=>window.print();loadPick()};
let PICK=null;
async function loadPick(){let r;try{r=await api('/picklist')}catch(e){$('#pk').innerHTML=`<div class="empty">${E(e.message)}</div>`;return}
 PICK=r;const btn=$('#pkgo');if(btn)btn.disabled=!r.ready;
 if(!r.orders.length){$('#pk').innerHTML=`<div class="empty">Nothing to pack. Orders appear here once you start checking them.</div>`;return}
 $('#pk').innerHTML=`<div class="cards">

async function startConsult(aid){let a;try{a=await api(`/consults/${aid}/start`,{method:'POST'})}catch(e){toast(e.message);return}

 $('#callbox').innerHTML=`<div class="card call"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Consult · ${E(a.memberName||'')} <span class="tag warn" id="cst">waiting for the family</span></h3><span id="ctime" style="font-family:var(--mono)"></span></div>

  <div class="row"><button class="btn" id="bmute">🎤 Mute</button><button class="btn" id="bcam">📷 Camera off</button><button class="btn" id="bcaps">💬 Captions on</button><button class="btn d" id="bend">📵 End consult</button><button class="btn p" id="brx">℞ Prescribe</button></div>
  <p style="color:var(--mute);font-size:12px;margin:0">Captions are produced in your browser (Chrome/Edge) and shared with the family; at the end they are saved with the visit so the family gets a plain-words summary. Keep clinical notes in your own system as usual.</p></div>`;

 $('#lv').srcObject=CALL.local;
 const ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws/call/'+aid);CALL.ws=ws;
 ws.onmessage=async ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}const c=CALL;if(!c||c.ws!==ws)return;
  if(m.type==='hello'){c.ice=m.ice;if(m.peerPresent)offer();return}
  if(m.type==='peer'){if(m.present)offer();else{status('family left','warn');c.connected=false}return}
  if(m.type==='answer'){try{await c.pc.setRemoteDescription({type:'answer',sdp:m.sdp});for(const x of (c.pending||[]))await c.pc.addIceCandidate(x);c.pending=[]}catch(e){console.warn(e)}return}
  if(m.type==='ice'&&m.candidate){try{if(c.pc&&c.pc.remoteDescription)await c.pc.addIceCandidate(m.candidate);else (c.pending=c.pending||[]).push(m.candidate)}catch(e){}return}
  if(m.type==='caption'){c.lines.push({who:'family',t:m.t||Date.now(),text:String(m.text||'').slice(0,400)});paintCaps();return}
  if(m.type==='context'&&m.ctx){ctxPanel(m.ctx);return}
  if(m.type==='hangup'){status('family ended the call','warn');return}};
 ws.onclose=()=>{const c=CALL;if(c&&c.ws===ws&&!c.ended)status('reconnecting…','warn')};
 $('#bmute').onclick=()=>{const c=CALL;c.muted=!c.muted;c.local.getAudioTracks().forEach(t=>t.enabled=!c.muted);$('#bmute').textContent=c.muted?'🔇 Unmute':'🎤 Mute'};
 $('#bcam').onclick=()=>{const c=CALL;c.camOff=!c.camOff;c.local.getVideoTracks().forEach(t=>t.enabled=!c.camOff);$('#bcam').textContent=c.camOff?'📷 Camera on':'📷 Camera off'};
 $('#bcaps').onclick=()=>{const c=CALL;c.captions=!c.captions;if(c.captions)captions();else if(c.sr){try{c.sr.stop()}catch(e){}}$('#bcaps').textContent=c.captions?'💬 Captions on':'💬 Captions off'};
 $('#bend').onclick=()=>hangup();$('#brx').onclick=()=>rxForm(aid,CALL.appt);captions();tick()}
function ctxPanel(x){const p=x.person||{};const box=$('#callbox');if(!box)return;let el=$('#ctxp');if(!el){el=document.createElement('div');el.id='ctxp';el.className='card';box.appendChild(el)}
 const res=(x.results||[]).slice(0,8),vit=(x.readings||[]).slice(-3),meds=(x.medicines||[]);
 el.innerHTML=`<h3>Patient summary <span class="tag ok">shared by the family for this visit</span></h3><div class="row"><span><b>${E(x.name||p.name||'')}</b> · ${p.age??''} ${p.sex||''} ${x.blood?' · '+E(x.blood):''}${p.pregnant?' · <b>pregnant</b>':''}</span></div>

  ${vit.length?`<p class="sm" style="margin:8px 0 0"><b>Recent readings:</b> ${vit.map(v=>E([v.d,v.sys?v.sys+'/'+v.dia+' mmHg':'',v.glu?v.glu+' mg/dL':'',v.hr?v.hr+' bpm':'',v.spo2?'SpO₂ '+v.spo2+'%':''].filter(Boolean).join(' '))).join(' · ')}</p>`:''}
  <p class="sm" style="color:var(--mute);margin:8px 0 0">Shown for this consult only; not stored on the portal. Record your own notes in your system.</p>`}
function status(t,cls){const el=$('#cst');if(el){el.textContent=t;el.className='tag '+(cls||'ok')}}
function tick(){const c=CALL;if(!c||c.ended)return;if(c.t0){const s=Math.floor((Date.now()-c.t0)/1000);const el=$('#ctime');if(el)el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}setTimeout(tick,1000)}
function pc(){const c=CALL;if(c.pc)return c.pc;const p=new RTCPeerConnection({iceServers:c.ice||[{urls:['stun:stun.l.google.com:19302']}]});c.pc=p;c.remote=new MediaStream();c.local.getTracks().forEach(t=>p.addTrack(t,c.local));
 p.ontrack=e=>{(e.streams[0]?e.streams[0].getTracks():[e.track]).forEach(t=>c.remote.addTrack(t));const rv=$('#rv');if(rv&&rv.srcObject!==c.remote)rv.srcObject=c.remote};
 p.onicecandidate=e=>{if(e.candidate&&c.ws.readyState===1)c.ws.send(JSON.stringify({type:'ice',candidate:e.candidate}))};
 p.onconnectionstatechange=()=>{if(p.connectionState==='connected'){c.connected=true;c.t0=c.t0||Date.now();status('connected','ok')}else if(p.connectionState==='failed'){status('connection lost · retrying','warn');try{p.restartIce()}catch(e){}}};return p}
async function offer(){const c=CALL;if(!c)return;status('connecting…','warn');const p=pc();try{const o=await p.createOffer({iceRestart:!!c.offered});c.offered=true;await p.setLocalDescription(o);c.ws.send(JSON.stringify({type:'offer',sdp:o.sdp}))}catch(e){console.warn(e)}}
function paintCaps(){const c=CALL;const el=$('#caps');if(!el||!c)return;el.innerHTML=c.lines.slice(-4).map(l=>`<p class="${l.who}"><b>${l.who==='doctor'?'You':'Family'}</b> ${E(l.text)}</p>`).join('')}
function captions(){const c=CALL;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR||!c)return;try{const r=new SR();r.lang='en-IN';r.continuous=true;r.interimResults=false;r.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){const res=e.results[i];if(!res.isFinal)continue;const text=res[0].transcript.trim();if(!text)continue;const line={who:'doctor',t:Date.now(),text};c.lines.push(line);paintCaps();if(c.ws.readyState===1&&c.captions)c.ws.send(JSON.stringify({type:'caption',text,t:line.t}))}};r.onend=()=>{if(CALL===c&&!c.ended&&c.captions){try{r.start()}catch(e){}}};r.onerror=()=>{};c.sr=r;r.start()}catch(e){}}
async function hangup(silent){const c=CALL;if(!c||c.ended)return;c.ended=true;try{if(c.ws.readyState===1)c.ws.send(JSON.stringify({type:'hangup'}))}catch(e){}try{if(c.sr)c.sr.stop()}catch(e){}try{if(c.pc)c.pc.close()}catch(e){}try{c.local.getTracks().forEach(t=>t.stop())}catch(e){}try{c.ws.close()}catch(e){}

 const box=$('#rxcard');box.querySelector('#rxadd').onclick=()=>box.querySelector('#rxrows').insertAdjacentHTML('beforeend',row());box.addEventListener('click',e=>{if(e.target.dataset.del!==undefined)e.target.closest('.rxrow').remove()});box.querySelector('#rxcancel').onclick=()=>box.remove();

function tileMap(center,pins,H=260){const z=13,W=1000,n=Math.pow(2,z);const tx=lng=>(lng+180)/360*n,ty=lat=>(1-Math.log(Math.tan(lat*Math.PI/180)+1/Math.cos(lat*Math.PI/180))/Math.PI)/2*n;const cx=tx(center.lng),cy=ty(center.lat),x0=cx-W/512,y0=cy-H/512;let tiles='';for(let x=Math.floor(x0);x<=Math.floor(x0+W/256);x++)for(let y=Math.floor(y0);y<=Math.floor(y0+H/256);y++){if(y<0||y>=n)continue;tiles+=`<img src="https://tile.openstreetmap.org/${z}/${((x%n)+n)%n}/${y}.png" style="left:${(x-x0)*256}px;top:${(y-y0)*256}px" alt="">`}
 const P2=pins.filter(p=>p.lat!=null&&p.lng!=null).map(p=>{const px=(tx(p.lng)-x0)*256,py=(ty(p.lat)-y0)*256;return `<span class="pin ${p.cls||''}" style="left:${px}px;top:${py}px" title="${E(p.title||'')}">${p.label||''}</span>`}).join('');
 return `<div class="bmap" style="height:${H}px"><div class="bmap-in" style="width:${W}px;height:${H}px;margin-left:${-W/2}px">${tiles}${P2}<span class="pin me" style="left:${(cx-x0)*256}px;top:${(cy-y0)*256}px" title="Hospital">🏥</span></div><a class="osm" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a></div>`}

 $('#bl').innerHTML=r.requests.map(q=>{const live=q.responses.filter(x=>['accepted','on_way','arrived'].includes(x.status));const u=URG[q.urgency]||['',q.urgency];return `<div class="card" data-rq="${E(q.id)}"><div class="row" style="justify-content:space-between"><div><b style="font-size:20px">${E(q.group)}</b> · ${q.units} unit${q.units>1?'s':''} · ${E(q.component)} <span class="tag ${u[0]}">${u[1]}</span> <span class="tag ${q.status==='open'?'go':q.status==='fulfilled'?'ok':''}">${E(q.status)}</span><div style="color:var(--mute);font-size:12.5px">${q.patient?'For '+E(q.patient)+' · ':''}${q.ward?E(q.ward)+' · ':''}${fmt(q.created)} · ${q.notified} donors notified · expires ${fmt(q.expires)}</div></div>
   <div class="row" style="margin:0">${q.status==='open'?`<button class="btn sm" data-bs="${E(q.id)}:fulfilled">Mark fulfilled</button><button class="btn sm d" data-bs="${E(q.id)}:closed">Close</button>`:''}</div></div>
  ${q.responses.length?`<table><tr><th>Donor</th><th>Group</th><th>Status</th><th>Distance · ETA</th><th>Phone</th><th></th></tr>${q.responses.map(x=>`<tr><td>${E(x.name)}${x.donations?` <span class="tag">${x.donations}× donor</span>`:''}</td><td>${E(x.group)}</td><td><span class="tag ${x.status==='on_way'?'go':x.status==='arrived'||x.status==='donated'?'ok':x.status==='accepted'?'warn':''}">${E(x.status.replace('_',' '))}</span>${x.locT?`<br><span class="mute" style="font-size:11px">seen ${fmt(x.locT)}</span>`:''}</td><td>${x.km!=null?x.km+' km':'—'}${x.eta&&['accepted','on_way'].includes(x.status)?` · ~${x.eta} min`:''}</td><td>${x.phone?`<a href="tel:${E(x.phone)}">${E(x.phone)}</a>`:'<span class="mute">after accept</span>'}</td><td class="acts">${x.status==='offered'?`<button class="btn sm p" data-ra="${E(q.id)}:${E(x.id)}:accept">Accept</button><button class="btn sm" data-ra="${E(q.id)}:${E(x.id)}:decline">Decline</button>`:['accepted','on_way','arrived'].includes(x.status)?`<button class="btn sm p" data-ra="${E(q.id)}:${E(x.id)}:donated">Donated ✓</button>`:''}</td></tr>`).join('')}</table>`:'<p class="mute" style="margin:6px 0 0">No donor has responded yet.</p>'}
  ${live.length?tileMap({lat:q.lat,lng:q.lng},live.map(x=>({lat:x.lat,lng:x.lng,cls:x.status,label:'🩸',title:x.name+' · '+(x.km||'?')+' km'}))):''}</div>`}).join('');
 $('#bl').querySelectorAll('[data-bs]').forEach(b=>b.onclick=async()=>{const[id,st]=b.dataset.bs.split(':');if(!confirm(st==='fulfilled'?'Mark this request fulfilled? Donors still travelling keep their status; others are told.':'Close this request? All donors are told.'))return;try{await api(`/blood/${id}/status`,{method:'POST',body:{status:st}});loadBlood()}catch(e){toast(e.message)}});
 $('#bl').querySelectorAll('[data-ra]').forEach(b=>b.onclick=async()=>{const[id,xid,act]=b.dataset.ra.split(':');try{await api(`/blood/${id}/responses/${xid}`,{method:'POST',body:{action:act}});toast(act==='accept'?'Accepted · the donor has been told and can start':act==='donated'?'Recorded — thank you':'Declined');loadBlood()}catch(e){toast(e.message)}})}
function bloodForm(){$('#bl').insertAdjacentHTML('afterbegin',`<div class="card" id="brf"><h3>New blood request</h3><form id="brform"><div class="row"><label>Group<select name="group">${GROUPS.map(g=>`<option>${g}</option>`).join('')}</select></label><label>Component<select name="component"><option value="whole">Whole blood</option><option value="rbc">Packed red cells</option><option value="platelets">Platelets</option><option value="plasma">Plasma</option></select></label><label>Units<input name="units" type="number" min="1" max="20" value="1" style="width:80px"></label><label>Urgency<select name="urgency"><option value="now">Needed now</option><option value="24h" selected>Within 24 hours</option><option value="72h">This week</option></select></label><label>Radius km<input name="radiusKm" type="number" min="5" max="100" value="25" style="width:80px"></label></div>
  <div class="row"><label style="flex:1">Patient first name <small style="color:var(--mute)">(optional, shown to donors)</small><input name="patient" maxlength="40"></label><label style="flex:1">Ward / where to come<input name="ward" maxlength="80" placeholder="Blood bank, ground floor"></label><label style="flex:1">Contact number<input name="phone" maxlength="20" value="${E(ME.store.phone||'')}"></label></div>
  <label>Notes for donors<input name="notes" maxlength="300" placeholder="Bring ID; come fasting-free; parking at gate 2"></label>
  <p class="msg" id="brm"></p><div class="row" style="margin-top:8px"><button class="btn p">Notify matching donors</button><button class="btn" type="button" id="brx">Cancel</button></div></form></div>`);
 $('#brx').onclick=()=>$('#brf').remove();$('#brform').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),b={};f.forEach((v,k)=>b[k]=v);b.units=+b.units;b.radiusKm=+b.radiusKm;try{const r=await api('/blood',{method:'POST',body:b});toast(`Request raised · ${r.notified} donors notified`);loadBlood()}catch(err){const m=$('#brm');m.className='msg on err';m.textContent=err.message}}}
// ---------------- apply to join (public)
function applyView(){const root=$('#root');root.innerHTML=`<div class="login"><div class="card" style="width:min(640px,100%)"><div class="logo"><img src="/brand/svg/partner-logo.svg" alt="TheHealthTracker"><small>Apply to join the partner network</small></div>
  <p style="color:var(--mute);font-size:13px">Families on TheHealthTracker book tests, order medicines and request visits from verified partners near them. Tell us about your business; we check the licence and write back within 2 working days.</p>
  <form id="af"><div class="row"><label style="flex:1">Type<select name="kind"><option value="lab">Diagnostic lab</option><option value="pharmacy">Pharmacy</option><option value="hospital">Hospital / clinic</option></select></label><label style="flex:2">Business name<input name="name" required maxlength="120"></label></div>
  <div class="row"><label style="flex:1">Contact person<input name="contact" maxlength="80"></label><label style="flex:1">Mobile<input name="phone" required inputmode="tel" maxlength="14"></label><label style="flex:1">Email<input name="email" type="email" required></label></div>
  <div class="row"><label style="flex:2">Address<input name="address" maxlength="240"></label><label style="flex:1">Area<input name="area" maxlength="80"></label></div>
  <div class="row"><label style="flex:1">City<input name="city" required maxlength="80"></label><label style="flex:1">PIN<input name="pin" maxlength="6" inputmode="numeric"></label><label style="flex:1">Licence / registration no.<input name="licence" required maxlength="64" placeholder="Drug licence · NABL · Clinical Establishment"></label><label style="flex:1">GSTIN<input name="gstin" maxlength="15"></label></div>
  <label>Services offered<input name="services" maxlength="300" placeholder="e.g. home collection, 24×7 pharmacy, OPD specialties"></label><label>Anything else<textarea name="note" rows="2"></textarea></label>
  <label class="ck" style="display:flex;gap:8px;align-items:flex-start;margin:10px 0"><input type="checkbox" name="accept" required> <span style="font-size:12.5px;color:var(--mute)">We hold the licences stated, will serve families at the listed prices, and accept the <a href="/terms" target="_blank">partner terms</a> (8% platform fee on orders through the app, settled monthly).</span></label>
  <p class="msg" id="am"></p><div class="row"><button class="btn p" id="ago">Send application</button><a href="#" id="back" class="btn">Back to sign in</a></div></form></div></div>`;
 $('#back').onclick=e=>{e.preventDefault();render()};
 $('#af').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target),b={};fd.forEach((v,k)=>b[k]=v);b.accept=!!fd.get('accept');const m=$('#am');m.className='msg';
  try{if(navigator.geolocation&&!b.lat){await new Promise(res=>navigator.geolocation.getCurrentPosition(p=>{b.lat=p.coords.latitude;b.lng=p.coords.longitude;res()},()=>res(),{timeout:4000}))}
   const r=await fetch('/api/v1/partner/apply',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});const j=await r.json();if(!r.ok)throw new Error(j.detail||'Could not send');
   e.target.innerHTML=`<p class="msg on ok">${E(j.message)} Reference: <b>${E(j.id)}</b></p><a href="#" id="back2" class="btn">Back to sign in</a>`;$('#back2').onclick=ev=>{ev.preventDefault();render()}}catch(err){m.className='msg on err';m.textContent=err.message}}}
render();load();setInterval(()=>{if(ME)load()},60000);
</script>
</body>

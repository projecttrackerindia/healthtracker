 const flags=[];['R','L'].forEach(sd=>{const a=last&&num((last[sd]||{}).sph),b=num(d[sd].sph);if(a!=null&&b!=null&&Math.abs(b-a)>=.25)flags.push(`<i class="a">${sd==='R'?'Right':'Left'} eye ${b-a>0?'+':'−'}${Math.abs(b-a).toFixed(2)} since ${E(new Date(last.date+'T00:00:00').toLocaleDateString('en-IN',{month:'short',year:'numeric'}))}</i>`)});

function packOrder(o){if(!o)return;const d=document.createElement('div');d.id='pkm';document.body.appendChild(d);const N=o.items.length;
 const CK='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"/></svg>';
 d.innerHTML=`<style>#pkm{position:fixed;inset:0;z-index:300;background:rgba(10,14,24,.42);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;place-items:center;padding:16px;animation:pkF .2s ease}
 @keyframes pkF{from{opacity:0}}@keyframes pkU{from{transform:translateY(24px) scale(.98);opacity:0}}@keyframes pkPop{0%{transform:scale(.5)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
 #pkm .ic{width:100%;max-width:440px;max-height:92vh;overflow:auto;background:#F2F2EF;border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.3);animation:pkU .35s cubic-bezier(.2,.8,.2,1)}
 #pkm .top{padding:22px 22px 6px;display:flex;align-items:flex-start;gap:12px}#pkm h2{margin:0;font-size:26px;letter-spacing:-.6px;font-weight:700}#pkm .sub{color:var(--ink2);font-size:14px;margin-top:3px}
 #pkm .x{width:32px;height:32px;border-radius:16px;border:0;background:#E5E5EA;color:var(--ink2);font-size:15px;cursor:pointer;flex:none;margin-left:auto}
 #pkm .prog{margin:14px 22px 0;height:6px;border-radius:3px;background:#E5E5EA;overflow:hidden}#pkm .prog i{display:block;height:6px;border-radius:3px;background:#34C759;width:0;transition:width .35s cubic-bezier(.2,.8,.2,1)}
 #pkm .sec{font-size:13px;font-weight:600;color:var(--ink3);letter-spacing:.2px;margin:18px 26px 8px;display:flex;justify-content:space-between}
 #pkm .grp{background:#fff;border-radius:18px;margin:0 16px;overflow:hidden}
 #pkm .it{display:flex;align-items:center;gap:14px;width:100%;border:0;background:#fff;padding:14px 16px;text-align:left;font:inherit;font-size:16px;color:#1D1D1F;cursor:pointer;position:relative;transition:background .2s}
 #pkm .it+.it:before{content:"";position:absolute;left:56px;right:0;top:0;height:.5px;background:#E5E5EA}
 #pkm .it:active{background:#F2F2EF}#pkm .it .dot{width:26px;height:26px;border-radius:13px;border:2px solid #C7C7CC;flex:none;display:grid;place-items:center;transition:all .2s}
 #pkm .it.on .dot{background:#34C759;border-color:#34C759;animation:pkPop .3s ease}#pkm .it .dot svg{opacity:0;transition:opacity .15s}#pkm .it.on .dot svg{opacity:1}
 #pkm .it.on .nm{color:var(--ink3)}#pkm .it .q{margin-left:auto;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums;background:#F2F2EF;border-radius:10px;padding:3px 9px;font-size:14px}
 #pkm .rx{font-size:11px;font-weight:700;color:#B25000;background:#FFF2E0;border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:2px}
 #pkm .amt{display:flex;align-items:center;background:#fff;border-radius:18px;margin:0 16px;padding:6px 18px}#pkm .amt span{font-size:28px;font-weight:600;color:var(--ink3)}
 #pkm .amt input{border:0;outline:0;background:none;font:inherit;font-size:34px;font-weight:700;letter-spacing:-.8px;width:100%;padding:8px 6px;color:#1D1D1F;font-variant-numeric:tabular-nums}
 #pkm .ph{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px}
 #pkm .ph label{position:relative;aspect-ratio:4/3;border-radius:18px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;overflow:hidden;background-size:cover;background-position:center;transition:transform .15s}
 #pkm .ph label:active{transform:scale(.97)}#pkm .ph .cam{width:46px;height:46px;border-radius:23px;background:#DDF3EE;display:grid;place-items:center}
 #pkm .ph b{font-size:14px}#pkm .ph small{font-size:12px;color:var(--ink3)}#pkm .ph label.set .cam,#pkm .ph label.set b,#pkm .ph label.set small{display:none}
 #pkm .ph label .ok{display:none;position:absolute;right:10px;top:10px;width:26px;height:26px;border-radius:13px;background:#34C759;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.25)}#pkm .ph label.set .ok{display:grid}
 #pkm .ph label .re{display:none;position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:600;border-radius:10px;padding:4px 9px}#pkm .ph label.set .re{display:block}
 #pkm .foot{position:sticky;bottom:0;padding:16px;background:linear-gradient(rgba(245,245,247,0),#F2F2EF 30%)}
 #pkm .go{display:block;width:100%;height:56px;border:0;border-radius:28px;background:#1D1D1F;color:#fff;font:inherit;font-size:17px;font-weight:600;cursor:pointer;transition:background .25s,transform .1s}
 #pkm .go.ready{background:#34C759}#pkm .nm small.bt{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px;font-weight:400}#pkm .nm small.bt.bad{color:#C4291C}#pkm .scn{position:relative;margin:14px 16px 0;height:170px;border-radius:20px;background:#1D1D1F;overflow:hidden;display:grid;place-items:center}#pkm .scn video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85}#pkm .scn i{position:absolute;left:22%;right:22%;top:24%;bottom:30%;border:3px solid rgba(255,255,255,.9);border-radius:16px}#pkm .scn span{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#fff;font-size:13px;font-weight:600}#pkm .scn button{position:relative;z-index:2;height:44px;border-radius:22px;border:0;background:#0B8A7C;color:#fff;font:inherit;font-weight:600;padding:0 20px;cursor:pointer}#pkm .hov{padding:28px 22px 22px;text-align:center}#pkm .hov .ok2{width:64px;height:64px;border-radius:32px;background:#34C759;display:grid;place-items:center;margin:0 auto 12px}#pkm .hov .hb{background:#E3F4F0;border-radius:20px;padding:16px;margin:18px 0}#pkm .hov .hb small{display:block;color:#0B6E63;font-weight:600;font-size:14px}#pkm .hov .hb b{display:block;font-size:46px;font-weight:700;letter-spacing:.12em;color:#0B8A7C;font-variant-numeric:tabular-nums}#pkm .hov .hb span{display:block;font-size:13px;color:#5F6B69}#pkm .go:active{transform:scale(.98)}#pkm .go:disabled{cursor:default}</style>
 <form class="ic" id="pkf"><div class="top"><div><h2>Pack order</h2><div class="sub">#${E(o.id)} · tap each medicine as it goes in the bag</div></div><button type="button" class="x" id="pkx" aria-label="Close">✕</button></div>
  <div class="prog"><i id="pkp"></i></div>
  <div class="sec"><span>MEDICINES</span><span id="pkc">0 of ${N}</span></div>
  ${'BarcodeDetector' in window?`<div class="scn" id="pkscn"><video playsinline muted id="pkv"></video><i></i><span id="pkst">Point at the barcode on the strip</span><button type="button" id="pkcam">Start scanner</button></div>`:''}
  <div class="grp">${o.items.map((i,k)=>`<button type="button" class="it" data-k="${k}" aria-pressed="false"><span class="dot">${CK}</span><span class="nm">${E(i.name)}${i.rx?'<span class="rx">Rx</span>':''}<small class="bt" id="bt${k}">${'BarcodeDetector' in window?'Scan the strip, or tap':'Tap as it goes in the bag'}</small></span><span class="q">×${i.qty||1}</span></button>`).join('')}</div>
  <div class="sec"><span>AMOUNT ON YOUR BILL</span></div>
  <div class="amt"><span>₹</span><input name="bill" type="number" inputmode="numeric" min="1" required value="${o.total||''}"></div>
  <div class="sec"><span>PHOTOS</span><span>exactly what leaves the shop</span></div>
  <div class="ph">${[['billPhoto','Bill','Required'],['bagPhoto','Sealed bag','Recommended']].map(([n,t,h])=>`<label data-ph="${n}"><span class="cam"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B8A7C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span><b>${t}</b><small>${h}</small><span class="ok">${CK}</span><span class="re">Retake</span><input type="file" name="${n}" accept="image/*" capture="environment" hidden></label>`).join('')}</div>
  <div class="foot"><button class="go" id="pkgo" disabled>Tap each medicine</button></div></form>`;
 const f=d.querySelector('#pkf'),go=d.querySelector('#pkgo'),on=new Set();
 const upd=()=>{const n=on.size,ph=!!f.billPhoto.files.length,amt=+f.bill.value>0;d.querySelector('#pkp').style.width=(100*n/N)+'%';d.querySelector('#pkc').textContent=`${n} of ${N}`;
  const ready=n===N&&ph&&amt;go.disabled=!ready;go.classList.toggle('ready',ready);
  go.textContent=n<N?`${N-n} more to pack`:!ph?'Add a photo of the bill':!amt?'Enter the bill amount':'Mark as packed'};
 d.querySelectorAll('.it').forEach(b=>b.onclick=()=>{const k=b.dataset.k;on.has(k)?on.delete(k):on.add(k);b.classList.toggle('on',on.has(k));b.setAttribute('aria-pressed',on.has(k));if(navigator.vibrate)navigator.vibrate(8);upd()});
 d.querySelectorAll('[data-ph]').forEach(l=>{const inp=l.querySelector('input');inp.onchange=()=>{const fl=inp.files[0];l.classList.toggle('set',!!fl);l.style.backgroundImage=fl?`url(${URL.createObjectURL(fl)})`:'';upd()}});
 f.bill.oninput=upd;d.querySelector('#pkx').onclick=()=>d.remove();d.onclick=e=>{if(e.target===d)d.remove()};
 f.onsubmit=async e=>{e.preventDefault();if(go.disabled)return;go.disabled=true;go.textContent='Saving…';const fd=new FormData();fd.append('lines',[...on].join(','));fd.append('bill',f.bill.value);fd.append('billPhoto',f.billPhoto.files[0]);if(f.bagPhoto.files[0])fd.append('bagPhoto',f.bagPhoto.files[0]);
  fd.append('scans',JSON.stringify(SC));
  try{const r=await api(`/orders/${o.id}/pack`,{method:'POST',raw:true,headers:{},body:fd});stopCam();const hc=r.pack&&r.pack.handover;loadOrders();if(typeof loadToday==='function'&&$('#tdy'))loadToday();
   d.querySelector('.ic').innerHTML=`<div class="hov"><div class="ok2">${CK.replace(/14/g,'30')}</div><h2>Packed</h2><div class="sub">The family has been told it leaves shortly.</div>${hc?`<div class="hb"><small>Handover code</small><b>${E(hc)}</b><span>${o.courier==='uh'?'Our rider says this at the counter. Hand the bag over only if it matches.':'Give the bag only to your own delivery person.'}</span></div>`:''}<button type="button" class="go ready" id="pkdone">Done</button></div>`;d.querySelector('#pkdone').onclick=()=>d.remove()}catch(err){toast(err.message);go.disabled=false;upd()}};
 const SC={};let CS=null,CT=0;const stopCam=()=>{clearInterval(CT);if(CS)CS.getTracks().forEach(t=>t.stop());CS=null};
 const gs1=t=>{t=String(t||'').replace(/^\][A-Za-z]\d/,'');const b=(t.match(/(?:^|\x1d|\(10\))(?:10)?([A-Za-z0-9-]{3,20})/)||[])[1];const m=t.match(/(?:\(17\)|17)(\d{2})(\d{2})(\d{2})/);return{batch:(t.match(/\(10\)([^\(\x1d]{1,20})/)||t.match(/\x1d?10([A-Za-z0-9-]{3,20})(?:\x1d|$)/)||[])[1]||'',exp:m?`${m[2]}/${m[1]}`:'',expired:m?new Date(2000+ +m[1],+m[2],0)<new Date():false,raw:t.slice(0,40)}};
 const cam=d.querySelector('#pkcam');if(cam)cam.onclick=async()=>{try{CS=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=d.querySelector('#pkv');v.srcObject=CS;await v.play();cam.remove();const det=new BarcodeDetector();let last='';
   CT=setInterval(async()=>{if(!d.isConnected)return stopCam();try{const c=(await det.detect(v))[0];if(!c||c.rawValue===last)return;last=c.rawValue;const g=gs1(c.rawValue),k=[...Array(N).keys()].map(String).find(x=>!on.has(x));if(k===undefined)return;const bt=d.querySelector('#bt'+k);
    if(g.expired){bt.textContent=`Expired ${g.exp} · use another strip`;bt.classList.add('bad');d.querySelector('#pkst').textContent='That strip has expired';if(navigator.vibrate)navigator.vibrate([60,40,60]);return}
    SC[k]={batch:g.batch,exp:g.exp,code:g.raw};on.add(k);const b=d.querySelector(`.it[data-k="${k}"]`);b.classList.add('on');b.setAttribute('aria-pressed',true);bt.classList.remove('bad');bt.textContent='Scanned'+(g.batch?' · batch '+g.batch:'')+(g.exp?' · exp '+g.exp:'');if(navigator.vibrate)navigator.vibrate(12);upd()}catch(_){}},350)}catch(_){toast('Allow the camera to scan, or tap each medicine')}};
 const dr=d.remove.bind(d);d.remove=()=>{stopCam();dr()};
 upd()}
try{RINGON=localStorage.getItem('uh-ring')==='1'}catch(_){}
document.addEventListener('pointerdown',()=>{try{ACTX=ACTX||new (window.AudioContext||window.webkitAudioContext)();ACTX.resume()}catch(_){}},{once:true});
setInterval(()=>{if(ME&&!document.getElementById('incm'))pollIncoming()},15000);setTimeout(()=>{if(ME)pollIncoming()},2500);

/* Every screen's headline carries the one number that matters there, in the design's pill (counted from the screen). */
const GBN={appts:m=>{const n=(m.textContent.match(/Asked for/g)||[]).length;return[n,n===1?'request':'requests']},
 queue:m=>{const x=(m.textContent.match(/Waiting\s*(\d+)/)||[])[1];return x!=null&&[+x,'waiting']},
 consults:m=>{const n=m.querySelectorAll('[data-join],[data-call]').length;return[n,'today']},
 orders:m=>{const n=m.querySelectorAll('[data-oid],[data-o],tr[data-id]').length;return n&&[n,'open']},
 stock:m=>{const x=(m.textContent.match(/(\d+) running low/i)||[])[1];return x!=null&&[+x,'running low']},
 reports:m=>{const t=m.querySelector('table');const n=t?[...t.querySelectorAll('tr')].filter(r=>r.querySelectorAll('td').length>1).length:0;return[n,'to upload']},
 blood:m=>{const n=m.querySelectorAll('[data-req],.breq').length;return[n,'open']}};
function gbHead(){const m=$('#main');if(!m)return;const h=m.querySelector('h1');if(!h||h.classList.contains('gbh1'))return;h.classList.add('gbsoft');
 const f=GBN[view];let r=null;try{r=f&&f(m)}catch(_){}let p=h.querySelector('.gbpill');if(!r){if(p)p.remove();return}
 const t=`${Number(r[0]).toLocaleString('en-IN')} ${r[1]}`;if(!p){h.insertAdjacentHTML('beforeend',' <span class="gbpill"></span>');p=h.querySelector('.gbpill')}if(p.textContent!==t)p.textContent=t}
new MutationObserver(()=>{clearTimeout(gbHead.k);gbHead.k=setTimeout(gbHead,120)}).observe(document.documentElement,{childList:true,subtree:true});
</script>

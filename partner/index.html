.login label{display:block}.login .row label input,.login .row label select{width:100%}

/* ================= Urban Health partner · Apple-style shell (Nov 2026 design) ================= */

:root{--bg:#F5F5F7;--card:#fff;--soft:#F2F2F5;--ink:#1D1D1F;--mute:#6E6E73;--line:rgba(0,0,0,.07);--blue:#0071E3;--green:#1A7F37;--amber:#9A5B00;--red:#C4291C;--ai:#5E5CE6;--r:22px;--teal:#0071E3;--sh:0 1px 2px rgba(0,0,0,.04);--font:Geist,Inter,-apple-system,BlinkMacSystemFont,system-ui,sans-serif}

html,body{background:var(--bg)}
.app{grid-template-columns:92px minmax(0,1fr)}
